 5$."}, {"id": 188, "topic": "Linear Equations", "subtopic": "Piecewise Linear", "type": "grid", "q": "A continuous piecewise linear function is defined by $f(x) = 3x + c$ for $x \\le 4$, and $f(x) = -2x + 25$ for $x > 4$. What is the value of $c$?", "ans": "5", "exp": "Continuity at $x = 4$ requires $3(4) + c = -2(4) + 25 \\implies 12 + c = 17 \\implies c = 5$."}, {"id": 189, "topic": "Linear Equations", "subtopic": "Slope & Intercepts", "type": "mcq", "q": "If the line $y = mx + b$ passes through Quadrants I, II, and IV, but NOT Quadrant III, which of the following must be true?", "options": ["$m < 0$ and $b > 0$", "$m > 0$ and $b < 0$", "$m < 0$ and $b < 0$", "$m > 0$ and $b > 0$"], "ans": "A", "exp": "A line avoiding Quadrant III must slant downward ($m < 0$) and have a positive $y$-intercept ($b > 0$)."}, {"id": 190, "topic": "Linear Equations", "subtopic": "Absolute Value Linear Equations", "type": "grid", "q": "For what positive value of $c$ does the equation $|2x - 8| = c$ have two solutions whose product is $-20$?", "ans": "12", "exp": "$2x - 8 = \\pm c \\implies x = 4 \\pm \\frac{c}{2}$. Product: $(4 + \\frac{c}{2})(4 - \\frac{c}{2}) = 16 - \\frac{c^2}{4} = -20 \\implies \\frac{c^2}{4} = 36 \\implies c = 12$."}, {"id": 191, "topic": "Linear Equations", "subtopic": "Distance & Midpoint", "type": "grid", "q": "What is the shortest distance from the origin $(0, 0)$ to the line $5x + 12y = 39$?", "ans": "3", "exp": "Using the distance formula: $d = \\frac{|5(0) + 12(0) - 39|}{\\sqrt{5^2 + 12^2}} = \\frac{39}{13} = 3$."}, {"id": 192, "topic": "Linear Equations", "subtopic": "Fractional Linear Equations", "type": "grid", "q": "If $\\frac{3}{x - 2} + \\frac{4}{2x - 4} = 5$, what is the value of $x$?", "ans": "3", "exp": "Notice $\\frac{4}{2(x - 2)} = \\frac{2}{x - 2}$. Combining gives $\\frac{5}{x - 2} = 5 \\implies x - 2 = 1 \\implies x = 3$."}, {"id": 193, "topic": "Linear Equations", "subtopic": "Parameters & No/Infinite Solutions", "type": "grid", "q": "In the equation $5(x - 2) + k = 3(x + 4) + 2x$, for what value of $k$ does the equation have INFINITELY MANY solutions?", "ans": "22", "exp": "Simplifying gives $5x - 10 + k = 5x + 12 \\implies -10 + k = 12 \\implies k = 22$."}, {"id": 194, "topic": "Linear Equations", "subtopic": "Table & Rate of Change", "type": "grid", "q": "A linear function $f$ satisfies $f(0) = -7$ and $f(4) = 13$. For what value of $x$ does $f(x) = 38$?", "ans": "9", "exp": "Slope $m = \\frac{13 - (-7)}{4 - 0} = 5$, so $f(x) = 5x - 7$. Setting $5x - 7 = 38 \\implies 5x = 45 \\implies x = 9$."}, {"id": 195, "topic": "Linear Equations", "subtopic": "Literal Equations", "type": "mcq", "q": "If $y = \\frac{ax + b}{cx - a}$, which of the following expresses $x$ in terms of $a, b, c,$ and $y$?", "options": ["$\\frac{ay + b}{cy - a}$", "$\\frac{b - ay}{cy + a}$", "$\\frac{ay - b}{cy + a}$", "$\\frac{b + a}{c - y}$"], "ans": "A", "exp": "$y(cx - a) = ax + b \\implies cxy - ay = ax + b \\implies x(cy - a) = ay + b \\implies x = \\frac{ay + b}{cy - a}$."}, {"id": 196, "topic": "Linear Equations", "subtopic": "Intercepts & Area", "type": "grid", "q": "What is the area of the region in the $xy$-plane bounded by the lines $y = 2x$, $y = -2x + 12$, and the $x$-axis?", "ans": "18", "exp": "The $x$-intercepts are $(0, 0)$ and $(6, 0)$ (base $= 6$). Intersection: $2x = -2x + 12 \\implies x = 3, y = 6$ (height $= 6$). Area $= \\frac{1}{2}(6)(6) = 18$."}, {"id": 197, "topic": "Linear Equations", "subtopic": "Perpendicular & Parallel Lines", "type": "grid", "q": "Line $A$ passes through $(1, 4)$ and $(5, -2)$. Line $B$ is perpendicular to Line $A$ and passes through $(3, 1)$. What is the $x$-intercept of Line $B$?", "ans": "1.5", "exp": "Slope of $A$ is $\\frac{-2 - 4}{5 - 1} = -\\frac{3}{2}$, so slope of $B$ is $\\frac{2}{3}$. Equation of $B$: $y - 1 = \\frac{2}{3}(x - 3)$. Setting $y = 0$: $-1 = \\frac{2}{3}(x - 3) \\implies x - 3 = -1.5 \\implies x = 1.5$."}, {"id": 198, "topic": "Linear Equations", "subtopic": "Function Notation", "type": "grid", "q": "If $f(x) = 4x - 9$, for what value of $k$ is $f(2k + 1) = 3f(k) - 2$?", "ans": "6", "exp": "$f(2k + 1) = 4(2k + 1) - 9 = 8k - 5$. $3f(k) - 2 = 3(4k - 9) - 2 = 12k - 29$. Setting them equal: $8k - 5 = 12k - 29 \\implies 4k = 24 \\implies k = 6$."}, {"id": 199, "topic": "Linear Equations", "subtopic": "Nested Linear Expressions", "type": "grid", "q": "If $0.4(5x - 15) + 1.2(10 - 2x) = 4.8$, what is the value of $x$?", "ans": "3", "exp": "$2x - 6 + 12 - 2.4x = 4.8 \\implies -0.4x + 6 = 4.8 \\implies -0.4x = -1.2 \\implies x = 3$."}, {"id": 200, "topic": "Linear Equations", "subtopic": "Slope & Intercepts", "type": "grid", "q": "A line in the $xy$-plane has slope $m$ and passes through $(4, 10)$. If its $x$-intercept is twice its $y$-intercept (and neither is $0$), what is the value of $m$?", "ans": "-0.5", "exp": "If $y$-intercept is $b$ and $x$-intercept is $2b$, the slope is $\\frac{0 - b}{2b - 0} = -\\frac{1}{2} = -0.5$."}, {"id": 201, "topic": "Systems of Equations", "subtopic": "No / Infinite Solutions", "type": "grid", "q": "In the system $6x - 9y = 15$ and $kx - 12y = 20$, for what value of $k$ does the system have INFINITELY MANY solutions?", "ans": "8", "exp": "Multiplying the first equation by $\\frac{4}{3}$ gives $8x - 12y = 20$, so $k = 8$."}, {"id": 202, "topic": "Systems of Equations", "subtopic": "No / Infinite Solutions", "type": "grid", "q": "For what value of $a$ does the system $ax + 6y = 14$ and $4x + (a + 2)y = 9$ have NO solution?", "ans": "4", "exp": "Parallel lines require $\\frac{a}{4} = \\frac{6}{a + 2} \\implies a^2 + 2a - 24 = 0 \\implies (a + 6)(a - 4) = 0$. Testing $a = 4$: $4x + 6y = 14$ and $4x + 6y = 9$ (no solution). Testing $a = -6$: $-6x + 6y = 14$ and $4x - 4y = 9$ (also no solution). Positive value is $4$."}, {"id": 203, "topic": "Systems of Equations", "subtopic": "Linear Combination Shortcuts", "type": "grid", "q": "If $7x + 11y = 43$ and $11x + 7y = 65$, what is the value of $x + y$?", "ans": "6", "exp": "Adding the two equations gives $18x + 18y = 108 \\implies 18(x + y) = 108 \\implies x + y = 6$."}, {"id": 204, "topic": "Systems of Equations", "subtopic": "Linear Combination Shortcuts", "type": "grid", "q": "Given $13x - 9y = 31$ and $8x - 14y = 11$, what is the value of $x + y$?", "ans": "4", "exp": "Subtracting the second equation from the first gives $(13x - 8x) + (-9y - (-14y)) = 31 - 11 \\implies 5x + 5y = 20 \\implies x + y = 4$."}, {"id": 205, "topic": "Systems of Equations", "subtopic": "Linear-Quadratic Systems", "type": "grid", "q": "In the $xy$-plane, the line $y = 4x + k$ is tangent to the parabola $y = x^2 - 2x + 13$ at a single point. What is the value of $k$?", "ans": "4", "exp": "Set equal: $x^2 - 2x + 13 = 4x + k \\implies x^2 - 6x + (13 - k) = 0$. One solution requires discriminant $\\Delta = (-6)^2 - 4(1)(13 - k) = 0 \\implies 36 - 52 + 4k = 0 \\implies 4k = 16 \\implies k = 4$."}, {"id": 206, "topic": "Systems of Equations", "subtopic": "Linear-Quadratic Systems", "type": "grid", "q": "How many real intersection points do the graphs of $y = 2x^2 - 5x + 9$ and $y = 3x + 1$ have?", "ans": "1", "exp": "$2x^2 - 5x + 9 = 3x + 1 \\implies 2x^2 - 8x + 8 = 0 \\implies 2(x - 2)^2 = 0$, which has $1$ repeated root ($x = 2$), so $1$ intersection point."}, {"id": 207, "topic": "Systems of Equations", "subtopic": "3-Variable Systems", "type": "grid", "q": "If $x + y = 12$, $y + z = 17$, and $x + z = 15$, what is the value of $x + y + z$?", "ans": "22", "exp": "Adding all three equations gives $2(x + y + z) = 12 + 17 + 15 = 44 \\implies x + y + z = 22$."}, {"id": 208, "topic": "Systems of Equations", "subtopic": "3-Variable Systems", "type": "grid", "q": "If $2a + b + c = 19$, $a + 2b + c = 22$, and $a + b + 2c = 23$, what is the value of $a + b + c$?", "ans": "16", "exp": "Adding all three equations gives $4(a + b + c) = 64 \\implies a + b + c = 16$."}, {"id": 209, "topic": "Systems of Equations", "subtopic": "Fractional Systems", "type": "grid", "q": "If $\\frac{1}{x} + \\frac{1}{y} = 7$ and $\\frac{1}{x} - \\frac{1}{y} = 3$, what is the value of $xy$?", "ans": "0.1", "exp": "Adding gives $\\frac{2}{x} = 10 \\implies x = \\frac{1}{5}$. Subtracting gives $\\frac{2}{y} = 4 \\implies y = \\frac{1}{2}$. Thus $xy = \\frac{1}{10} = 0.1$."}, {"id": 210, "topic": "Systems of Equations", "subtopic": "No / Infinite Solutions", "type": "grid", "q": "In the system $\\frac{2}{3}x - \\frac{1}{4}y = 5$ and $8x + ky = 60$, for what value of $k$ does the system have infinitely many solutions?", "ans": "-3", "exp": "Multiply the first equation by $12$: $8x - 3y = 60$. Matching with $8x + ky = 60$ gives $k = -3$."}, {"id": 211, "topic": "Systems of Equations", "subtopic": "Linear-Quadratic Systems", "type": "grid", "q": "The system $y = x^2 + 3x - 4$ and $y = 5x + 11$ has two solutions $(x_1, y_1)$ and $(x_2, y_2)$. What is the value of $y_1 + y_2$?", "ans": "32", "exp": "$x^2 + 3x - 4 = 5x + 11 \\implies x^2 - 2x - 15 = 0 \\implies (x - 5)(x + 3) = 0 \\implies x = 5, -3$. Corresponding $y$-values: $y_1 = 5(5) + 11 = 36$ and $y_2 = 5(-3) + 11 = -4$. Sum $= 36 + (-4) = 32$."}, {"id": 212, "topic": "Systems of Equations", "subtopic": "Exponential / Nonlinear Systems", "type": "grid", "q": "If $x^2 - y^2 = 45$ and $x - y = 5$, what is the value of $x$?", "ans": "7", "exp": "$(x - y)(x + y) = 45 \\implies 5(x + y) = 45 \\implies x + y = 9$. Adding $x - y = 5$ and $x + y = 9$ gives $2x = 14 \\implies x = 7$."}, {"id": 213, "topic": "Systems of Equations", "subtopic": "Exponential / Nonlinear Systems", "type": "grid", "q": "If $x + y = 8$ and $xy = 11$, what is the value of $x^2 + y^2$?", "ans": "42", "exp": "$(x + y)^2 = x^2 + 2xy + y^2 \\implies 64 = x^2 + 2(11) + y^2 \\implies x^2 + y^2 = 42$."}, {"id": 214, "topic": "Systems of Equations", "subtopic": "Parameters", "type": "grid", "q": "If $(3, -2)$ is the solution to the system $ax + by = 4$ and $bx - ay = 17$, what is the value of $a^2 + b^2$?", "ans": "23.46", "exp": "Wait: let's compute cleanly: $3a - 2b = 4$ and $3b + 2a = 17$. Squaring and adding both equations: $(3a - 2b)^2 + (2a + 3b)^2 = 16 + 289 = 305 \\implies 13a^2 + 13b^2 = 305 \\implies a^2 + b^2 = \\frac{305}{13}$. (In exact fraction: `305/13`)."}, {"id": 215, "topic": "Systems of Equations", "subtopic": "No / Infinite Solutions", "type": "mcq", "q": "For which value of $c$ does the system $3x - 5y = 12$ and $6x - 10y = c$ have NO solution?", "options": ["$c = 24$", "$c \\neq 24$", "$c = 12$", "$c = -24$"], "ans": "B", "exp": "Doubling the first equation gives $6x - 10y = 24$. For the second equation to represent a distinct parallel line (no solution), we must have $c \\neq 24$."}, {"id": 216, "topic": "Systems of Equations", "subtopic": "Linear-Quadratic Systems", "type": "grid", "q": "If $y = 2x^2 - 7$ and $y = x^2 + 2$, what is the positive value of $x$?", "ans": "3", "exp": "$2x^2 - 7 = x^2 + 2 \\implies x^2 = 9 \\implies x = 3$."}, {"id": 217, "topic": "Systems of Equations", "subtopic": "Linear Combination Shortcuts", "type": "grid", "q": "If $4x - 3y = 19$ and $2x + 5y = 3$, what is the value of $6x + 2y$?", "ans": "22", "exp": "Adding the two equations directly gives $(4x + 2x) + (-3y + 5y) = 19 + 3 \\implies 6x + 2y = 22$."}, {"id": 218, "topic": "Systems of Equations", "subtopic": "Parameters", "type": "grid", "q": "The system $y = 3x - 7$ and $y = mx + 5$ intersects at a point whose $x$-coordinate is $4$. What is the value of $m$?", "ans": "0", "exp": "At $x = 4$, $y = 3(4) - 7 = 5$. Substituting $(4, 5)$ into $y = mx + 5$ gives $5 = 4m + 5 \\implies m = 0$."}, {"id": 219, "topic": "Systems of Equations", "subtopic": "Absolute Value Systems", "type": "grid", "q": "How many solutions $(x, y)$ does the system $y = |x - 2| + 1$ and $y = 4$ have?", "ans": "2", "exp": "$|x - 2| + 1 = 4 \\implies |x - 2| = 3 \\implies x = 5$ or $x = -1$, giving $2$ intersection points: $(5, 4)$ and $(-1, 4)$."}, {"id": 220, "topic": "Systems of Equations", "subtopic": "3-Variable Systems", "type": "grid", "q": "If $x + 2y + 3z = 26$ and $x + y + z = 12$, what is the value of $y + 2z$?", "ans": "14", "exp": "Subtracting the second equation from the first gives $(x + 2y + 3z) - (x + y + z) = 26 - 12 \\implies y + 2z = 14$."}, {"id": 221, "topic": "Systems of Equations", "subtopic": "Linear-Quadratic Systems", "type": "grid", "q": "For what integer value of $b$ does the system $y = x^2 + bx + 9$ and $y = 0$ have exactly ONE solution?", "ans": "6", "exp": "$x^2 + bx + 9 = 0$ has one solution when $b^2 - 36 = 0 \\implies b = 6$ (or $-6$)."}, {"id": 222, "topic": "Systems of Equations", "subtopic": "Circle-Line Systems", "type": "grid", "q": "In the $xy$-plane, the line $x + y = 6$ intersects the circle $x^2 + y^2 = 20$ at two points $(x_1, y_1)$ and $(x_2, y_2)$. What is the value of $x_1 x_2$?", "ans": "8", "exp": "Substitute $y = 6 - x$: $x^2 + (6 - x)^2 = 20 \\implies 2x^2 - 12x + 16 = 0 \\implies x^2 - 6x + 8 = 0$. By Vieta's formulas, $x_1 x_2 = 8$."}, {"id": 223, "topic": "Systems of Equations", "subtopic": "No / Infinite Solutions", "type": "grid", "q": "The system $5x + 2y = 11$ and $15x + (k - 1)y = 33$ has infinitely many solutions. What is the value of $k$?", "ans": "7", "exp": "Multiplying the first equation by $3$ gives $15x + 6y = 33$, so $k - 1 = 6 \\implies k = 7$."}, {"id": 224, "topic": "Systems of Equations", "subtopic": "Exponential / Nonlinear Systems", "type": "grid", "q": "If $3^{x + y} = 81$ and $3^{x - y} = 9$, what is the value of $x$?", "ans": "3", "exp": "$x + y = 4$ and $x - y = 2$. Adding gives $2x = 6 \\implies x = 3$."}, {"id": 225, "topic": "Systems of Equations", "subtopic": "Linear Combination Shortcuts", "type": "grid", "q": "If $9x + 4y = 29$ and $3x - 2y = 13$, what is the value of $6x + 6y$?", "ans": "16", "exp": "Subtracting the second equation from the first gives $(9x - 3x) + (4y - (-2y)) = 29 - 13 \\implies 6x + 6y = 16$."}, {"id": 226, "topic": "Systems of Equations", "subtopic": "Parameters", "type": "grid", "q": "In the $xy$-plane, the lines $2x + 3y = 12$ and $4x - ky = 12$ intersect at a point on the $y$-axis. What is the value of $k$?", "ans": "-3", "exp": "The $y$-intercept of $2x + 3y = 12$ is $(0, 4)$. Substituting $(0, 4)$ into $4x - ky = 12$ gives $-4k = 12 \\implies k = -3$."}, {"id": 227, "topic": "Systems of Equations", "subtopic": "Linear-Quadratic Systems", "type": "grid", "q": "The graphs of $y = x^2 - 4x + 7$ and $y = -x^2 + 6x - 5$ intersect at two points. What is the sum of the $x$-coordinates of the two intersection points?", "ans": "5", "exp": "$x^2 - 4x + 7 = -x^2 + 6x - 5 \\implies 2x^2 - 10x + 12 = 0 \\implies x^2 - 5x + 6 = 0$. By Vieta's formulas, $x_1 + x_2 = 5$."}, {"id": 228, "topic": "Systems of Equations", "subtopic": "Fractional Systems", "type": "grid", "q": "If $\\frac{x}{3} + \\frac{y}{4} = 5$ and $\\frac{x}{6} - \\frac{y}{8} = 1$, what is the value of $x$?", "ans": "10.5", "exp": "Multiply the second equation by $2$: $\\frac{x}{3} - \\frac{y}{4} = 2$. Adding to the first equation gives $\\frac{2x}{3} = 7 \\implies x = 10.5$."}, {"id": 229, "topic": "Systems of Equations", "subtopic": "3-Variable Systems", "type": "grid", "q": "If $xy = 12$, $yz = 20$, and $xz = 15$, where $x, y, z > 0$, what is the value of $xyz$?", "ans": "60", "exp": "Multiplying all three equations gives $(xyz)^2 = 12 \\times 20 \\times 15 = 3600 \\implies xyz = 60$."}, {"id": 230, "topic": "Systems of Equations", "subtopic": "No / Infinite Solutions", "type": "grid", "q": "For what value of $m$ does the system $y = (2m - 1)x + 4$ and $y = (m + 5)x - 3$ have NO solution?", "ans": "6", "exp": "Parallel lines with different $y$-intercepts require $2m - 1 = m + 5 \\implies m = 6$."}, {"id": 231, "topic": "Systems of Equations", "subtopic": "Linear Combination Shortcuts", "type": "grid", "q": "If $5a - 2b = 17$ and $2a - 5b = 4$, what is the value of $a - b$?", "ans": "3", "exp": "Adding the two equations gives $7a - 7b = 21 \\implies 7(a - b) = 21 \\implies a - b = 3$."}, {"id": 232, "topic": "Systems of Equations", "subtopic": "Linear-Quadratic Systems", "type": "grid", "q": "If $(x, y)$ is a solution to $y = x^2 + 4$ and $x + y = 10$ with $x > 0$, what is the value of $y$?", "ans": "8", "exp": "$x + x^2 + 4 = 10 \\implies x^2 + x - 6 = 0 \\implies (x + 3)(x - 2) = 0$. Since $x > 0$, $x = 2$ and $y = 2^2 + 4 = 8$."}, {"id": 233, "topic": "Systems of Equations", "subtopic": "Parameters", "type": "grid", "q": "The solution to $3x + 2y = 16$ and $5x - y = 18$ is $(p, q)$. What is the value of $p^2 - q^2$?", "ans": "12", "exp": "From the second equation, $y = 5x - 18$. Substituting: $3x + 2(5x - 18) = 16 \\implies 13x = 52 \\implies x = 4$, so $y = 2$. Thus $4^2 - 2^2 = 12$."}, {"id": 234, "topic": "Systems of Equations", "subtopic": "Absolute Value Systems", "type": "grid", "q": "In the $xy$-plane, at how many points do the graphs of $y = |x|$ and $y = \\frac{1}{2}x + 3$ intersect?", "ans": "2", "exp": "For $x \\ge 0$: $x = 0.5x + 3 \\implies x = 6$ ($y = 6$). For $x < 0$: $-x = 0.5x + 3 \\implies -1.5x = 3 \\implies x = -2$ ($y = 2$). That is $2$ intersection points."}, {"id": 235, "topic": "Systems of Equations", "subtopic": "No / Infinite Solutions", "type": "grid", "q": "If the system $\\frac{x}{a} + \\frac{y}{b} = 1$ and $3x + 4y = 12$ has infinitely many solutions, what is the value of $a + b$?", "ans": "7", "exp": "Dividing $3x + 4y = 12$ by $12$ gives $\\frac{x}{4} + \\frac{y}{3} = 1$, so $a = 4$ and $b = 3 \\implies a + b = 7$."}, {"id": 236, "topic": "Systems of Equations", "subtopic": "Exponential / Nonlinear Systems", "type": "grid", "q": "If $x^2 + y^2 = 29$ and $xy = 10$, where $x > y > 0$, what is the value of $x - y$?", "ans": "3", "exp": "$(x - y)^2 = x^2 - 2xy + y^2 = 29 - 20 = 9$. Since $x > y$, $x - y = 3$."}, {"id": 237, "topic": "Systems of Equations", "subtopic": "Linear Combination Shortcuts", "type": "grid", "q": "If $12x + 19y = 53$ and $17x + 10y = 63$, what is the average (arithmetic mean) of $x$ and $y$?", "ans": "2", "exp": "Adding gives $29x + 29y = 116 \\implies x + y = 4$. The average is $\\frac{4}{2} = 2$."}, {"id": 238, "topic": "Systems of Equations", "subtopic": "Linear-Quadratic Systems", "type": "mcq", "q": "For what condition on $c$ does the system $y = x^2 + 5$ and $y = 2x + c$ have NO real solutions?", "options": ["$c < 4$", "$c > 4$", "$c < 5$", "$c > 6$"], "ans": "A", "exp": "$x^2 + 5 = 2x + c \\implies x^2 - 2x + (5 - c) = 0$. No real solutions when $\\Delta = 4 - 4(5 - c) < 0 \\implies 4 - 20 + 4c < 0 \\implies 4c < 16 \\implies c < 4$."}, {"id": 239, "topic": "Systems of Equations", "subtopic": "3-Variable Systems", "type": "grid", "q": "If $3x - y + 2z = 14$ and $x + 3y - 2z = 6$, what is the value of $2x + y$?", "ans": "10", "exp": "Adding the two equations eliminates $z$: $4x + 2y = 20 \\implies 2x + y = 10$."}, {"id": 240, "topic": "Systems of Equations", "subtopic": "Parameters", "type": "grid", "q": "In the $xy$-plane, lines $2x - y = 5$ and $x + 2y = 10$ intersect at $(h, k)$. What is the value of $h + k$?", "ans": "7", "exp": "From the first equation, $y = 2x - 5$. Substituting: $x + 2(2x - 5) = 10 \\implies 5x = 20 \\implies x = 4$, and $y = 3$. Thus $h + k = 4 + 3 = 7$."}, {"id": 241, "topic": "Quadratic Functions", "subtopic": "Vertex & Symmetry", "type": "grid", "q": "A quadratic function $f$ satisfies $f(-3) = f(9) = 14$ and has a maximum value of $32$. What is the value of $f(0)$?", "ans": "27.5", "exp": "By symmetry, the vertex $x$-coordinate is $h = \\frac{-3 + 9}{2} = 3$, so $f(x) = a(x - 3)^2 + 32$. Using $f(9) = 14$: $a(6)^2 + 32 = 14 \\implies 36a = -18 \\implies a = -0.5$. Then $f(0) = -0.5(-3)^2 + 32 = 27.5$."}, {"id": 242, "topic": "Quadratic Functions", "subtopic": "Discriminant Constraints", "type": "grid", "q": "The quadratic equation $3x^2 - kx + 12 = 0$ has no real solutions. What is the greatest possible integer value of $k$?", "ans": "11", "exp": "Discriminant $\\Delta = (-k)^2 - 4(3)(12) < 0 \\implies k^2 < 144 \\implies -12 < k < 12$. The greatest integer is $11$."}, {"id": 243, "topic": "Quadratic Functions", "subtopic": "Vieta's Formulas", "type": "grid", "q": "If $r$ and $s$ are the two solutions to $2x^2 - 10x + 7 = 0$, what is the value of $r^2 + s^2$?", "ans": "18", "exp": "By Vieta's formulas, $r + s = \\frac{10}{2} = 5$ and $rs = \\frac{7}{2} = 3.5$. Then $r^2 + s^2 = (r + s)^2 - 2rs = 25 - 7 = 18$."}, {"id": 244, "topic": "Quadratic Functions", "subtopic": "Vieta's Formulas", "type": "grid", "q": "The solutions to $3x^2 - 15x + 4 = 0$ are $p$ and $q$. What is the value of $\\frac{1}{p} + \\frac{1}{q}$?", "ans": "3.75", "exp": "$\\frac{1}{p} + \\frac{1}{q} = \\frac{p + q}{pq} = \\frac{15/3}{4/3} = \\frac{15}{4} = 3.75$."}, {"id": 245, "topic": "Quadratic Functions", "subtopic": "Vertex Form & Shifts", "type": "grid", "q": "The parabola $y = 2(x - 4)^2 - 9$ is shifted $3$ units left and $5$ units up. What is the $y$-intercept of the resulting parabola?", "ans": "-2", "exp": "New vertex is $(4 - 3, -9 + 5) = (1, -4)$, so $y = 2(x - 1)^2 - 4$. Setting $x = 0$ gives $y = 2(-1)^2 - 4 = -2$."}, {"id": 246, "topic": "Quadratic Functions", "subtopic": "Equivalent Forms", "type": "mcq", "q": "Which of the following equivalent forms of $f(x) = 3x^2 - 24x + 36$ displays the minimum value of $f$ as a constant or coefficient?", "options": ["$f(x) = 3(x - 4)^2 - 12$", "$f(x) = 3(x - 2)(x - 6)$", "$f(x) = 3(x^2 - 8x + 12)$", "$f(x) = 3x(x - 8) + 36$"], "ans": "A", "exp": "Vertex form $f(x) = a(x - h)^2 + k$ displays the minimum value $k = -12$ explicitly."}, {"id": 247, "topic": "Quadratic Functions", "subtopic": "Product & Sum of Roots", "type": "grid", "q": "In the equation $4x^2 + bx + c = 0$, the sum of the roots is $6$ and the product of the roots is $-5$. What is the value of $b + c$?", "ans": "-44", "exp": "$-\\frac{b}{4} = 6 \\implies b = -24$, and $\\frac{c}{4} = -5 \\implies c = -20$. Thus $b + c = -44$."}, {"id": 248, "topic": "Quadratic Functions", "subtopic": "Vertex & Symmetry", "type": "grid", "q": "The graph of $y = ax^2 + bx + c$ has vertex $(2, -18)$ and passes through $(5, 0)$. What is the value of $a + b + c$?", "ans": "-16", "exp": "Note that $a + b + c = f(1)$. Using $f(x) = a(x - 2)^2 - 18$: $0 = a(3)^2 - 18 \\implies a = 2$. Then $f(1) = 2(1 - 2)^2 - 18 = -16$."}, {"id": 249, "topic": "Quadratic Functions", "subtopic": "Discriminant Constraints", "type": "grid", "q": "If the parabola $y = kx^2 - 8x + k$ is tangent to the $x$-axis and opens downward, what is the value of $k$?", "ans": "-4", "exp": "Tangency to the $x$-axis gives $\\Delta = (-8)^2 - 4(k)(k) = 0 \\implies 64 - 4k^2 = 0 \\implies k = \\pm 4$. Opening downward requires $k < 0$, so $k = -4$."}, {"id": 250, "topic": "Quadratic Functions", "subtopic": "Projectile / Optimization", "type": "grid", "q": "The height $h(t)$ in meters of a ball $t$ seconds after launch is given by $h(t) = -5t^2 + 30t + 2$. What is the maximum height, in meters, reached by the ball?", "ans": "47", "exp": "Maximum occurs at $t = -\\frac{30}{2(-5)} = 3$ seconds: $h(3) = -5(9) + 30(3) + 2 = -45 + 90 + 2 = 47$."}, {"id": 251, "topic": "Quadratic Functions", "subtopic": "Factoring & Roots", "type": "grid", "q": "If $(x - 4)$ is a factor of $2x^2 + kx - 20$, what is the other $x$-intercept of the graph of $y = 2x^2 + kx - 20$?", "ans": "-2.5", "exp": "The product of the roots is $\\frac{-20}{2} = -10$. Since one root is $4$, the other is $\\frac{-10}{4} = -2.5$."}, {"id": 252, "topic": "Quadratic Functions", "subtopic": "Quadratic-like Equations", "type": "grid", "q": "What is the product of all real solutions to $(x^2 - 5)^2 - 10(x^2 - 5) + 24 = 0$?", "ans": "99", "exp": "Let $u = x^2 - 5$: $(u - 6)(u - 4) = 0 \\implies x^2 - 5 = 6$ ($x^2 = 11$) or $x^2 - 5 = 4$ ($x^2 = 9$). Product of roots $= (-\\sqrt{11})(\\sqrt{11})(-3)(3) = (-11)(-9) = 99$."}, {"id": 253, "topic": "Quadratic Functions", "subtopic": "Vertex & Symmetry", "type": "grid", "q": "A parabola has $x$-intercepts at $(-6, 0)$ and $(2, 0)$ and passes through $(0, -24)$. What is the $y$-coordinate of the vertex of this parabola?", "ans": "-32", "exp": "$y = a(x + 6)(x - 2)$. Plugging $(0, -24)$: $-24 = a(6)(-2) = -12a \\implies a = 2$. Vertex $x = -2$: $y = 2(4)(-4) = -32$."}, {"id": 254, "topic": "Quadratic Functions", "subtopic": "Vieta's Formulas", "type": "grid", "q": "If the roots of $x^2 - 9x + k = 0$ differ by $5$, what is the value of $k$?", "ans": "14", "exp": "Let roots be $r$ and $s$: $r + s = 9$ and $r - s = 5 \\implies r = 7, s = 2$. Thus $k = rs = 14$."}, {"id": 255, "topic": "Quadratic Functions", "subtopic": "Quadrant Analysis", "type": "mcq", "q": "In the $xy$-plane, the parabola $y = a(x - h)^2 + k$ has $a < 0$, $h > 0$, and $k < 0$. Which quadrant(s) contain points on this parabola?", "options": ["Quadrants III and IV only", "Quadrant IV only", "Quadrants I, II, III, and IV", "Quadrants II, III, and IV only"], "ans": "A", "exp": "The vertex $(h, k)$ is in Quadrant IV and the parabola opens downward ($a < 0$), so $y \\le k < 0$ everywhere. Thus it only enters Quadrants III and IV."}, {"id": 256, "topic": "Quadratic Functions", "subtopic": "Discriminant Constraints", "type": "grid", "q": "For what value of $c$ does the equation $2x^2 - 12x + c = 5$ have exactly one real solution?", "ans": "23", "exp": "$2x^2 - 12x + (c - 5) = 0$. Setting $\\Delta = (-12)^2 - 4(2)(c - 5) = 0 \\implies 144 - 8c + 40 = 0 \\implies 8c = 184 \\implies c = 23$."}, {"id": 257, "topic": "Quadratic Functions", "subtopic": "Vertex & Symmetry", "type": "grid", "q": "The quadratic function $g(x) = -2x^2 + bx + c$ has its maximum at $x = 5$. If $g(2) = 7$, what is the value of $g(8)$?", "ans": "7", "exp": "Since $x = 2$ and $x = 8$ are equidistant from the axis of symmetry $x = 5$ ($5 - 2 = 3$ and $8 - 5 = 3$), $g(8) = g(2) = 7$."}, {"id": 258, "topic": "Quadratic Functions", "subtopic": "Completing the Square", "type": "grid", "q": "When $3x^2 + 18x + 11$ is written in the form $a(x + h)^2 + k$, what is the value of $a + h + k$?", "ans": "-10", "exp": "$3(x^2 + 6x + 9) + 11 - 27 = 3(x + 3)^2 - 16$. Here $a = 3, h = 3, k = -16 \\implies 3 + 3 - 16 = -10$."}, {"id": 259, "topic": "Quadratic Functions", "subtopic": "Factoring & Roots", "type": "grid", "q": "What is the positive difference between the two solutions of $6x^2 - x - 15 = 0$? (Express as a fraction or decimal.)", "ans": "19/6", "exp": "Factoring: $(2x + 3)(3x - 5) = 0 \\implies x = -\\frac{3}{2}$ and $x = \\frac{5}{3}$. Difference $= \\frac{5}{3} - (-\\frac{3}{2}) = \\frac{10 + 9}{6} = \\frac{19}{6}$."}, {"id": 260, "topic": "Quadratic Functions", "subtopic": "Intersection with Axes", "type": "grid", "q": "What is the distance between the $x$-intercepts of the graph of $y = 2x^2 - 14x + 20$?", "ans": "3", "exp": "$2(x^2 - 7x + 10) = 2(x - 2)(x - 5) = 0 \\implies x = 2$ and $x = 5$. Distance $= 5 - 2 = 3$."}, {"id": 261, "topic": "Quadratic Functions", "subtopic": "Vieta's Formulas", "type": "grid", "q": "If $r$ and $s$ are the roots of $x^2 - 6x + 4 = 0$, what is the value of $(r - s)^2$?", "ans": "20", "exp": "$(r - s)^2 = (r + s)^2 - 4rs = 6^2 - 4(4) = 36 - 16 = 20$."}, {"id": 262, "topic": "Quadratic Functions", "subtopic": "Parameters", "type": "grid", "q": "If $x = -3$ is one solution to $ax^2 + 7x - 6 = 0$, what is the other solution? (Express as a fraction or decimal.)", "ans": "2/3", "exp": "Substitute $x = -3$: $9a - 21 - 6 = 0 \\implies 9a = 27 \\implies a = 3$. Product of roots is $\\frac{-6}{3} = -2$, so the other root is $\\frac{-2}{-3} = \\frac{2}{3}$."}, {"id": 263, "topic": "Quadratic Functions", "subtopic": "Projectile / Optimization", "type": "grid", "q": "A store sells $200$ shirts per week at $\\$25$ each. For every $\\$1$ increase in price, weekly sales drop by $5$ shirts. What price per shirt (in dollars) maximizes weekly revenue?", "ans": "32.5", "exp": "$R(x) = (25 + x)(200 - 5x)$ has roots at $x = -25$ and $x = 40$. Vertex is at $x = \\frac{-25 + 40}{2} = 7.5$, so optimal price $= 25 + 7.5 = 32.5$."}, {"id": 264, "topic": "Quadratic Functions", "subtopic": "Vertex Form & Shifts", "type": "grid", "q": "The function $f(x) = x^2 - 6x + 13$ is reflected across the $x$-axis to form $g(x)$. What is the maximum value of $g(x)$?", "ans": "-4", "exp": "$f(x) = (x - 3)^2 + 4$ has minimum $4$. Reflecting across the $x$-axis gives $g(x) = -(x - 3)^2 - 4$, which has maximum $-4$."}, {"id": 265, "topic": "Quadratic Functions", "subtopic": "Discriminant Constraints", "type": "grid", "q": "How many real solutions does the equation $5x^2 - 4x + 2 = 0$ have?", "ans": "0", "exp": "$\\Delta = (-4)^2 - 4(5)(2) = 16 - 40 = -24 < 0$, so $0$ real solutions."}, {"id": 266, "topic": "Quadratic Functions", "subtopic": "Parameters", "type": "grid", "q": "The quadratic function $f(x) = ax^2 + bx + c$ passes through $(0, 5)$, $(1, 12)$, and $(2, 23)$. What is the value of $a$?", "ans": "2", "exp": "$c = 5$. From $(1, 12)$: $a + b = 7$. From $(2, 23)$: $4a + 2b = 18 \\implies 2a + b = 9$. Subtracting gives $a = 2$."}, {"id": 267, "topic": "Quadratic Functions", "subtopic": "Quadratic-like Equations", "type": "grid", "q": "What is the sum of all real solutions to $x - 7\\sqrt{x} + 12 = 0$?", "ans": "25", "exp": "Let $u = \\sqrt{x}$: $(u - 3)(u - 4) = 0 \\implies \\sqrt{x} = 3 \\implies x = 9$ or $\\sqrt{x} = 4 \\implies x = 16$. Sum $= 9 + 16 = 25$."}, {"id": 268, "topic": "Quadratic Functions", "subtopic": "Vertex & Symmetry", "type": "grid", "q": "In the $xy$-plane, the parabola $y = 3x^2 + bx - 7$ has its vertex on the line $x = -4$. What is the value of $b$?", "ans": "24", "exp": "$-\\frac{b}{2(3)} = -4 \\implies -\\frac{b}{6} = -4 \\implies b = 24$."}, {"id": 269, "topic": "Quadratic Functions", "subtopic": "Vieta's Formulas", "type": "grid", "q": "If $p$ and $q$ are the roots of $x^2 + 5x - 3 = 0$, what is the value of $p^3 + q^3$?", "ans": "-170", "exp": "$p + q = -5$ and $pq = -3$. Using $p^3 + q^3 = (p + q)^3 - 3pq(p + q) = (-5)^3 - 3(-3)(-5) = -125 - 45 = -170$."}, {"id": 270, "topic": "Quadratic Functions", "subtopic": "Factoring & Roots", "type": "mcq", "q": "If $a > 0$ and $b > 0$, which of the following could be the graph of $y = -a(x + b)^2 + b$?", "options": ["Opens downward with vertex in Quadrant II", "Opens downward with vertex in Quadrant I", "Opens upward with vertex in Quadrant II", "Opens downward with vertex in Quadrant III"], "ans": "A", "exp": "Since $-a < 0$, it opens downward. The vertex is $(-b, b)$, which has negative $x$-coordinate and positive $y$-coordinate (Quadrant II)."}, {"id": 271, "topic": "Quadratic Functions", "subtopic": "Intersection with Axes", "type": "grid", "q": "A parabola with equation $y = a(x - 3)^2 - 16$ passes through $(7, 0)$. What is the $y$-intercept of this parabola?", "ans": "-7", "exp": "$0 = a(7 - 3)^2 - 16 \\implies 16a = 16 \\implies a = 1$. Setting $x = 0$: $y = 1(-3)^2 - 16 = -7$."}, {"id": 272, "topic": "Quadratic Functions", "subtopic": "Discriminant Constraints", "type": "grid", "q": "For what positive value of $m$ does $mx^2 + 12x + m = 0$ have exactly one real root?", "ans": "6", "exp": "$12^2 - 4(m)(m) = 0 \\implies 4m^2 = 144 \\implies m^2 = 36 \\implies m = 6$."}, {"id": 273, "topic": "Quadratic Functions", "subtopic": "Equivalent Forms", "type": "grid", "q": "If $2x^2 + bx + 18 = 2(x - c)^2$ for all real $x$, and $c > 0$, what is the value of $b + c$?", "ans": "-9", "exp": "$2(x^2 - 2cx + c^2) = 2x^2 - 4cx + 2c^2$. Thus $2c^2 = 18 \\implies c = 3$, and $b = -4(3) = -12$. Sum $= -12 + 3 = -9$."}, {"id": 274, "topic": "Quadratic Functions", "subtopic": "Vertex & Symmetry", "type": "grid", "q": "The minimum value of $f(x) = x^2 - 8x + c$ is $5$. What is the value of $c$?", "ans": "21", "exp": "Vertex is at $x = 4$: $f(4) = 16 - 32 + c = 5 \\implies c - 16 = 5 \\implies c = 21$."}, {"id": 275, "topic": "Quadratic Functions", "subtopic": "Quadratic-like Equations", "type": "grid", "q": "What is the sum of all real values of $x$ that satisfy $\\frac{1}{x^2} - \\frac{5}{x} + 6 = 0$? (Express as a fraction or decimal.)", "ans": "5/6", "exp": "Multiply by $x^2$: $6x^2 - 5x + 1 = 0 \\implies (3x - 1)(2x - 1) = 0 \\implies x = \\frac{1}{3}, \\frac{1}{2}$. Sum $= \\frac{5}{6}$."}, {"id": 276, "topic": "Quadratic Functions", "subtopic": "Projectile / Optimization", "type": "grid", "q": "Two numbers have a sum of $24$. What is the maximum possible value of their product?", "ans": "144", "exp": "$P(x) = x(24 - x) = -x^2 + 24x$, maximized at $x = 12$, giving $12 \\times 12 = 144$."}, {"id": 277, "topic": "Quadratic Functions", "subtopic": "Parameters", "type": "grid", "q": "If $f(x) = x^2 + kx + 15$ and $f(2) = f(6)$, what is the value of $f(0)$?", "ans": "15", "exp": "$f(0)$ is simply the constant term $15$."}, {"id": 278, "topic": "Quadratic Functions", "subtopic": "Vertex Form & Shifts", "type": "grid", "q": "A parabola has vertex $(-2, 5)$ and passes through $(-4, -3)$. If its equation is $y = ax^2 + bx + c$, what is the value of $c$?", "ans": "-3", "exp": "$y = a(x + 2)^2 + 5$. Using $(-4, -3)$: $-3 = a(-2)^2 + 5 \\implies 4a = -8 \\implies a = -2$. Setting $x = 0$: $c = -2(4) + 5 = -3$."}, {"id": 279, "topic": "Quadratic Functions", "subtopic": "Vieta's Formulas", "type": "grid", "q": "If $r$ and $s$ are the roots of $2x^2 + 7x - 9 = 0$, what is the value of $(r + 1)(s + 1)$?", "ans": "-7", "exp": "$(r + 1)(s + 1) = rs + (r + s) + 1 = -\\frac{9}{2} + (-\\frac{7}{2}) + 1 = -8 + 1 = -7$."}, {"id": 280, "topic": "Quadratic Functions", "subtopic": "Discriminant Constraints", "type": "grid", "q": "For what integer $k$ does $x^2 - 10x + k = 0$ have two equal real roots?", "ans": "25", "exp": "$(-10)^2 - 4(1)(k) = 0 \\implies 4k = 100 \\implies k = 25$."}, {"id": 281, "topic": "Functions", "subtopic": "Inverse Functions", "type": "grid", "q": "If $f(x) = \\frac{3x - 5}{2x + 1}$ for $x \\neq -\\frac{1}{2}$, what is the value of $f^{-1}(4)$?", "ans": "-1.8", "exp": "$f^{-1}(4)$ is the value of $x$ such that $f(x) = 4$: $\\frac{3x - 5}{2x + 1} = 4 \\implies 3x - 5 = 8x + 4 \\implies 5x = -9 \\implies x = -1.8$."}, {"id": 282, "topic": "Functions", "subtopic": "Inverse Functions", "type": "mcq", "q": "Which of the following is the inverse function $g^{-1}(x)$ of $g(x) = \\sqrt[3]{2x - 7} + 4$?", "options": ["$\\frac{(x - 4)^3 + 7}{2}$", "$\\frac{(x + 4)^3 - 7}{2}$", "$2(x - 4)^3 + 7$", "$\\frac{x^3 - 57}{2}$"], "ans": "A", "exp": "Set $y = \\sqrt[3]{2x - 7} + 4 \\implies y - 4 = \\sqrt[3]{2x - 7} \\implies (y - 4)^3 = 2x - 7 \\implies x = \\frac{(y - 4)^3 + 7}{2}$."}, {"id": 283, "topic": "Functions", "subtopic": "Inverse Functions", "type": "grid", "q": "The function $h$ is defined by $h(x) = (x - 3)^2 + 5$ for $x \\ge 3$. What is the value of $h^{-1}(21)$?", "ans": "7", "exp": "$(x - 3)^2 + 5 = 21 \\implies (x - 3)^2 = 16$. Since $x \\ge 3$, $x - 3 = 4 \\implies x = 7$."}, {"id": 284, "topic": "Functions", "subtopic": "Inverse Functions", "type": "grid", "q": "If $f(x) = 4x - 7$ and $g(x) = 2x + 5$, what is the value of $(f^{-1} \\circ g)(6)$?", "ans": "6", "exp": "$g(6) = 2(6) + 5 = 17$. Now find $f^{-1}(17)$: $4x - 7 = 17 \\implies 4x = 24 \\implies x = 6$."}, {"id": 285, "topic": "Functions", "subtopic": "Inverse Functions", "type": "grid", "q": "A linear function $f$ satisfies $f(2) = 9$ and $f^{-1}(15) = 4$. What is the value of $f(0)$?", "ans": "3", "exp": "$f^{-1}(15) = 4$ means $f(4) = 15$. Slope $m = \\frac{15 - 9}{4 - 2} = 3$, so $f(x) = 3(x - 2) + 9 = 3x + 3 \\implies f(0) = 3$."}, {"id": 286, "topic": "Functions", "subtopic": "Inverse Functions", "type": "mcq", "q": "For what value of $k$ is the function $f(x) = \\frac{kx + 3}{2x - 5}$ equal to its own inverse $f^{-1}(x)$?", "options": ["$5$", "$-5$", "$2$", "$-2$"], "ans": "A", "exp": "Setting $y = \\frac{kx + 3}{2x - 5}$ and solving for $x$: $2xy - 5y = kx + 3 \\implies x(2y - k) = 5y + 3 \\implies x = \\frac{5y + 3}{2y - k}$. Matching with $\\frac{ky + 3}{2y - 5}$ gives $k = 5$."}, {"id": 287, "topic": "Functions", "subtopic": "Inverse Functions", "type": "grid", "q": "If $f(2x - 1) = 6x + 5$ for all real $x$, what is the value of $f^{-1}(23)$?", "ans": "5", "exp": "Set $6x + 5 = 23 \\implies 6x = 18 \\implies x = 3$. Then the input to $f$ is $2(3) - 1 = 5$, so $f(5) = 23 \\implies f^{-1}(23) = 5$."}, {"id": 288, "topic": "Functions", "subtopic": "Inverse Functions", "type": "grid", "q": "If $g(x) = 5x^3 - 3$, what is the value of $g^{-1}(37)$?", "ans": "2", "exp": "$5x^3 - 3 = 37 \\implies 5x^3 = 40 \\implies x^3 = 8 \\implies x = 2$."}, {"id": 289, "topic": "Functions", "subtopic": "Inverse Functions", "type": "mcq", "q": "In the $xy$-plane, the graph of $y = f(x)$ passes through $(-4, 7)$. Which point MUST lie on the graph of $y = 2f^{-1}(x) - 3$?", "options": ["$(7, -11)$", "$(-4, 11)$", "$(7, -4)$", "$(11, -4)$"], "ans": "A", "exp": "Since $f(-4) = 7$, $f^{-1}(7) = -4$. At $x = 7$, $y = 2f^{-1}(7) - 3 = 2(-4) - 3 = -11$."}, {"id": 290, "topic": "Functions", "subtopic": "Inverse Functions", "type": "grid", "q": "The graphs of $y = 3x - 8$ and its inverse $y = f^{-1}(x)$ intersect at the point $(a, b)$. What is the value of $a + b$?", "ans": "8", "exp": "A linear function and its inverse intersect on $y = x$: $3x - 8 = x \\implies 2x = 8 \\implies x = 4, y = 4$. Thus $a + b = 8$."}, {"id": 291, "topic": "Functions", "subtopic": "Compound / Composite Functions", "type": "grid", "q": "Let $f(x) = x^2 - 3x$ and $g(x) = 2x + 1$. What is the value of $f(g(-2)) - g(f(-2))$?", "ans": "-3", "exp": "$g(-2) = -3 \\implies f(-3) = 9 + 9 = 18$. $f(-2) = 4 + 6 = 10 \\implies g(10) = 21$. Difference $= 18 - 21 = -3$."}, {"id": 292, "topic": "Functions", "subtopic": "Compound / Composite Functions", "type": "grid", "q": "If $f(x) = 2x - 3$ and $g(x) = x^2 + k$, and $f(g(2)) = 19$, what is the value of $k$?", "ans": "7", "exp": "$g(2) = 4 + k$. Then $f(4 + k) = 2(4 + k) - 3 = 2k + 5 = 19 \\implies 2k = 14 \\implies k = 7$."}, {"id": 293, "topic": "Functions", "subtopic": "Compound / Composite Functions", "type": "mcq", "q": "If $f(x) = \\frac{1}{x - 1}$ and $g(x) = \\frac{x + 1}{x}$, which expression is equivalent to $f(g(x))$ for $x \\neq 0, 1$?", "options": ["$x$", "$\\frac{1}{x}$", "$x - 1$", "$\\frac{x}{x + 1}$"], "ans": "A", "exp": "$f(g(x)) = \\frac{1}{\\frac{x + 1}{x} - 1} = \\frac{1}{\\frac{x + 1 - x}{x}} = \\frac{1}{1/x} = x$."}, {"id": 294, "topic": "Functions", "subtopic": "Compound / Composite Functions", "type": "grid", "q": "Given $h(x) = 3x - 4$, what is the value of $h(h(h(2)))$?", "ans": "2", "exp": "$h(2) = 2$, so $h(h(2)) = h(2) = 2$, and $h(h(h(2))) = 2$."}, {"id": 295, "topic": "Functions", "subtopic": "Compound / Composite Functions", "type": "grid", "q": "If $f(x + 2) = x^2 + 5x - 1$, what is the value of $f(5)$?", "ans": "23", "exp": "Set $x + 2 = 5 \\implies x = 3$. Then $f(5) = 3^2 + 5(3) - 1 = 9 + 15 - 1 = 23$."}, {"id": 296, "topic": "Functions", "subtopic": "Compound / Composite Functions", "type": "grid", "q": "Let $p(x) = \\sqrt{x + 7}$ and $q(x) = x^2 - 3$. What is the sum of all real values of $x$ for which $p(q(x)) = 5$?", "ans": "0", "exp": "$\\sqrt{(x^2 - 3) + 7} = 5 \\implies x^2 + 4 = 25 \\implies x^2 = 21 \\implies x = \\pm\\sqrt{21}$, whose sum is $0$."}, {"id": 297, "topic": "Functions", "subtopic": "Compound / Composite Functions", "type": "grid", "q": "If $f(x) = 3x + 2$ and $f(g(x)) = 6x^2 - 9x + 5$, what is the value of $g(3)$?", "ans": "10", "exp": "$3g(x) + 2 = 6x^2 - 9x + 5 \\implies 3g(x) = 6x^2 - 9x + 3 \\implies g(x) = 2x^2 - 3x + 1$. Thus $g(3) = 2(9) - 9 + 1 = 10$."}, {"id": 298, "topic": "Functions", "subtopic": "Compound / Composite Functions", "type": "grid", "q": "Let $f(x) = |x - 5|$ and $g(x) = 2x - 7$. What is the value of $f(g(1)) + g(f(1))$?", "ans": "11", "exp": "$g(1) = -5 \\implies f(-5) = |-10| = 10$. $f(1) = |-4| = 4 \\implies g(4) = 1$. Sum $= 10 + 1 = 11$."}, {"id": 299, "topic": "Functions", "subtopic": "Compound / Composite Functions", "type": "mcq", "q": "If $f(x) = 2^x$ and $g(x) = 3x - 1$, which expression equals $f(g(x + 1))$?", "options": ["$4 \\cdot 8^x$", "$2 \\cdot 8^x$", "$8 \\cdot 2^x$", "$3 \\cdot 2^{x+1} - 1$"], "ans": "A", "exp": "$g(x + 1) = 3(x + 1) - 1 = 3x + 2$. Then $f(3x + 2) = 2^{3x + 2} = 2^2 \\cdot (2^3)^x = 4 \\cdot 8^x$."}, {"id": 300, "topic": "Functions", "subtopic": "Compound / Composite Functions", "type": "grid", "q": "Suppose $f(x) = 2x + b$ and $g(x) = 3x + d$. If $f(g(x)) = 6x + 11$ and $g(f(x)) = 6x + 8$, what is the value of $b + d$?", "ans": "6", "exp": "$f(g(x)) = 2(3x + d) + b = 6x + 2d + b = 6x + 11$, and $g(f(x)) = 3(2x + b) + d = 6x + 3b + d = 6x + 8$. Solving $2d + b = 11$ and $3b + d = 8$ gives $b = 1, d = 5 \\implies b + d = 6$."}, {"id": 301, "topic": "Functions", "subtopic": "Domain", "type": "grid", "q": "What is the smallest integer in the domain of $f(x) = \\sqrt{3x - 14} + \\frac{1}{x - 6}$?", "ans": "5", "exp": "$3x - 14 \\ge 0 \\implies x \\ge 4.67$, and $x \\neq 6$. The smallest integer $\\ge 4.67$ is $5$."}, {"id": 302, "topic": "Functions", "subtopic": "Domain", "type": "grid", "q": "How many integers ARE in the domain of $g(x) = \\frac{x + 3}{\\sqrt{25 - x^2}}$?", "ans": "9", "exp": "$25 - x^2 > 0 \\implies -5 < x < 5$. The integers in $(-5, 5)$ are $-4, -3, -2, -1, 0, 1, 2, 3, 4$, which is $9$ integers."}, {"id": 303, "topic": "Functions", "subtopic": "Domain", "type": "mcq", "q": "Which of the following is the domain of $h(x) = \\frac{\\sqrt{x + 4}}{x^2 - 9}$?", "options": ["$x \\ge -4$ and $x \\neq 3, -3$", "$x > -4$ and $x \\neq 3$", "$x \\ge -4$ and $x \\neq 3$", "$-4 \\le x < 3$"], "ans": "A", "exp": "Numerator requires $x + 4 \\ge 0 \\implies x \\ge -4$. Denominator requires $x^2 - 9 \\neq 0 \\implies x \\neq 3, -3$ (both $\\ge -4$)."}, {"id": 304, "topic": "Functions", "subtopic": "Domain", "type": "grid", "q": "What is the sum of all real numbers excluded from the domain of $f(x) = \\frac{x - 1}{x^3 - 7x^2 + 10x}$?", "ans": "7", "exp": "Denominator $= x(x - 2)(x - 5) = 0 \\implies x = 0, 2, 5$. Sum $= 0 + 2 + 5 = 7$."}, {"id": 305, "topic": "Functions", "subtopic": "Domain", "type": "grid", "q": "If $f(x) = \\sqrt{x - 2}$ and $g(x) = \\frac{1}{x - 5}$, what is the smallest integer in the domain of the composite function $g(f(x))$?", "ans": "2", "exp": "$g(f(x)) = \\frac{1}{\\sqrt{x - 2} - 5}$. Domain requires $x - 2 \\ge 0$ ($x \\ge 2$) and $\\sqrt{x - 2} \\neq 5$ ($x \\neq 27$). Smallest integer is $2$."}, {"id": 306, "topic": "Functions", "subtopic": "Domain", "type": "grid", "q": "What is the smallest integer value of $k$ for which the domain of $f(x) = \\frac{1}{x^2 - 6x + k}$ is the set of ALL real numbers?", "ans": "10", "exp": "The denominator has no real roots when $\\Delta = 36 - 4k < 0 \\implies k > 9$. The smallest integer greater than $9$ is $10$."}, {"id": 307, "topic": "Functions", "subtopic": "Domain", "type": "mcq", "q": "What is the domain of $p(x) = \\sqrt{6 - 2x} + \\sqrt{x + 5}$?", "options": ["$-5 \\le x \\le 3$", "$x \\le 3$", "$x \\ge -5$", "$-3 \\le x \\le 5$"], "ans": "A", "exp": "$6 - 2x \\ge 0 \\implies x \\le 3$, and $x + 5 \\ge 0 \\implies x \\ge -5$. Intersection: $-5 \\le x \\le 3$."}, {"id": 308, "topic": "Functions", "subtopic": "Domain", "type": "grid", "q": "How many integers are in the domain of $f(x) = \\sqrt{16 - x^2} + \\frac{1}{x}$?", "ans": "8", "exp": "$16 - x^2 \\ge 0 \\implies -4 \\le x \\le 4$ ($9$ integers), excluding $x = 0$, leaving $8$ integers."}, {"id": 309, "topic": "Functions", "subtopic": "Domain", "type": "grid", "q": "What is the greatest integer NOT in the domain of $f(x) = \\sqrt{4x - 19}$?", "ans": "4", "exp": "Domain is $4x - 19 \\ge 0 \\implies x \\ge 4.75$. Thus integers $\\le 4$ are excluded; the greatest is $4$."}, {"id": 310, "topic": "Functions", "subtopic": "Domain", "type": "mcq", "q": "If the domain of $f(x)$ is $[-2, 6]$, what is the domain of $g(x) = f(2x - 4)$?", "options": ["$[1, 5]$", "$[-8, 8]$", "$[-1, 3]$", "$[0, 4]$"], "ans": "A", "exp": "$-2 \\le 2x - 4 \\le 6 \\implies 2 \\le 2x \\le 10 \\implies 1 \\le x \\le 5$."}, {"id": 311, "topic": "Functions", "subtopic": "Range", "type": "mcq", "q": "What is the range of the function $f(x) = -3(x + 2)^2 + 11$?", "options": ["$y \\le 11$", "$y \\ge 11$", "$y \\le -2$", "All real numbers"], "ans": "A", "exp": "Since the parabola opens downward with vertex $(-2, 11)$, the maximum output is $11$, so $y \\le 11$."}, {"id": 312, "topic": "Functions", "subtopic": "Range", "type": "grid", "q": "The function $g(x) = x^2 - 4x + 7$ is defined on the restricted domain $0 \\le x \\le 5$. What is the difference between the maximum value and the minimum value in the range of $g$?", "ans": "9", "exp": "$g(x) = (x - 2)^2 + 3$. On $[0, 5]$, minimum is at vertex $x = 2$: $g(2) = 3$. Maximum is at endpoint $x = 5$: $g(5) = 9 + 3 = 12$. Difference $= 12 - 3 = 9$."}, {"id": 313, "topic": "Functions", "subtopic": "Range", "type": "mcq", "q": "What is the range of $h(x) = 4\\sqrt{x - 3} - 5$?", "options": ["$y \\ge -5$", "$y \\ge 3$", "$y \\ge 0$", "$y \\le -5$"], "ans": "A", "exp": "Since $\\sqrt{x - 3} \\ge 0$, $4\\sqrt{x - 3} - 5 \\ge -5$."}, {"id": 314, "topic": "Functions", "subtopic": "Range", "type": "mcq", "q": "What is the range of the exponential function $f(x) = -2(3)^x + 7$?", "options": ["$y < 7$", "$y > 7$", "$y \\le 7$", "$y > -2$"], "ans": "A", "exp": "Since $3^x > 0$, $-2(3)^x < 0$, so $-2(3)^x + 7 < 7$."}, {"id": 315, "topic": "Functions", "subtopic": "Range", "type": "grid", "q": "What is the minimum integer value in the range of $f(x) = 2|x - 6| - 9$?", "ans": "-9", "exp": "Since $|x - 6| \\ge 0$, the minimum value is $2(0) - 9 = -9$."}, {"id": 316, "topic": "Functions", "subtopic": "Range", "type": "mcq", "q": "Which real number is NOT in the range of $f(x) = \\frac{4x + 1}{x - 2}$?", "options": ["$4$", "$2$", "$-\\frac{1}{2}$", "$0$"], "ans": "A", "exp": "The horizontal asymptote is $y = \\frac{4}{1} = 4$. Setting $\\frac{4x + 1}{x - 2} = 4$ gives $4x + 1 = 4x - 8$, which has no solution."}, {"id": 317, "topic": "Functions", "subtopic": "Range", "type": "grid", "q": "How many integers are in the range of $f(x) = \\frac{12}{x^2 + 3}$ for all real numbers $x$?", "ans": "4", "exp": "Since $x^2 \\ge 0$, $x^2 + 3 \\ge 3$, so $0 < \\frac{12}{x^2 + 3} \\le 4$. The integers in $(0, 4]$ are $1, 2, 3, 4$ ($4$ integers)."}, {"id": 318, "topic": "Functions", "subtopic": "Range", "type": "mcq", "q": "If the range of $f(x)$ is $[-3, 5]$, what is the range of $g(x) = 2f(x - 4) + 1$?", "options": ["$[-5, 11]$", "$[-7, 1]$", "$[-3, 5]$", "$[-6, 10]$"], "ans": "A", "exp": "Horizontal shift doesn't change the range. Scaling by $2$ and adding $1$: $[2(-3) + 1, 2(5) + 1] = [-5, 11]$."}, {"id": 319, "topic": "Functions", "subtopic": "Range", "type": "grid", "q": "What is the maximum value in the range of $f(x) = 15 - 2|3x + 9|$?", "ans": "15", "exp": "Since $-2|3x + 9| \\le 0$, the maximum value is $15 - 0 = 15$."}, {"id": 320, "topic": "Functions", "subtopic": "Range", "type": "grid", "q": "The function $f(x) = -x^2 + 6x - 2$ has domain $1 \\le x \\le 4$. What is the smallest integer in the range of $f$?", "ans": "3", "exp": "$f(x) = -(x - 3)^2 + 7$. On $[1, 4]$, $x = 1$ is farthest from vertex $3$: $f(1) = -(1 - 3)^2 + 7 = -4 + 7 = 3$."}, {"id": 321, "topic": "Word Problems", "subtopic": "Systems of Equations Word Problems", "type": "grid", "q": "A coffee roaster blends Ethiopian beans costing $\\$18$/kg and Colombian beans costing $\\$12$/kg to produce $50$ kg of a blend sold at $\\$14.40$/kg with zero profit markup over raw bean cost. How many kilograms of Ethiopian beans are used?", "ans": "20", "exp": "Let $e$ be Ethiopian kg and $c$ be Colombian kg: $e + c = 50$ and $18e + 12c = 14.4(50) = 720$. Substituting $c = 50 - e$: $18e + 600 - 12e = 720 \\implies 6e = 120 \\implies e = 20$."}, {"id": 322, "topic": "Word Problems", "subtopic": "Systems of Equations Word Problems", "type": "grid", "q": "At a tech conference, standard passes cost $\\$120$ and VIP passes cost $\\$275$. Total revenue from $340$ passes sold was $\\$55,680$. How many VIP passes were sold?", "ans": "96", "exp": "Let $s$ be standard and $v$ be VIP: $s + v = 340$ and $120s + 275v = 55680$. Substituting $s = 340 - v$: $40800 + 155v = 55680 \\implies 155v = 14880 \\implies v = 96$."}, {"id": 323, "topic": "Word Problems", "subtopic": "Systems of Equations Word Problems", "type": "grid", "q": "A boat travels $36$ km downstream in $2$ hours and returns the same $36$ km upstream in $3$ hours at constant speeds in still water and a constant current. What is the speed of the boat in still water, in km/h?", "ans": "15", "exp": "Downstream speed $b + c = \\frac{36}{2} = 18$; upstream speed $b - c = \\frac{36}{3} = 12$. Adding gives $2b = 30 \\implies b = 15$ km/h."}, {"id": 324, "topic": "Word Problems", "subtopic": "Systems of Equations Word Problems", "type": "grid", "q": "In a two-digit number, the sum of the digits is $11$. When the digits are reversed, the new number is $27$ less than the original number. What is the original number?", "ans": "74", "exp": "Let tens digit be $t$ and units digit be $u$: $t + u = 11$ and $(10t + u) - (10u + t) = 27 \\implies 9(t - u) = 27 \\implies t - u = 3$. Solving gives $t = 7, u = 4$, so the number is $74$."}, {"id": 325, "topic": "Word Problems", "subtopic": "Systems of Equations Word Problems", "type": "grid", "q": "A tutoring center charges a one-time registration fee $r$ plus an hourly rate $h$. A student taking $8$ hours pays $\\$290$, and a student taking $14$ hours pays $\\$470$. What is the registration fee $r$ (in dollars)?", "ans": "50", "exp": "$r + 8h = 290$ and $r + 14h = 470$. Subtracting gives $6h = 180 \\implies h = 30$. Then $r + 8(30) = 290 \\implies r = 50$."}, {"id": 326, "topic": "Word Problems", "subtopic": "Systems of Equations Word Problems", "type": "grid", "q": "Three apples, two bananas, and one mango cost $\\$7.50$, while two apples, three bananas, and two mangoes cost $\\$10.00$. If one apple, one banana, and one mango together cost $\\$4.50$, how much does one mango cost (in dollars)?", "ans": "2.5", "exp": "Let $a, b, m$ be prices: $3a + 2b + m = 7.5$ and $2a + 3b + 2m = 10$. Adding gives $5a + 5b + 3m = 17.5$. Since $a + b + m = 4.5$, $5(a + b + m) = 22.5$. Subtracting gives $2m = 22.5 - 17.5 = 5 \\implies m = 2.5$."}, {"id": 327, "topic": "Word Problems", "subtopic": "Systems of Equations Word Problems", "type": "grid", "q": "A vending machine contains only quarters ($\\$0.25$) and dimes ($\\$0.10$). There are $42$ coins in total worth $\\$7.95$. How many quarters are in the machine?", "ans": "25", "exp": "Let $q$ be quarters and $d$ be dimes: $q + d = 42$ and $25q + 10d = 795 \\implies 5q + 2d = 159$. Since $d = 42 - q$, $5q + 84 - 2q = 159 \\implies 3q = 75 \\implies q = 25$."}, {"id": 328, "topic": "Word Problems", "subtopic": "Systems of Equations Word Problems", "type": "grid", "q": "Pipe A and Pipe B together fill a tank in $6$ hours. If Pipe A works alone for $4$ hours and Pipe B works alone for $9$ hours, the whole tank is filled. How many hours would Pipe A take to fill the entire tank alone?", "ans": "10", "exp": "Let rates be $a$ and $b$ (tanks/hour): $a + b = \\frac{1}{6}$, and $4a + 9b = 1$. Since $b = \\frac{1}{6} - a$, $4a + \\frac{3}{2} - 9a = 1 \\implies -5a = -0.5 \\implies a = 0.1$. Time for Pipe A alone $= \\frac{1}{0.1} = 10$ hours."}, {"id": 329, "topic": "Word Problems", "subtopic": "Systems of Equations Word Problems", "type": "grid", "q": "In a school election, Candidate X and Candidate Y received a combined $1,280$ votes, with no other candidates. Candidate X received $140$ more than twice as many votes as Candidate Y. How many votes did Candidate X receive?", "ans": "900", "exp": "$x + y = 1280$ and $x = 2y + 140$. Substituting gives $3y + 140 = 1280 \\implies 3y = 1140 \\implies y = 380$, so $x = 1280 - 380 = 900$."}, {"id": 330, "topic": "Word Problems", "subtopic": "Inequality Word Problems", "type": "grid", "q": "A delivery driver earns $\\$18$ per hour plus $\\$4.50$ for each successful package delivered. To earn at least $\\$360$ during an $8$-hour shift, what is the minimum number of packages the driver must deliver?", "ans": "48", "exp": "$18(8) + 4.5p \\ge 360 \\implies 144 + 4.5p \\ge 360 \\implies 4.5p \\ge 216 \\implies p \\ge 48$."}, {"id": 331, "topic": "Word Problems", "subtopic": "Inequality Word Problems", "type": "grid", "q": "A student has test scores of $82, 88,$ and $79$. All tests are out of $100$ points, and a final exam counts as two tests. What is the minimum score the student must get on the final exam to have an average of at least $86$ across the five equivalent test scores?", "ans": "90.5", "exp": "Total points needed for average $86$ over $5$ tests is $86 \\times 5 = 430$. Current sum $= 82 + 88 + 79 = 249$. Remaining points needed across $2$ final-exam weights $= 430 - 249 = 181$, so each final score must be at least $\\frac{181}{2} = 90.5$."}, {"id": 332, "topic": "Word Problems", "subtopic": "Inequality Word Problems", "type": "grid", "q": "A rectangular garden has a length that is $6$ meters more than its width $w$. If the perimeter of the garden must be strictly less than $92$ meters, what is the maximum possible integer value of $w$?", "ans": "19", "exp": "$2(w + (w + 6)) < 92 \\implies 4w + 12 < 92 \\implies 4w < 80 \\implies w < 20$. Maximum integer is $19$."}, {"id": 333, "topic": "Word Problems", "subtopic": "Inequality Word Problems", "type": "mcq", "q": "A software startup has a monthly cloud budget of $\\$4,800$. Fixed tools cost $\\$1,350$/month, and each active user costs $\\$2.75$/month. Which inequality models the maximum number of active users $u$ supported within budget?", "ans": "A", "exp": "A budget of $\\$4,800$ means total monthly cost is at most $\\$4,800$, giving $1350 + 2.75u \\le 4800$.", "options": ["$1350 + 2.75u \\le 4800$", "$1350u + 2.75 \\le 4800$", "$2.75u - 1350 \\ge 4800$", "$1350 + 2.75u < 4800$"]}, {"id": 334, "topic": "Word Problems", "subtopic": "Inequality Word Problems", "type": "grid", "q": "An elevator has a maximum weight capacity of $1,600$ pounds. Currently inside are $4$ adults averaging $175$ pounds each and $6$ children averaging $x$ pounds each. What is the greatest integer average weight $x$ (in pounds) of the children so the total weight does not exceed the limit?", "ans": "150", "exp": "$4(175) + 6x \\le 1600 \\implies 700 + 6x \\le 1600 \\implies 6x \\le 900 \\implies x \\le 150$."}, {"id": 335, "topic": "Word Problems", "subtopic": "Inequality Word Problems", "type": "grid", "q": "A bookstore buys notebooks for $\\$3.20$ each and sells them for $\\$5.00$ each. If the store must make a net profit of at least $\\$450$ after paying $\\$270$ in weekly display rent, what is the minimum number of notebooks sold?", "ans": "400", "exp": "Profit per notebook is $5.00 - 3.20 = 1.80$. Thus $1.80n - 270 \\ge 450 \\implies 1.80n \\ge 720 \\implies n \\ge 400$."}, {"id": 336, "topic": "Word Problems", "subtopic": "Inequality Word Problems", "type": "grid", "q": "A chemical solution starts at $95^\\circ\\text{C}$ and cools by at least $3.5^\\circ\\text{C}$ every minute. After how many whole minutes $t$ is the temperature guaranteed to be no more than $53^\\circ\\text{C}$?", "ans": "12", "exp": "$95 - 3.5t \\le 53 \\implies 3.5t \\ge 42 \\implies t \\ge 12$."}, {"id": 337, "topic": "Word Problems", "subtopic": "Inequality Word Problems", "type": "grid", "q": "A rental car company charges $\\$45$ per day with $150$ free miles total, plus $\\$0.35$ per mile beyond $150$ miles. A customer wants a $3$-day rental bill strictly less than $\\$240$. What is the maximum whole number of total miles $m$ (with $m > 150$) the customer can drive?", "ans": "449", "exp": "$3(45) + 0.35(m - 150) < 240 \\implies 135 + 0.35m - 52.5 < 240 \\implies 0.35m < 157.5 \\implies m < 450$, so max whole miles is $449$."}, {"id": 338, "topic": "Word Problems", "subtopic": "Inequality Word Problems", "type": "grid", "q": "An online course has $12$ quizzes worth $20$ points each. A student has earned a total of $172$ points across the first $9$ quizzes. What is the minimum total number of points the student must earn on the remaining $3$ quizzes to finish with at least $80\\%$ of the total possible points?", "ans": "20", "exp": "Total possible points $= 12 \\times 20 = 240$. Required total $= 0.80 \\times 240 = 192$. Remaining needed $= 192 - 172 = 20$ points."}, {"id": 339, "topic": "Word Problems", "subtopic": "Linear Equation Word Problems", "type": "grid", "q": "A water tank holds $420$ liters and is leaking at a constant rate of $7.5$ liters per hour. How many hours after the leak begins will the tank contain exactly $270$ liters?", "ans": "20", "exp": "$420 - 7.5t = 270 \\implies 7.5t = 150 \\implies t = 20$."}, {"id": 340, "topic": "Word Problems", "subtopic": "Linear Equation Word Problems", "type": "mcq", "q": "A linear model $C(d) = 28 + 0.65d$ represents the cost $C$, in dollars, of shipping a package of weight $d$ kilograms. What does $28$ represent in this context?", "ans": "A", "exp": "In $C(d) = 28 + 0.65d$, the $y$-intercept $28$ is the initial/base cost when $d = 0$.", "options": ["The base shipping cost for a package of weight $0$ kg", "The cost per additional kilogram of weight", "The maximum weight in kilograms", "The discount applied to heavy packages"]}, {"id": 341, "topic": "Word Problems", "subtopic": "Linear Equation Word Problems", "type": "grid", "q": "A train travels at a constant speed of $84$ km/h for part of a trip and $108$ km/h for the remainder. If the entire $540$-km trip takes $5.5$ hours, how many hours did the train travel at $84$ km/h?", "ans": "2.25", "exp": "Let $t$ be time at $84$ km/h: $84t + 108(5.5 - t) = 540 \\implies 84t + 594 - 108t = 540 \\implies -24t = -54 \\implies t = 2.25$."}, {"id": 342, "topic": "Word Problems", "subtopic": "Linear Equation Word Problems", "type": "grid", "q": "A technician charges a $\\$60$ diagnostic fee plus $\\$45$ per hour of labor. If a repair bill before tax is $\\$217.50$, how many hours of labor were billed?", "ans": "3.5", "exp": "$60 + 45h = 217.50 \\implies 45h = 157.50 \\implies h = 3.5$."}, {"id": 343, "topic": "Word Problems", "subtopic": "Linear Equation Word Problems", "type": "grid", "q": "A factory produces $1,250$ units on Day $1$ and increases production by a constant number of units each day. On Day $11$, daily output is $1,800$ units. By how many units does daily output increase each day?", "ans": "55", "exp": "From Day $1$ to Day $11$ is $10$ daily increases: $1250 + 10r = 1800 \\implies 10r = 550 \\implies r = 55$."}, {"id": 344, "topic": "Word Problems", "subtopic": "Linear Equation Word Problems", "type": "grid", "q": "A savings account starts with $\\$650$ and increases by a constant $\\$85$ every month. After how many months will the balance reach $\\$2,350$?", "ans": "20", "exp": "$650 + 85m = 2350 \\implies 85m = 1700 \\implies m = 20$."}, {"id": 345, "topic": "Word Problems", "subtopic": "Linear Equation Word Problems", "type": "grid", "q": "Two runners start $18$ km apart on a straight path and run toward each other at constant speeds of $6.5$ km/h and $5.5$ km/h. In how many hours will they meet?", "ans": "1.5", "exp": "Their closing speed is $6.5 + 5.5 = 12$ km/h. Time $= \\frac{18}{12} = 1.5$ hours."}, {"id": 346, "topic": "Word Problems", "subtopic": "Linear Equation Word Problems", "type": "grid", "q": "A phone plan costs $\\$24$/month plus $\\$0.12$ per text message beyond $500$ free texts. A user pays $\\$40.80$ in a month. How many text messages did the user send that month?", "ans": "640", "exp": "Overage charge $= 40.80 - 24 = 16.80$. Extra texts $= \\frac{16.80}{0.12} = 140$. Total texts $= 500 + 140 = 640$."}, {"id": 347, "topic": "Word Problems", "subtopic": "Linear Equation Word Problems", "type": "grid", "q": "A linear function $P(t)$ models the population of a town $t$ years after $2015$. In $2018$ ($t = 3$), the population was $14,400$; in $2023$ ($t = 8$), it was $16,900$. What was the population in $2015$ ($t = 0$)?", "ans": "12900", "exp": "Slope $= \\frac{16900 - 14400}{8 - 3} = \\frac{2500}{5} = 500$ per year. At $t = 0$, $P(0) = 14400 - 3(500) = 12900$."}, {"id": 348, "topic": "Word Problems", "subtopic": "Ratio Word Problems", "type": "grid", "q": "In a bag of marbles, the ratio of red to blue marbles is $3 : 5$, and the ratio of blue to green marbles is $4 : 7$. What is the ratio of red to green marbles expressed as a simplified fraction? (Enter `12/35`.)", "ans": "12/35", "exp": "Make blue common: $3:5 = 12:20$ and $4:7 = 20:35$. Ratio of red to green is $12 : 35$, or $\\frac{12}{35}$."}, {"id": 349, "topic": "Word Problems", "subtopic": "Ratio Word Problems", "type": "grid", "q": "The ratio of boys to girls in a club is $4 : 9$. After $15$ more girls join (with no change in the number of boys), the ratio of boys to girls becomes $2 : 7$. How many boys are in the club?", "ans": "12", "exp": "Let boys $= 4k$ and girls $= 9k$. After $15$ girls join: $\\frac{4k}{9k + 15} = \\frac{2}{7} \\implies 28k = 18k + 30 \\implies 10k = 30 \\implies k = 3$. Number of boys $= 4(3) = 12$."}, {"id": 350, "topic": "Word Problems", "subtopic": "Ratio Word Problems", "type": "grid", "q": "A sum of $\\$1,260$ is divided among A, B, and C in the ratio $2 : 3 : 4$. How much more money does C receive than A?", "ans": "280", "exp": "Total ratio parts $= 2 + 3 + 4 = 9$. One part $= \\frac{1260}{9} = 140$. C gets $4(140) = 560$, A gets $2(140) = 280$. Difference $= 280$."}, {"id": 351, "topic": "Word Problems", "subtopic": "Ratio Word Problems", "type": "grid", "q": "Two alloys contain copper and zinc. Alloy 1 has copper to zinc in the ratio $1 : 3$, and Alloy 2 has copper to zinc in the ratio $3 : 5$. Equal masses of Alloy 1 and Alloy 2 are melted together. What fraction of the resulting alloy is copper? (Enter `5/16`.)", "ans": "5/16", "exp": "Copper fraction in Alloy 1 is $\\frac{1}{4} = \\frac{4}{16}$; in Alloy 2 it is $\\frac{3}{8} = \\frac{6}{16}$. Equal masses give $\\frac{4/16 + 6/16}{2} = \\frac{10}{32} = \\frac{5}{16}$."}, {"id": 352, "topic": "Word Problems", "subtopic": "Ratio Word Problems", "type": "grid", "q": "In a school, the ratio of teachers to students is $1 : 18$. If there are $720$ students, how many additional teachers must be hired to change the ratio to $1 : 15$?", "ans": "8", "exp": "Current teachers $= \\frac{720}{18} = 40$. For ratio $1 : 15$ with $720$ students, needed teachers $= \\frac{720}{15} = 48$. Additional teachers needed $= 48 - 40 = 8$."}, {"id": 353, "topic": "Word Problems", "subtopic": "Ratio Word Problems", "type": "grid", "q": "The ratio of the areas of two similar squares is $9 : 25$. If the perimeter of the smaller square is $36$ cm, what is the perimeter of the larger square?", "ans": "60", "exp": "Side ratio is $\\sqrt{9} : \\sqrt{25} = 3 : 5$, so perimeter ratio is also $3 : 5$. Larger perimeter $= 36 \\times \\frac{5}{3} = 60$ cm."}, {"id": 354, "topic": "Word Problems", "subtopic": "Ratio Word Problems", "type": "grid", "q": "A recipe for punch uses fruit juice, ginger ale, and soda water in the ratio $5 : 3 : 2$ by volume. To make $15$ liters of punch, how many liters of ginger ale are needed?", "ans": "4.5", "exp": "Total parts $= 5 + 3 + 2 = 10$. Ginger ale $= \\frac{3}{10} \\times 15 = 4.5$ liters."}, {"id": 355, "topic": "Word Problems", "subtopic": "Ratio Word Problems", "type": "grid", "q": "The ages of Maya and Liam are currently in the ratio $5 : 8$. In $6$ years, the ratio of their ages will be $7 : 10$. How old is Maya right now?", "ans": "15", "exp": "Let ages be $5x$ and $8x$: $\\frac{5x + 6}{8x + 6} = \\frac{7}{10} \\implies 50x + 60 = 56x + 42 \\implies 6x = 18 \\implies x = 3$. Maya's current age $= 5(3) = 15$."}, {"id": 356, "topic": "Word Problems", "subtopic": "Ratio Word Problems", "type": "grid", "q": "A test has two sections: Reading and Math. The ratio of Reading questions to Math questions is $3 : 5$. If there are $80$ questions total, how many Math questions are there?", "ans": "50", "exp": "Math fraction $= \\frac{5}{3 + 5} = \\frac{5}{8}$. Number of Math questions $= \\frac{5}{8} \\times 80 = 50$."}, {"id": 357, "topic": "Word Problems", "subtopic": "Proportion Word Problems", "type": "grid", "q": "A map has a scale where $2.5$ cm represents $15$ km. Two cities are $108$ km apart in real life. How many centimeters apart are the two cities on the map?", "ans": "18", "exp": "$\\frac{2.5}{15} = \\frac{d}{108} \\implies d = \\frac{2.5 \\times 108}{15} = \\frac{270}{15} = 18$ cm."}, {"id": 358, "topic": "Word Problems", "subtopic": "Proportion Word Problems", "type": "grid", "q": "If $6$ identical machines working at the same constant rate can produce $450$ widgets in $5$ hours, how many widgets can $10$ such machines produce in $8$ hours?", "ans": "1200", "exp": "Rate per machine per hour $= \\frac{450}{6 \\times 5} = 15$ widgets. For $10$ machines in $8$ hours: $10 \\times 8 \\times 15 = 1200$ widgets."}, {"id": 359, "topic": "Word Problems", "subtopic": "Proportion Word Problems", "type": "grid", "q": "A tank is filled at a constant rate of $14$ gallons every $3.5$ minutes. How many minutes does it take to fill $110$ gallons?", "ans": "27.5", "exp": "Rate $= \\frac{14}{3.5} = 4$ gallons/minute. Time for $110$ gallons $= \\frac{110}{4} = 27.5$ minutes."}, {"id": 360, "topic": "Word Problems", "subtopic": "Proportion Word Problems", "type": "grid", "q": "A shadow cast by a $4.5$-meter pole is $7.2$ meters long at the same time of day a building casts a shadow $36$ meters long. What is the height of the building, in meters?", "ans": "22.5", "exp": "$\\frac{h}{36} = \\frac{4.5}{7.2} \\implies h = 36 \\times \\frac{5}{8} = 22.5$ meters."}, {"id": 361, "topic": "Word Problems", "subtopic": "Proportion Word Problems", "type": "grid", "q": "A recipe requires $1.75$ cups of flour for $14$ cookies. How many cups of flour are needed to make $56$ cookies at the same rate?", "ans": "7", "exp": "$\\frac{1.75}{14} = \\frac{f}{56} \\implies f = 1.75 \\times 4 = 7$ cups."}, {"id": 362, "topic": "Word Problems", "subtopic": "Proportion Word Problems", "type": "grid", "q": "A car uses $9.6$ liters of fuel to travel $120$ km. At this same fuel-efficiency rate, how many liters of fuel are required for a $325$-km trip?", "ans": "26", "exp": "Fuel per km $= \\frac{9.6}{120} = 0.08$ L/km. For $325$ km: $325 \\times 0.08 = 26$ liters."}, {"id": 363, "topic": "Word Problems", "subtopic": "Proportion Word Problems", "type": "grid", "q": "If $12$ workers can complete a project in $15$ days working at a constant rate, how many days would $20$ workers take to complete the exact same project?", "ans": "9", "exp": "Total worker-days $= 12 \\times 15 = 180$. With $20$ workers: $\\frac{180}{20} = 9$ days."}, {"id": 364, "topic": "Word Problems", "subtopic": "Proportion Word Problems", "type": "grid", "q": "In a clinical trial, $18$ out of $240$ patients reported mild fatigue. If a hospital treats $1,400$ similar patients, how many would be expected to report mild fatigue based on this proportion?", "ans": "105", "exp": "Proportion $= \\frac{18}{240} = \\frac{3}{40}$. Expected count $= \\frac{3}{40} \\times 1400 = 105$."}, {"id": 365, "topic": "Word Problems", "subtopic": "Taking a Sample from a Population Word Problems", "type": "mcq", "q": "A city council wants to estimate support for a new park among all $85,000$ adult residents. Which sampling method is MOST likely to yield a valid, unbiased estimate?", "ans": "A", "exp": "Random selection from a broad, representative list of the target population minimizes selection bias compared to convenience or self-selected samples.", "options": ["Selecting $600$ adults at random from the city's voter registration roll", "Surveying the first $600$ people who enter the existing park on Saturday morning", "Posting an online poll on the park advocacy group's social media page", "Asking $600$ residents living directly across from the proposed park"]}, {"id": 366, "topic": "Word Problems", "subtopic": "Taking a Sample from a Population Word Problems", "type": "mcq", "q": "A random sample of $400$ students out of $2,400$ at a high school shows that $110$ prefer morning classes. A researcher increases the sample size to $1,200$ random students while keeping the population at $2,400$. What is the primary effect?", "ans": "A", "exp": "Increasing sample size from a population reduces sampling variability and narrows the margin of error.", "options": ["The margin of error decreases and the estimate becomes more precise", "The population size changes to $1,200$", "Sampling bias increases because more students are surveyed", "The sample proportion is guaranteed not to change"]}, {"id": 367, "topic": "Word Problems", "subtopic": "Taking a Sample from a Population Word Problems", "type": "grid", "q": "A random sample of $150$ smartphones from a warehouse batch of $6,000$ phones contains $9$ defective units. Based on this sample, what is the estimated total number of defective smartphones in the entire batch?", "ans": "360", "exp": "Sample defect rate $= \\frac{9}{150} = 0.06$. Estimated defective in $6,000$ phones $= 0.06 \\times 6000 = 360$."}, {"id": 368, "topic": "Word Problems", "subtopic": "Taking a Sample from a Population Word Problems", "type": "mcq", "q": "A survey of $500$ randomly selected voters estimates that $54\\%$ favor a measure, with a margin of error of $\\pm 4.4$ percentage points. Which conclusion is best supported?", "ans": "A", "exp": "A margin of error of $\\pm 4.4\\%$ around $54\\%$ gives a plausible interval of $[49.6\\%, 58.4\\%]$.", "options": ["The true proportion of all voters favoring the measure is likely between $49.6\\%$ and $58.4\\%$", "Exactly $54\\%$ of all voters in the population favor the measure", "At least $58.4\\%$ of all voters favor the measure", "The survey is invalid because $54\\%$ is close to $50\\%$"]}, {"id": 369, "topic": "Word Problems", "subtopic": "Taking a Sample from a Population Word Problems", "type": "grid", "q": "In a random sample of $80$ commuters at a train station, $52$ use a monthly pass. If the station serves $4,500$ daily commuters, how many daily commuters are estimated to use a monthly pass?", "ans": "2925", "exp": "$\\frac{52}{80} = 0.65$. Estimated commuters $= 0.65 \\times 4500 = 2925$."}, {"id": 370, "topic": "Word Problems", "subtopic": "Taking a Sample from a Population Word Problems", "type": "mcq", "q": "A quality-control inspector tests every $25\text{th}$ bottle coming off a bottling line. What type of sampling method is this?", "ans": "A", "exp": "Selecting every $k\text{th}$ item from a sequence is systematic sampling.", "options": ["Systematic random sampling", "Convenience sampling", "Voluntary response sampling", "Cluster sampling"]}, {"id": 371, "topic": "Word Problems", "subtopic": "Taking a Sample from a Population Word Problems", "type": "mcq", "q": "A principal surveys $50$ students chosen randomly from each grade ($9, 10, 11,$ and $12$) at a school. Why can these results be generalized to the whole school rather than just one grade?", "ans": "A", "exp": "Because all grades are sampled randomly, findings generalize to the full student body (with appropriate margin of error).", "options": ["The sample includes representative random selections across all grades in the target population", "Every student in the school answered the survey", "Stratified sampling eliminates all estimation error", "Grade $12$ always represents the entire school"]}, {"id": 372, "topic": "Word Problems", "subtopic": "Taking a Sample from a Population Word Problems", "type": "grid", "q": "A random sample of $120$ trees in a $3,000$-tree forest shows $18$ trees have a specific fungus. What is the estimated number of infected trees in the entire forest?", "ans": "450", "exp": "Sample proportion $= \\frac{18}{120} = 0.15$. Estimated count $= 0.15 \\times 3000 = 450$."}, {"id": 373, "topic": "Word Problems", "subtopic": "Statistics Word Problems", "type": "grid", "q": "A company tracks daily customer support tickets over $7$ days and records an average of $64$ tickets per day. On Day $8$, $88$ tickets arrive. What is the new $8$-day daily average?", "ans": "67", "exp": "Sum for $7$ days $= 7 \\times 64 = 448$. With Day $8$: $\\frac{448 + 88}{8} = \\frac{536}{8} = 67$."}, {"id": 374, "topic": "Word Problems", "subtopic": "Statistics Word Problems", "type": "mcq", "q": "In a study of $120$ commuters, longer commute times are moderately correlated with higher reported stress ($r = 0.62$). Which statement is justified?", "ans": "A", "exp": "Observational correlation shows association, not cause and effect.", "options": ["There is an association between commute time and reported stress, but causation cannot be concluded without a controlled experiment", "Longer commutes directly cause higher stress for every commuter", "Commute time has no relationship with stress", "Reducing commute time by half guarantees a $62\\%$ drop in stress"]}, {"id": 375, "topic": "Word Problems", "subtopic": "Statistics Word Problems", "type": "grid", "q": "In a two-way table of $200$ gym members, $110$ are on annual plans and $90$ are on monthly plans. Among annual members, $77$ attend at least $3$ times a week. What percentage of annual members attend at least $3$ times a week?", "ans": "70", "exp": "$\\frac{77}{110} = 0.70 = 70\\%$."}, {"id": 376, "topic": "Word Problems", "subtopic": "Statistics Word Problems", "type": "grid", "q": "A line of best fit for a dataset of study hours $x$ and exam score $y$ is $\\hat{y} = 4.2x + 52$. A student who studied $9$ hours scored $94$. What is the residual (actual minus predicted) for this student?", "ans": "4.2", "exp": "Predicted score $\\hat{y} = 4.2(9) + 52 = 37.8 + 52 = 89.8$. Residual $= 94 - 89.8 = 4.2$."}, {"id": 377, "topic": "Word Problems", "subtopic": "Statistics Word Problems", "type": "mcq", "q": "A random sample of $60$ adults is randomly split into two groups of $30$: Group A uses a new study app and Group B uses traditional notes. After two weeks, Group A scores higher on average. Why is this design stronger than an observational survey?", "ans": "A", "exp": "Random assignment into treatment and control groups reduces confounding and supports causal inference.", "options": ["Random assignment helps balance confounding variables across groups so differences are more attributable to the study method", "It eliminates the need to measure scores at the end", "A sample of $30$ per group has zero margin of error", "Observational surveys can never measure numerical outcomes"]}, {"id": 378, "topic": "Word Problems", "subtopic": "Statistics Word Problems", "type": "grid", "q": "A store's monthly sales (in thousands of dollars) for five months are $18, 22, 19, 25,$ and $26$. What must sales be in the sixth month for the six-month average to be $\\$23$ thousand?", "ans": "28", "exp": "Required $6$-month sum $= 6 \\times 23 = 138$. Current $5$-month sum $= 18 + 22 + 19 + 25 + 26 = 110$. Sixth month $= 138 - 110 = 28$."}, {"id": 379, "topic": "Word Problems", "subtopic": "Statistics Word Problems", "type": "grid", "q": "In a class of $30$ students, the mean score on a quiz is $76$. If the $10$ boys have a mean score of $70$, what is the mean score of the $20$ girls?", "ans": "79", "exp": "Total points $= 30 \\times 76 = 2280$. Boys' points $= 10 \\times 70 = 700$. Girls' points $= 2280 - 700 = 1580$. Girls' mean $= \\frac{1580}{20} = 79$."}, {"id": 380, "topic": "Word Problems", "subtopic": "Statistics Word Problems", "type": "mcq", "q": "A scatterplot of housing price $y$ versus square footage $x$ shows a strong positive linear trend, except one mansion of $8,500$ sq ft has an unusually low price due to needed renovations. Adding this mansion to the dataset would most likely:", "ans": "A", "exp": "A high-$x$, low-$y$ point below the trend pulls the regression line down, decreasing its slope.", "options": ["Pull the slope of the least-squares regression line downward", "Increase the correlation coefficient closer to $1$", "Leave the line of best fit completely unchanged", "Make the slope negative"]}, {"id": 381, "topic": "Statistics", "subtopic": "Mean", "type": "grid", "q": "The mean of $6$ numbers is $14.5$. When a $7\text{th}$ number $x$ is included, the mean becomes $16$. What is $x$?", "ans": "25", "exp": "Total for $6$ is $87$; total for $7$ is $112$; $x = 112 - 87 = 25$."}, {"id": 382, "topic": "Statistics", "subtopic": "Mean", "type": "grid", "q": "Five distinct positive integers have a mean of $12$ and a median of $13$. What is the greatest possible value of the largest integer?", "ans": "30", "exp": "Minimize the smallest two distinct positive integers ($1, 2$) and set the middle two as $13, 14$: $1 + 2 + 13 + 14 + x = 60 \\implies x = 30$."}, {"id": 383, "topic": "Statistics", "subtopic": "Mean", "type": "grid", "q": "If every value in a dataset with mean $\\mu = 42$ is multiplied by $0.5$ and then increased by $9$, what is the new mean?", "ans": "30", "exp": "New mean $= 0.5(42) + 9 = 21 + 9 = 30$."}, {"id": 384, "topic": "Statistics", "subtopic": "Mean", "type": "grid", "q": "The mean of $8$ numbers is $-3.5$. What is the sum of these $8$ numbers?", "ans": "-28", "exp": "Sum $= 8 \\times (-3.5) = -28$."}, {"id": 385, "topic": "Statistics", "subtopic": "Mean", "type": "grid", "q": "A set of $10$ numbers has a mean of $24$. Two numbers, $18$ and $32$, are removed. What is the mean of the remaining $8$ numbers?", "ans": "23.75", "exp": "Original sum $= 240$. Remaining sum $= 240 - 50 = 190$. New mean $= \\frac{190}{8} = 23.75$."}, {"id": 386, "topic": "Statistics", "subtopic": "Mean", "type": "grid", "q": "If the mean of $x, x + 4, x + 7,$ and $2x - 3$ is $15$, what is the value of $x$?", "ans": "10.4", "exp": "Sum $= 5x + 8 = 60 \\implies 5x = 52 \\implies x = 10.4$."}, {"id": 387, "topic": "Statistics", "subtopic": "Mean", "type": "grid", "q": "Four numbers have a mean of $20$. When a fifth number is added, the mean of all five is $18$. What is the fifth number?", "ans": "10", "exp": "Fifth number $= 5(18) - 4(20) = 90 - 80 = 10$."}, {"id": 388, "topic": "Statistics", "subtopic": "Mean", "type": "grid", "q": "The mean of three consecutive even integers is $26$. What is the largest of the three integers?", "ans": "28", "exp": "Middle integer is $26$, so the three integers are $24, 26, 28$. Largest is $28$."}, {"id": 389, "topic": "Statistics", "subtopic": "Mean", "type": "grid", "q": "A dataset has mean $50$. If a new data point equal to $50$ is added to the dataset, what is the new mean?", "ans": "50", "exp": "Adding a value equal to the mean leaves the mean unchanged at $50$."}, {"id": 390, "topic": "Statistics", "subtopic": "Mean", "type": "grid", "q": "The mean of $4$ test scores is $85$, and the mean of $6$ other test scores is $90$. What is the combined mean of all $10$ scores?", "ans": "88", "exp": "Total points $= 4(85) + 6(90) = 340 + 540 = 880$. Combined mean $= \\frac{880}{10} = 88$."}, {"id": 391, "topic": "Statistics", "subtopic": "Mean", "type": "grid", "q": "If the mean of $6$ numbers is $k$ and each number is decreased by $7$, what is the new mean in terms of $k$? (Enter `k-7`.)", "ans": "k-7", "exp": "Subtracting a constant $c$ from every value decreases the mean by $c$, giving $k - 7$."}, {"id": 392, "topic": "Statistics", "subtopic": "Mean", "type": "grid", "q": "A set of $9$ integers has a mean of $11$. If one integer is replaced by $29$, the new mean becomes $13$. What was the replaced integer?", "ans": "11", "exp": "New sum $= 9(13) = 117$; old sum $= 9(11) = 99$. $99 - v + 29 = 117 \\implies v = 11$."}, {"id": 393, "topic": "Statistics", "subtopic": "Mode", "type": "grid", "q": "In the dataset $\\{4, 7, 7, 9, 12, 12, 15, 4, 7\\}$, what is the mode?", "ans": "7", "exp": "The value $7$ appears $3$ times, more than any other value."}, {"id": 394, "topic": "Statistics", "subto
