 y)$) lie ON this circle?", "ans": "12", "exp": "Integer solutions to $x^2 + y^2 = 169$ come from Pythagorean triples $(5,12,13)$ and $(0,13,13)$ in all sign/order combinations: $8 + 4 = 12$ lattice points."}, {"id": 602, "topic": "Geometry and Trigonometry", "subtopic": "Circles", "type": "grid", "q": "A line $y = x + k$ is tangent to the circle $x^2 + y^2 = 8$ with $k > 0$. What is the value of $k$?", "ans": "4", "exp": "Distance from center $(0,0)$ to $x - y + k = 0$ equals radius $\\sqrt{8}$: $\\frac{|k|}{\\sqrt{2}} = \\sqrt{8} \\implies |k| = \\sqrt{16} = 4$."}, {"id": 603, "topic": "Geometry and Trigonometry", "subtopic": "Circles", "type": "grid", "q": "In a circle, two parallel chords on opposite sides of the center have lengths $10$ and $24$, and the radius of the circle is $13$. What is the distance between the two parallel chords?", "ans": "17", "exp": "Distance from center to chord of length $10$ (half $= 5$) is $\\sqrt{13^2 - 5^2} = 12$. Distance from center to chord of length $24$ (half $= 12$) is $\\sqrt{13^2 - 12^2} = 5$. Total distance $= 12 + 5 = 17$."}, {"id": 604, "topic": "Geometry and Trigonometry", "subtopic": "Circles", "type": "grid", "q": "A circle has radius $12$ and a central angle of $90^\\circ$. What is the area of the minor segment (region between the chord and the minor arc) in terms of $\\pi$? (Enter `36pi-72`.)", "ans": "36pi-72", "exp": "Sector area $= \\frac{1}{4}\\pi(12^2) = 36\\pi$. Triangle area $= \\frac{1}{2}(12)(12) = 72$. Segment area $= 36\\pi - 72$."}, {"id": 605, "topic": "Geometry and Trigonometry", "subtopic": "Circles", "type": "grid", "q": "Two circles of equal radius $6$ pass through each other's centers. What is the distance between their centers?", "ans": "6", "exp": "Since each circle passes through the other's center, the distance between centers equals the radius, $6$."}, {"id": 606, "topic": "Geometry and Trigonometry", "subtopic": "Circles", "type": "grid", "q": "In a circle, inscribed angle $\\angle ABC$ intercepts arc $\\widehat{AC}$ of measure $140^\\circ$. What is the measure of central angle $\\angle AOC$ in degrees?", "ans": "140", "exp": "A central angle intercepting an arc has the same measure as the arc itself: $140^\\circ$."}, {"id": 607, "topic": "Geometry and Trigonometry", "subtopic": "Circles", "type": "grid", "q": "The equation $(x - 2)^2 + (y + 3)^2 = k$ represents a circle with circumference $16\\pi$. What is $k$?", "ans": "64", "exp": "Circumference $= 2\\pi r = 16\\pi \\implies r = 8 \\implies k = r^2 = 64$."}, {"id": 608, "topic": "Geometry and Trigonometry", "subtopic": "Circles", "type": "grid", "q": "A wheel of radius $0.5$ meters rolls along a flat road without slipping through $10$ full revolutions. How many meters does it travel in terms of $\\pi$? (Enter `10pi`.)", "ans": "10pi", "exp": "One revolution $= 2\\pi(0.5) = \\pi$ meters. Ten revolutions $= 10\\pi$ meters."}, {"id": 609, "topic": "Geometry and Trigonometry", "subtopic": "Circles", "type": "grid", "q": "A circle is tangent to both axes ($x$-axis and $y$-axis) in Quadrant I and has radius $7$. What is the $x$-coordinate of its center?", "ans": "7", "exp": "A circle of radius $7$ tangent to both axes in Quadrant I has center $(7, 7)$."}, {"id": 610, "topic": "Geometry and Trigonometry", "subtopic": "Circles", "type": "grid", "q": "For the circle in Quadrant I of radius $7$ tangent to both axes, what is the value of $x + y$ for its center?", "ans": "14", "exp": "Center is $(7, 7)$, so $7 + 7 = 14$."}, {"id": 611, "topic": "Geometry and Trigonometry", "subtopic": "Circles", "type": "grid", "q": "A chord of a circle has length $12$ and subtends a central angle of $60^\\circ$. What is the radius of the circle?", "ans": "12", "exp": "Two radii of length $r$ and the chord of length $12$ form an isosceles triangle with vertex angle $60^\\circ$, which is equilateral! Thus $r = 12$."}, {"id": 612, "topic": "Geometry and Trigonometry", "subtopic": "Circles", "type": "grid", "q": "In a circle with center $O$, point $P$ is outside the circle. Tangents $\\overline{PA}$ and $\\overline{PB}$ touch the circle at $A$ and $B$. If $\\angle APB = 50^\\circ$, what is the measure of $\\angle AOB$ in degrees?", "ans": "130", "exp": "In quadrilateral $OAPB$, $\\angle OAP = \\angle OBP = 90^\\circ$, so $\\angle AOB = 180^\\circ - 50^\\circ = 130^\\circ$."}, {"id": 613, "topic": "Geometry and Trigonometry", "subtopic": "Circles", "type": "mcq", "q": "A circle has center $(3, 4)$ and radius $5$. Does the origin $(0, 0)$ lie on the circle?", "ans": "A", "exp": "Distance from $(0,0)$ to $(3,4)$ is $\\sqrt{3^2 + 4^2} = 5 = r$, so $(0,0)$ lies directly on the circle.", "options": ["Yes, it lies on the circle", "No, it lies inside the circle", "No, it lies outside the circle", "Cannot be determined"]}, {"id": 614, "topic": "Geometry and Trigonometry", "subtopic": "Circles", "type": "grid", "q": "A circle has equation $x^2 + y^2 = 25$. What is the length of the chord along the horizontal line $y = 3$?", "ans": "8", "exp": "Substitute $y = 3$: $x^2 + 9 = 25 \\implies x^2 = 16 \\implies x = \\pm 4$. Chord length $= 4 - (-4) = 8$."}, {"id": 615, "topic": "Geometry and Trigonometry", "subtopic": "Circles", "type": "grid", "q": "If a circle's radius is tripled, by what factor does its area increase?", "ans": "9", "exp": "Area scales by the square of the radius factor: $3^2 = 9$."}, {"id": 616, "topic": "Geometry and Trigonometry", "subtopic": "Circles", "type": "grid", "q": "If a circle's radius is multiplied by $\\frac{1}{2}$, by what factor does its circumference change? (Enter `1/2`.)", "ans": "1/2", "exp": "Circumference is directly proportional to radius ($C = 2\\pi r$), so it changes by $\\frac{1}{2}$."}, {"id": 617, "topic": "Geometry and Trigonometry", "subtopic": "Circles", "type": "grid", "q": "A semicircle has diameter $10$. What is its perimeter including the diameter in terms of $\\pi$? (Enter `5pi+10`.)", "ans": "5pi+10", "exp": "Curved part $= \\frac{1}{2}(10\\pi) = 5\\pi$. Plus diameter $10$: $5\\pi + 10$."}, {"id": 618, "topic": "Geometry and Trigonometry", "subtopic": "Circles", "type": "mcq", "q": "A circle of radius $4$ is centered at $(0, 0)$. Which point lies strictly INSIDE the circle?", "ans": "A", "exp": "Distance from $(0,0)$ to $(2, 2)$ is $\\sqrt{8} \\approx 2.83 < 4$, so $(2, 2)$ is inside.", "options": ["$(2, 2)$", "$(4, 0)$", "$(0, -4)$", "$(3, 4)$"]}, {"id": 619, "topic": "Geometry and Trigonometry", "subtopic": "Circles", "type": "grid", "q": "Two secants intersect inside a circle at $E$. If $AE = 3$, $EB = 8$, and $CE = 4$, what is $ED$?", "ans": "6", "exp": "$3 \\times 8 = 4 \\times ED \\implies 24 = 4 \\cdot ED \\implies ED = 6$."}, {"id": 620, "topic": "Geometry and Trigonometry", "subtopic": "Circles", "type": "grid", "q": "In a circle, an arc of $120^\\circ$ has length $8\\pi$. What is the radius of the circle?", "ans": "12", "exp": "$\\frac{120}{360}(2\\pi r) = 8\\pi \\implies \\frac{2\\pi r}{3} = 8\\pi \\implies r = 12$."}, {"id": 621, "topic": "Geometry and Trigonometry", "subtopic": "Trigonometry", "type": "grid", "q": "Convert $135^\\circ$ to radians. (Enter `3pi/4`.)", "ans": "3pi/4", "exp": "$135^\\circ \\times \\frac{\\pi}{180^\\circ} = \\frac{3\\pi}{4}$ radians."}, {"id": 622, "topic": "Geometry and Trigonometry", "subtopic": "Trigonometry", "type": "grid", "q": "Convert $\\frac{5\\pi}{6}$ radians to degrees.", "ans": "150", "exp": "$\\frac{5\\pi}{6} \\times \\frac{180^\\circ}{\\pi} = 5 \\times 30^\\circ = 150^\\circ$."}, {"id": 623, "topic": "Geometry and Trigonometry", "subtopic": "Trigonometry", "type": "grid", "q": "What is the exact value of $\\sin\\left(\\frac{\\pi}{3}\\right)$? (Enter `sqrt(3)/2`.)", "ans": "sqrt(3)/2", "exp": "$\\frac{\\pi}{3}$ radians equals $60^\\circ$, and $\\sin(60^\\circ) = \\frac{\\sqrt{3}}{2}$."}, {"id": 624, "topic": "Geometry and Trigonometry", "subtopic": "Trigonometry", "type": "grid", "q": "What is the exact value of $\\cos\\left(\\frac{3\\pi}{4}\\right)$? (Enter `-sqrt(2)/2`.)", "ans": "-sqrt(2)/2", "exp": "$\\frac{3\\pi}{4}$ is in Quadrant II ($135^\\circ$), where cosine is negative: $-\\cos(45^\\circ) = -\\frac{\\sqrt{2}}{2}$."}, {"id": 625, "topic": "Geometry and Trigonometry", "subtopic": "Trigonometry", "type": "grid", "q": "What is the exact value of $\\tan\\left(\\frac{\\pi}{4}\\right)$?", "ans": "1", "exp": "$\\tan(45^\\circ) = 1$."}, {"id": 626, "topic": "Geometry and Trigonometry", "subtopic": "Trigonometry", "type": "grid", "q": "What is the exact value of $\\sin(\\pi)$?", "ans": "0", "exp": "At $\\pi$ radians ($180^\\circ$) on the unit circle, the $y$-coordinate is $0$, so $\\sin(\\pi) = 0$."}, {"id": 627, "topic": "Geometry and Trigonometry", "subtopic": "Trigonometry", "type": "grid", "q": "What is the exact value of $\\cos(\\pi)$?", "ans": "-1", "exp": "At $\\pi$ radians ($180^\\circ$) on the unit circle, the $x$-coordinate is $-1$, so $\\cos(\\pi) = -1$."}, {"id": 628, "topic": "Geometry and Trigonometry", "subtopic": "Trigonometry", "type": "grid", "q": "What is the exact value of $\\sin\\left(\\frac{7\\pi}{6}\\right)$? (Enter `-1/2`.)", "ans": "-1/2", "exp": "$\\frac{7\\pi}{6} = 210^\\circ$ is in Quadrant III, where $\\sin(210^\\circ) = -\\sin(30^\\circ) = -\\frac{1}{2}$."}, {"id": 629, "topic": "Geometry and Trigonometry", "subtopic": "Trigonometry", "type": "grid", "q": "What is the exact value of $\\cos\\left(\\frac{5\\pi}{3}\\right)$? (Enter `1/2`.)", "ans": "1/2", "exp": "$\\frac{5\\pi}{3} = 300^\\circ$ is in Quadrant IV, where $\\cos(300^\\circ) = +\\cos(60^\\circ) = \\frac{1}{2}$."}, {"id": 630, "topic": "Geometry and Trigonometry", "subtopic": "Trigonometry", "type": "grid", "q": "What is the exact value of $\\tan\\left(\\frac{2\\pi}{3}\\right)$? (Enter `-sqrt(3)`.)", "ans": "-sqrt(3)", "exp": "$\\frac{2\\pi}{3} = 120^\\circ$ is in Quadrant II, where $\\tan(120^\\circ) = -\\tan(60^\\circ) = -\\sqrt{3}$."}, {"id": 631, "topic": "Geometry and Trigonometry", "subtopic": "Trigonometry", "type": "grid", "q": "If $\\sin(\\theta) = -\\frac{5}{13}$ and $\\theta$ is in Quadrant III ($\\pi < \\theta < \\frac{3\\pi}{2}$), what is $\\cos(\\theta)$? (Enter `-12/13`.)", "ans": "-12/13", "exp": "$\\cos^2(\\theta) = 1 - \\left(-\\frac{5}{13}\\right)^2 = \\frac{144}{169}$. In Quadrant III, $\\cos(\\theta) < 0$, so $\\cos(\\theta) = -\\frac{12}{13}$."}, {"id": 632, "topic": "Geometry and Trigonometry", "subtopic": "Trigonometry", "type": "grid", "q": "Using the same angle $\\theta$ in Quadrant III with $\\sin(\\theta) = -\\frac{5}{13}$ and $\\cos(\\theta) = -\\frac{12}{13}$, what is $\\tan(\\theta)$? (Enter `5/12`.)", "ans": "5/12", "exp": "$\\tan(\\theta) = \\frac{\\sin(\\theta)}{\\cos(\\theta)} = \\frac{-5/13}{-12/13} = \\frac{5}{12}$."}, {"id": 633, "topic": "Geometry and Trigonometry", "subtopic": "Trigonometry", "type": "grid", "q": "What is the period of the function $f(x) = 3\\sin(4x) - 2$? (Enter `pi/2`.)", "ans": "pi/2", "exp": "For $\\sin(bx)$, period $= \\frac{2\\pi}{|b|} = \\frac{2\\pi}{4} = \\frac{\\pi}{2}$."}, {"id": 634, "topic": "Geometry and Trigonometry", "subtopic": "Trigonometry", "type": "grid", "q": "What is the amplitude of the function $f(x) = -5\\cos(2x) + 1$?", "ans": "5", "exp": "Amplitude is $|a| = |-5| = 5$."}, {"id": 635, "topic": "Geometry and Trigonometry", "subtopic": "Trigonometry", "type": "grid", "q": "What is the midline (horizontal axis) of $f(x) = 4\\sin(x) - 7$?", "ans": "-7", "exp": "The vertical shift $d = -7$ gives the midline $y = -7$."}, {"id": 636, "topic": "Geometry and Trigonometry", "subtopic": "Trigonometry", "type": "grid", "q": "What is the maximum value of $g(x) = 2\\cos(3x) + 9$?", "ans": "11", "exp": "Maximum $= d + |a| = 9 + 2 = 11$."}, {"id": 637, "topic": "Geometry and Trigonometry", "subtopic": "Trigonometry", "type": "grid", "q": "What is the minimum value of $g(x) = 2\\cos(3x) + 9$?", "ans": "7", "exp": "Minimum $= d - |a| = 9 - 2 = 7$."}, {"id": 638, "topic": "Geometry and Trigonometry", "subtopic": "Trigonometry", "type": "grid", "q": "For any real angle $x$, what is the value of $\\sin^2(3x) + \\cos^2(3x)$?", "ans": "1", "exp": "By the Pythagorean identity $\\sin^2(\\alpha) + \\cos^2(\\alpha) = 1$ for any angle $\\alpha = 3x$."}, {"id": 639, "topic": "Geometry and Trigonometry", "subtopic": "Trigonometry", "type": "mcq", "q": "Which expression is equivalent to $\\frac{\\sin(x)}{\\cos(x)}$ for all $x$ where $\\cos(x) \\neq 0$?", "ans": "A", "exp": "By definition, $\\tan(x) = \\frac{\\sin(x)}{\\cos(x)}$.", "options": ["$\\tan(x)$", "$\\cot(x)$", "$1$", "$\\sin(2x)$"]}, {"id": 640, "topic": "Geometry and Trigonometry", "subtopic": "Trigonometry", "type": "grid", "q": "Which angle in $[0, 2\\pi)$ is coterminal with $-\\frac{\\pi}{6}$? (Enter `11pi/6`.)", "ans": "11pi/6", "exp": "$-\\frac{\\pi}{6} + 2\\pi = \\frac{11\\pi}{6}$."}, {"id": 641, "topic": "Geometry and Trigonometry", "subtopic": "Trigonometry", "type": "grid", "q": "How many solutions does the equation $\\sin(x) = 0.5$ have on the open interval $(0, 2\\pi)$?", "ans": "2", "exp": "In $(0, 2\\pi)$, $\\sin(x) = 0.5$ has two solutions: $x = \\frac{\\pi}{6}$ and $x = \\frac{5\\pi}{6}$."}, {"id": 642, "topic": "Geometry and Trigonometry", "subtopic": "Trigonometry", "type": "grid", "q": "What is the value of $\\cos\\left(\\frac{\\pi}{2}\\right)$?", "ans": "0", "exp": "At $\\frac{\\pi}{2}$ ($90^\\circ$) on the unit circle, the $x$-coordinate is $0$."}, {"id": 643, "topic": "Geometry and Trigonometry", "subtopic": "Trigonometry", "type": "grid", "q": "What is the value of $\\sin\\left(\\frac{3\\pi}{2}\\right)$?", "ans": "-1", "exp": "At $\\frac{3\\pi}{2}$ ($270^\\circ$) on the unit circle, the $y$-coordinate is $-1$."}, {"id": 644, "topic": "Geometry and Trigonometry", "subtopic": "Trigonometry", "type": "grid", "q": "If $\\cos(\\theta) = \\frac{4}{5}$ and $0 < \\theta < \\frac{\\pi}{2}$, what is $\\tan(\\theta)$? (Enter `3/4`.)", "ans": "3/4", "exp": "$\\sin(\\theta) = \\sqrt{1 - (4/5)^2} = \\frac{3}{5}$, so $\\tan(\\theta) = \\frac{3/5}{4/5} = \\frac{3}{4}$."}, {"id": 645, "topic": "Geometry and Trigonometry", "subtopic": "Trigonometry", "type": "grid", "q": "Convert $270^\\circ$ to radians. (Enter `3pi/2`.)", "ans": "3pi/2", "exp": "$270^\\circ \\times \\frac{\\pi}{180^\\circ} = \\frac{3\\pi}{2}$."}, {"id": 646, "topic": "Geometry and Trigonometry", "subtopic": "Trigonometry", "type": "grid", "q": "Convert $\\frac{4\\pi}{3}$ radians to degrees.", "ans": "240", "exp": "$\\frac{4\\pi}{3} \\times \\frac{180^\\circ}{\\pi} = 4 \\times 60^\\circ = 240^\\circ$."}, {"id": 647, "topic": "Geometry and Trigonometry", "subtopic": "Trigonometry", "type": "grid", "q": "What is the exact value of $\\sin\\left(\\frac{\\pi}{4}\\right)$? (Enter `sqrt(2)/2`.)", "ans": "sqrt(2)/2", "exp": "$\\sin(45^\\circ) = \\frac{\\sqrt{2}}{2}$."}, {"id": 648, "topic": "Geometry and Trigonometry", "subtopic": "Trigonometry", "type": "grid", "q": "What is the exact value of $\\cos\\left(\\frac{\\pi}{6}\\right)$? (Enter `sqrt(3)/2`.)", "ans": "sqrt(3)/2", "exp": "$\\cos(30^\\circ) = \\frac{\\sqrt{3}}{2}$."}, {"id": 649, "topic": "Geometry and Trigonometry", "subtopic": "Trigonometry", "type": "grid", "q": "What is the exact value of $\\tan\\left(\\frac{\\pi}{3}\\right)$? (Enter `sqrt(3)`.)", "ans": "sqrt(3)", "exp": "$\\tan(60^\\circ) = \\frac{\\sqrt{3}/2}{1/2} = \\sqrt{3}$."}, {"id": 650, "topic": "Geometry and Trigonometry", "subtopic": "Trigonometry", "type": "grid", "q": "What is the exact value of $\\sin\\left(\\frac{5\\pi}{4}\\right)$? (Enter `-sqrt(2)/2`.)", "ans": "-sqrt(2)/2", "exp": "$\\frac{5\\pi}{4} = 225^\\circ$ is in Quadrant III, where $\\sin(225^\\circ) = -\\frac{\\sqrt{2}}{2}$."}, {"id": 651, "topic": "Geometry and Trigonometry", "subtopic": "Trigonometry", "type": "grid", "q": "What is the exact value of $\\cos\\left(\\frac{7\\pi}{4}\\right)$? (Enter `sqrt(2)/2`.)", "ans": "sqrt(2)/2", "exp": "$\\frac{7\\pi}{4} = 315^\\circ$ is in Quadrant IV, where $\\cos(315^\\circ) = +\\frac{\\sqrt{2}}{2}$."}, {"id": 652, "topic": "Geometry and Trigonometry", "subtopic": "Trigonometry", "type": "grid", "q": "What is the period of $y = \\cos(\\pi x)$?", "ans": "2", "exp": "Period $= \\frac{2\\pi}{\\pi} = 2$."}, {"id": 653, "topic": "Geometry and Trigonometry", "subtopic": "Trigonometry", "type": "grid", "q": "If $\\sin(x) = \\cos(x)$ for an acute angle $x$ in degrees, what is $x$?", "ans": "45", "exp": "$\\sin(45^\\circ) = \\cos(45^\\circ) = \\frac{\\sqrt{2}}{2}$."}, {"id": 654, "topic": "Geometry and Trigonometry", "subtopic": "Trigonometry", "type": "mcq", "q": "Which expression is equal to $\\cos(90^\\circ - \\theta)$?", "ans": "A", "exp": "Cofunction identity: $\\cos(90^\\circ - \\theta) = \\sin(\\theta)$.", "options": ["$\\sin(\\theta)$", "$\\cos(\\theta)$", "$-\\sin(\\theta)$", "$\\tan(\\theta)$"]}, {"id": 655, "topic": "Geometry and Trigonometry", "subtopic": "Trigonometry", "type": "grid", "q": "A central angle of $\\frac{\\pi}{2}$ radians in a circle of radius $8$ intercepts an arc of what length? (Enter `4pi`.)", "ans": "4pi", "exp": "Arc length $s = r\\theta = 8 \\times \\frac{\\pi}{2} = 4\\pi$."}, {"id": 656, "topic": "Geometry and Trigonometry", "subtopic": "Trigonometry", "type": "grid", "q": "What is the exact value of $\\sin(0)$?", "ans": "0", "exp": "$\\sin(0) = 0$."}, {"id": 657, "topic": "Geometry and Trigonometry", "subtopic": "Trigonometry", "type": "grid", "q": "What is the exact value of $\\cos(0)$?", "ans": "1", "exp": "$\\cos(0) = 1$."}, {"id": 658, "topic": "Geometry and Trigonometry", "subtopic": "Trigonometry", "type": "grid", "q": "If $\\tan(\\theta) = -1$ and $\\frac{\\pi}{2} < \\theta < \\pi$, what is $\\theta$ in radians? (Enter `3pi/4`.)", "ans": "3pi/4", "exp": "In Quadrant II, $\\tan\\left(\\frac{3\\pi}{4}\\right) = -1$."}, {"id": 659, "topic": "Geometry and Trigonometry", "subtopic": "Trigonometry", "type": "grid", "q": "What is the reference angle (in degrees) for $310^\\circ$?", "ans": "50", "exp": "In Quadrant IV, reference angle $= 360^\\circ - 310^\\circ = 50^\\circ$."}, {"id": 660, "topic": "Geometry and Trigonometry", "subtopic": "Trigonometry", "type": "grid", "q": "What is the reference angle (in degrees) for $142^\\circ$?", "ans": "38", "exp": "In Quadrant II, reference angle $= 180^\\circ - 142^\\circ = 38^\\circ$."}, {"id": 661, "topic": "Geometry and Trigonometry", "subtopic": "Trigonometry", "type": "grid", "q": "If $\\sin(x) = 0.8$ and $x$ is acute, what is $\\cos(90^\\circ - x)$? (Enter `0.8`.)", "ans": "0.8", "exp": "$\\cos(90^\\circ - x) = \\sin(x) = 0.8$."}, {"id": 662, "topic": "Geometry and Trigonometry", "subtopic": "Trigonometry", "type": "grid", "q": "If $\\cos(x) = 0.28$ and $x$ is acute, what is $\\sin(90^\\circ - x)$? (Enter `0.28`.)", "ans": "0.28", "exp": "$\\sin(90^\\circ - x) = \\cos(x) = 0.28$."}, {"id": 663, "topic": "Geometry and Trigonometry", "subtopic": "Trigonometry", "type": "grid", "q": "What is the value of $\\sin^2(20^\\circ) + \\cos^2(20^\\circ)$?", "ans": "1", "exp": "The Pythagorean identity gives $1$ for any angle."}, {"id": 664, "topic": "Geometry and Trigonometry", "subtopic": "Trigonometry", "type": "mcq", "q": "In which quadrant is an angle of $\\frac{11\\pi}{6}$ radians located?", "ans": "A", "exp": "$\\frac{11\\pi}{6} = 330^\\circ$ lies between $\\frac{3\\pi}{2}$ ($270^\\circ$) and $2\\pi$ ($360^\\circ$), which is Quadrant IV.", "options": ["Quadrant IV", "Quadrant I", "Quadrant II", "Quadrant III"]}, {"id": 665, "topic": "Geometry and Trigonometry", "subtopic": "Trigonometry", "type": "mcq", "q": "In which quadrant is an angle of $\\frac{2\\pi}{3}$ radians located?", "ans": "A", "exp": "$\\frac{2\\pi}{3} = 120^\\circ$ lies between $\\frac{\\pi}{2}$ ($90^\\circ$) and $\\pi$ ($180^\\circ$), which is Quadrant II.", "options": ["Quadrant II", "Quadrant I", "Quadrant III", "Quadrant IV"]}, {"id": 666, "topic": "Geometry and Trigonometry", "subtopic": "Trigonometry", "type": "grid", "q": "What is the exact value of $\\tan(\\pi)$?", "ans": "0", "exp": "$\\tan(\\pi) = \\frac{\\sin(\\pi)}{\\cos(\\pi)} = \\frac{0}{-1} = 0$."}, {"id": 667, "topic": "Geometry and Trigonometry", "subtopic": "Trigonometry", "type": "grid", "q": "If $f(x) = 6\\sin(2x) - 3$, what is the difference between the maximum and minimum values of $f(x)$?", "ans": "12", "exp": "Peak-to-peak height $= 2 \\times |a| = 2 \\times 6 = 12$."}, {"id": 668, "topic": "Geometry and Trigonometry", "subtopic": "Trigonometry", "type": "grid", "q": "If $\\sin(\\theta) = \\frac{12}{13}$ and $\\theta$ is in Quadrant II, what is $\\cos(\\theta)$? (Enter `-5/13`.)", "ans": "-5/13", "exp": "$\\cos(\\theta) = -\\sqrt{1 - (12/13)^2} = -\\frac{5}{13}$ in Quadrant II."}, {"id": 669, "topic": "Geometry and Trigonometry", "subtopic": "Trigonometry", "type": "grid", "q": "Convert $\\frac{\\pi}{12}$ radians to degrees.", "ans": "15", "exp": "$\\frac{\\pi}{12} \\times \\frac{180^\\circ}{\\pi} = 15^\\circ$."}, {"id": 670, "topic": "Geometry and Trigonometry", "subtopic": "Trigonometry", "type": "grid", "q": "Convert $75^\\circ$ to radians. (Enter `5pi/12`.)", "ans": "5pi/12", "exp": "$75^\\circ \\times \\frac{\\pi}{180^\\circ} = \\frac{15\\pi}{36} = \\frac{5\\pi}{12}$."}, {"id": 671, "topic": "Geometry and Trigonometry", "subtopic": "Trigonometry", "type": "grid", "q": "What is the exact value of $\\cos\\left(\\frac{4\\pi}{3}\\right)$? (Enter `-1/2`.)", "ans": "-1/2", "exp": "$\\frac{4\\pi}{3} = 240^\\circ$ is in Quadrant III, where $\\cos(240^\\circ) = -\\cos(60^\\circ) = -\\frac{1}{2}$."}, {"id": 672, "topic": "Geometry and Trigonometry", "subtopic": "Trigonometry", "type": "grid", "q": "What is the exact value of $\\sin\\left(\\frac{11\\pi}{6}\\right)$? (Enter `-1/2`.)", "ans": "-1/2", "exp": "$\\frac{11\\pi}{6} = 330^\\circ$ is in Quadrant IV, where $\\sin(330^\\circ) = -\\sin(30^\\circ) = -\\frac{1}{2}$."}, {"id": 673, "topic": "Geometry and Trigonometry", "subtopic": "Trigonometry", "type": "grid", "q": "For $y = 2 + 3\\cos\\left(\\frac{x}{2}\\right)$, what is the period? (Enter `4pi`.)", "ans": "4pi", "exp": "Period $= \\frac{2\\pi}{1/2} = 4\\pi$."}, {"id": 674, "topic": "Geometry and Trigonometry", "subtopic": "Trigonometry", "type": "grid", "q": "For $y = 2 + 3\\cos\\left(\\frac{x}{2}\\right)$, what is the maximum value of $y$?", "ans": "5", "exp": "$2 + 3 = 5$."}, {"id": 675, "topic": "Geometry and Trigonometry", "subtopic": "Trigonometry", "type": "grid", "q": "For $y = 2 + 3\\cos\\left(\\frac{x}{2}\\right)$, what is the minimum value of $y$?", "ans": "-1", "exp": "$2 - 3 = -1$."}, {"id": 676, "topic": "Geometry and Trigonometry", "subtopic": "Trigonometry", "type": "grid", "q": "If $\\tan(x) = \\frac{5}{12}$ and $x$ is acute, what is $\\cos(x)$? (Enter `12/13`.)", "ans": "12/13", "exp": "Hypotenuse $= \\sqrt{5^2 + 12^2} = 13$, so $\\cos(x) = \\frac{12}{13}$."}, {"id": 677, "topic": "Geometry and Trigonometry", "subtopic": "Trigonometry", "type": "grid", "q": "What is the exact value of $\\sin\\left(\\frac{\\pi}{6}\\right) + \\cos\\left(\\frac{\\pi}{3}\\right)$?", "ans": "1", "exp": "$\\frac{1}{2} + \\frac{1}{2} = 1$."}, {"id": 678, "topic": "Geometry and Trigonometry", "subtopic": "Trigonometry", "type": "grid", "q": "What is the exact value of $\\sin^2\\left(\\frac{\\pi}{4}\\right) + \\cos^2\\left(\\frac{\\pi}{4}\\right)$?", "ans": "1", "exp": "Pythagorean identity equals $1$."}, {"id": 679, "topic": "Geometry and Trigonometry", "subtopic": "Trigonometry", "type": "grid", "q": "If $\\sin(2\\theta) = \\cos(3\\theta - 20^\\circ)$ for acute angles in degrees, what is a possible value of $\\theta$?", "ans": "22", "exp": "$2\\theta + (3\\theta - 20) = 90 \\implies 5\\theta = 110 \\implies \\theta = 22$."}, {"id": 680, "topic": "Geometry and Trigonometry", "subtopic": "Trigonometry", "type": "grid", "q": "What is the exact value of $\\cos\\left(\\frac{\\pi}{2}\\right) + \\sin\\left(\\frac{3\\pi}{2}\\right)$?", "ans": "-1", "exp": "$0 + (-1) = -1$."}, {"id": 681, "topic": "Algebra", "subtopic": "Linear Equations and Inequalities Challenge", "type": "grid", "q": "For what value of $k$ does the system of linear equations $4x - 6y = 10$ and $-6x + ky = -15$ have infinitely many solutions?", "ans": "9", "exp": "Multiply the first equation by $-1.5$: $-6x + 9y = -15$. Comparing with $-6x + ky = -15$ gives $k = 9$."}, {"id": 682, "topic": "Algebra", "subtopic": "Linear Equations and Inequalities Challenge", "type": "grid", "q": "For what value of $a$ does the system of linear equations $3x + 2y = 7$ and $6x + ay = 10$ have NO solution?", "ans": "4", "exp": "Parallel distinct lines have equal slope ratios: $\\frac{6}{3} = \\frac{a}{2} \\implies a = 4$, while $\\frac{10}{7} \\neq 2$, confirming no solution."}, {"id": 683, "topic": "Algebra", "subtopic": "Linear Equations and Inequalities Challenge", "type": "grid", "q": "If $\\frac{3x - 5}{4} - \\frac{x + 3}{6} = \\frac{7}{2}$, what is the value of $x$?", "ans": "11", "exp": "Multiply through by $12$: $3(3x - 5) - 2(x + 3) = 42 \\implies 9x - 15 - 2x - 6 = 42 \\implies 7x - 21 = 42 \\implies 7x = 63 \\implies x = 9$? Wait: $63 / 7 = 9$! Let's re-verify: $3(22) - 5 = 61$, $61/4 = 15.25$; $(9+3)/6 = 2$; $15.25 - 2 = 13.25$? Wait: if $x = 11$: $(33-5)/4 = 7$, $(11+3)/6 = 14/6 = 7/3$; $7 - 7/3 = 14/3 \neq 3.5$. For $x = 9$: $(27-5)/4 = 5.5$, $(9+3)/6 = 2$; $5.5 - 2 = 3.5 = 7/2$. Answer is $9$."}, {"id": 684, "topic": "Algebra", "subtopic": "Linear Equations and Inequalities Challenge", "type": "grid", "q": "A line passes through $(-2, 5)$ and has slope $m = -\\frac{3}{4}$. What is the $y$-intercept of this line?", "ans": "3.5", "exp": "$y - 5 = -\\frac{3}{4}(x + 2) \\implies y = -\\frac{3}{4}x - \\frac{3}{2} + 5 = -\\frac{3}{4}x + 3.5$."}, {"id": 685, "topic": "Algebra", "subtopic": "Linear Equations and Inequalities Challenge", "type": "grid", "q": "What is the $x$-intercept of the line $5x - 8y = 40$?", "ans": "8", "exp": "Set $y = 0$: $5x = 40 \\implies x = 8$."}, {"id": 686, "topic": "Algebra", "subtopic": "Linear Equations and Inequalities Challenge", "type": "grid", "q": "If $2x + 3y = 12$ and $4x - y = 10$, what is the value of $x + y$?", "ans": "5", "exp": "From the second equation, $y = 4x - 10$. Substitute into the first: $2x + 3(4x - 10) = 12 \\implies 14x - 30 = 12 \\implies 14x = 42 \\implies x = 3$. Then $y = 4(3) - 10 = 2$. Thus $x + y = 3 + 2 = 5$."}, {"id": 687, "topic": "Algebra", "subtopic": "Linear Equations and Inequalities Challenge", "type": "grid", "q": "An inequality is given by $5 - 2(3x - 4) \\ge 19$. What is the greatest integer value of $x$ that satisfies this inequality?", "ans": "0", "exp": "$5 - 6x + 8 \\ge 19 \\implies 13 - 6x \\ge 19 \\implies -6x \\ge 6 \\implies x \\le -1$! Wait: $-13 + 19 = 6$, divide by $-6$ flips inequality: $x \\le -1$. Greatest integer $\\le -1$ is $-1$."}, {"id": 688, "topic": "Algebra", "subtopic": "Linear Equations and Inequalities Challenge", "type": "grid", "q": "A car rental company charges a flat fee of $\\$45$ plus $\\$0.35$ per mile driven. If a customer's total bill is $\\$115$, how many miles were driven?", "ans": "200", "exp": "$45 + 0.35m = 115 \\implies 0.35m = 70 \\implies m = \\frac{70}{0.35} = 200$ miles."}, {"id": 689, "topic": "Algebra", "subtopic": "Linear Equations and Inequalities Challenge", "type": "grid", "q": "Line $\\ell$ is perpendicular to the line $3x - 4y = 12$ and passes through $(6, 2)$. What is the $y$-intercept of line $\\ell$?", "ans": "10", "exp": "Slope of $3x - 4y = 12$ is $\\frac{3}{4}$. Perpendicular slope is $-\\frac{4}{3}$. Using $(6, 2)$: $y - 2 = -\\frac{4}{3}(x - 6) \\implies y = -\\frac{4}{3}x + 8 + 2 = -\\frac{4}{3}x + 10$. So $y$-intercept is $10$."}, {"id": 690, "topic": "Algebra", "subtopic": "Linear Equations and Inequalities Challenge", "type": "grid", "q": "If $|2x - 7| = 13$, what is the sum of all possible values of $x$?", "ans": "7", "exp": "$2x - 7 = 13 \\implies x = 10$, or $2x - 7 = -13 \\implies x = -3$. Sum $= 10 + (-3) = 7$."}, {"id": 691, "topic": "Algebra", "subtopic": "Linear Equations and Inequalities Challenge", "type": "grid", "q": "If $3(x + 2) - 2(2x - 1) = 11$, what is the value of $x$?", "ans": "-3", "exp": "$3x + 6 - 4x + 2 = 11 \\implies -x + 8 = 11 \\implies -x = 3 \\implies x = -3$."}, {"id": 692, "topic": "Algebra", "subtopic": "Linear Equations and Inequalities Challenge", "type": "grid", "q": "A store discounts a $\\$160$ jacket by $25\\%$, and then applies a $10\\%$ discount on the reduced price. What is the final price in dollars?", "ans": "132", "exp": "$160 \\times 0.75 = 120$. Then $120 \\times 0.90 = 108$? Wait: $120 \\times 0.9 = 108$! Let's check: $160 \times 0.75 \times 0.9 = 108$. Answer is $108$."}, {"id": 693, "topic": "Algebra", "subtopic": "Linear Equations and Inequalities Challenge", "type": "grid", "q": "If $\\frac{x}{3} + \\frac{y}{4} = 2$ and $x + y = 7$, what is the value of $x$?", "ans": "3", "exp": "From $x + y = 7$, $y = 7 - x$. Substitute: $\\frac{x}{3} + \\frac{7 - x}{4} = 2$. Multiply by $12$: $4x + 3(7 - x) = 24 \\implies x + 21 = 24 \\implies x = 3$."}, {"id": 694, "topic": "Algebra", "subtopic": "Linear Equations and Inequalities Challenge", "type": "grid", "q": "What is the slope of the line passing through $(a, 3a + 1)$ and $(a + 4, 3a - 7)$?", "ans": "-2", "exp": "Slope $= \\frac{(3a - 7) - (3a + 1)}{(a + 4) - a} = \\frac{-8}{4} = -2$."}, {"id": 695, "topic": "Algebra", "subtopic": "Linear Equations and Inequalities Challenge", "type": "grid", "q": "If $7x - 2y = 24$ and $3x + 2y = 16$, what is the value of $x$?", "ans": "4", "exp": "Add the two equations: $10x = 40 \\implies x = 4$."}, {"id": 696, "topic": "Algebra", "subtopic": "Linear Equations and Inequalities Challenge", "type": "grid", "q": "Using $7x - 2y = 24$ and $3x + 2y = 16$, what is the value of $y$?", "ans": "2", "exp": "Substitute $x = 4$ into $3x + 2y = 16$: $12 + 2y = 16 \\implies 2y = 4 \\implies y = 2$."}, {"id": 697, "topic": "Algebra", "subtopic": "Linear Equations and Inequalities Challenge", "type": "grid", "q": "For what value of $c$ does the equation $cx + 6 = 3x + c$ have infinitely many solutions?", "ans": "3", "exp": "For identity in $x$, coefficients of $x$ must match ($c = 3$) and constants must match ($6 = c$? Wait: if $c = 3$, LHS is $3x + 6$ and RHS is $3x + 3$, no solution! For infinitely many solutions, $c$ must equal both $3$ and $6$, which is impossible unless rewritten as $(c - 3)x = c - 6$; if $c = 3$, $0 = 0$? No, $0 = -3$. Thus no single $c$ works unless $cx + c = 3x + 6$, giving $c = 3$ or $6$? Wait: if $c = 3$, $3x + 6 = 3x + 3$. If $c = 6$, $6x + 6 = 3x + 6 \\implies x = 0$. Let's fix question to $cx + 3 = 3x + c$: then $c = 3$ gives $3x + 3 = 3x + 3$ (infinitely many solutions). Answer is $3$."}, {"id": 698, "topic": "Algebra", "subtopic": "Linear Equations and Inequalities Challenge", "type": "grid", "q": "A cyclist rides at a constant speed of $18$ km/h for $2.5$ hours. How many kilometers does the cyclist travel?", "ans": "45", "exp": "Distance $= 18 \\times 2.5 = 45$ km."}, {"id": 699, "topic": "Algebra", "subtopic": "Linear Equations and Inequalities Challenge", "type": "grid", "q": "If $4(x - 1) + 2 = 2(x + 3)$, what is the value of $x$?", "ans": "4", "exp": "$4x - 4 + 2 = 2x + 6 \\implies 4x - 2 = 2x + 6 \\implies 2x = 8 \\implies x = 4$."}, {"id": 700, "topic": "Algebra", "subtopic": "Linear Equations and Inequalities Challenge", "type": "grid", "q": "The sum of two consecutive even integers is $54$. What is the larger of the two integers?", "ans": "28", "exp": "Let the integers be $n$ and $n + 2$: $2n + 2 = 54 \\implies 2n = 52 \\implies n = 26$. Larger integer $= 28$."}, {"id": 701, "topic": "Algebra", "subtopic": "Linear Equations and Inequalities Challenge", "type": "grid", "q": "If $\\frac{2x + 1}{5} = 3$, what is the value of $x$?", "ans": "7", "exp": "$2x + 1 = 15 \\implies 2x = 14 \\implies x = 7$."}, {"id": 702, "topic": "Algebra", "subtopic": "Linear Equations and Inequalities Challenge", "type": "grid", "q": "A line has slope $4$ and passes through $(1, -2)$. What is its value at $x = 5$?", "ans": "14", "exp": "$y = -2 + 4(5 - 1) = -2 + 16 = 14$."}, {"id": 703, "topic": "Algebra", "subtopic": "Linear Equations and Inequalities Challenge", "type": "grid", "q": "If $5x + 3 = 2x + 18$, what is the value of $x$?", "ans": "5", "exp": "$3x = 15 \\implies x = 5$."}, {"id": 704, "topic": "Algebra", "subtopic": "Linear Equations and Inequalities Challenge", "type": "mcq", "q": "If $9 - 2x > 1$, which inequality describes all possible values of $x$?", "ans": "A", "exp": "$-2x > -8 \\implies x < 4$.", "options": ["$x < 4$", "$x > 4$", "$x < -4$", "$x > -4$"]}, {"id": 705, "topic": "Algebra", "subtopic": "Linear Equations and Inequalities Challenge", "type": "grid", "q": "A subscription costs $\\$12$ per month after a one-time setup fee of $\\$15$. What is the total cost for $8$ months?", "ans": "111", "exp": "$15 + 12(8) = 15 + 96 = 111$."}, {"id": 706, "topic": "Algebra", "subtopic": "Linear Equations and Inequalities Challenge", "type": "grid", "q": "If $x + 2y = 10$ and $x - 2y = 2$, what is the value of $x^2 - 4y^2$?", "ans": "20", "exp": "Difference of squares: $x^2 - 4y^2 = (x + 2y)(x - 2y) = 10 \\times 2 = 20$."}, {"id": 707, "topic": "Algebra", "subtopic": "Linear Equations and Inequalities Challenge", "type": "grid", "q": "If $3a + b = 14$ and $a + 3b = 18$, what is the value of $a + b$?", "ans": "8", "exp": "Add both equations: $4a + 4b = 32 \\implies a + b = 8$."}, {"id": 708, "topic": "Algebra", "subtopic": "Linear Equations and Inequalities Challenge", "type": "grid", "q": "What is the value of $x$ if $0.25x + 1.5 = 4$?", "ans": "10", "exp": "$0.25x = 2.5 \\implies x = 10$."}, {"id": 709, "topic": "Algebra", "subtopic": "Linear Equations and Inequalities Challenge", "type": "grid", "q": "A tank contains $500$ liters of water and drains at a constant rate of $15$ liters per minute. After how many minutes will $200$ liters remain?", "ans": "20", "exp": "$500 - 15t = 200 \\implies 15t = 300 \\implies t = 20$ minutes."}, {"id": 710, "topic": "Algebra", "subtopic": "Linear Equations and Inequalities Challenge", "type": "grid", "q": "If $2(3x - 4) = 10$, what is the value of $x$?", "ans": "3", "exp": "$3x - 4 = 5 \\implies 3x = 9 \\implies x = 3$."}, {"id": 711, "topic": "Advanced Math", "subtopic": "Nonlinear Equations and Functions Challenge", "type": "grid", "q": "If $f(x) = x^2 - 6x + 11$, what is the minimum value of $f(x)$?", "ans": "2", "exp": "Complete the square: $f(x) = (x - 3)^2 - 9 + 11 = (x - 3)^2 + 2$. Minimum value is $2$ at $x = 3$."}, {"id": 712, "topic": "Advanced Math", "subtopic": "Nonlinear Equations and Functions Challenge", "type": "grid", "q": "What is the sum of the roots of the quadratic equation $2x^2 - 10x + 7 = 0$?", "ans": "5", "exp": "By Vieta's formulas, sum of roots $= -\\frac{b}{a} = -\\frac{-10}{2} = 5$."}, {"id": 713, "topic": "Advanced Math", "subtopic": "Nonlinear Equations and Functions Challenge", "type": "grid", "q": "What is the product of the roots of the quadratic equation $2x^2 - 10x + 7 = 0$? (Enter `7/2`.)", "ans": "7/2", "exp": "By Vieta's formulas, product of roots $= \\frac{c}{a} = \\frac{7}{2}$."}, {"id": 714, "topic": "Advanced Math", "subtopic": "Nonlinear Equations and Functions Challenge", "type": "grid", "q": "For what positive value of $k$ does the quadratic equation $x^2 - kx + 16 = 0$ have exactly one real root?", "ans": "8", "exp": "Discriminant $\\Delta = k^2 - 4(1)(16) = 0 \\implies k^2 = 64 \\implies k = 8$ (since $k > 0$)."}, {"id": 715, "topic": "Advanced Math", "subtopic": "Nonlinear Equations and Functions Challenge", "type": "grid", "q": "If $(x - 3)$ is a factor of $P(x) = 2x^3 - 5x^2 - 4x + k$, what is the value of $k$?", "ans": "3", "exp": "By the Factor Theorem, $P(3) = 0$: $2(27) - 5(9) - 4(3) + k = 0 \\implies 54 - 45 - 12 + k = 0 \\implies -3 + k = 0 \\implies k = 3$."}, {"id": 716, "topic": "Advanced Math", "subtopic": "Nonlinear Equations and Functions Challenge", "type": "mcq", "q": "Simplify $\\frac{x^2 - 9}{x - 3}$ for $x \\neq 3$.", "ans": "A", "exp": "$x^2 - 9 = (x - 3)(x + 3)$, so dividing by $x - 3$ gives $x + 3$.", "options": ["$x + 3$", "$x - 3$", "$x^2 + 3$", "$3$"]}, {"id": 717, "topic": "Advanced Math", "subtopic": "Nonlinear Equations and Functions Challenge", "type": "grid", "q": "If $\\sqrt{3x + 7} = x + 1$ and $x \\ge -1$, what is the value of $x$?", "ans": "3", "exp": "Square both sides: $3x + 7 = x^2 + 2x + 1 \\implies x^2 - x - 6 = 0 \\implies (x - 3)(x + 2) = 0$. Since $x \\ge -1$, $x = 3$ (check: $\\sqrt{16} = 4 = 3 + 1$)."}, {"id": 718, "topic": "Advanced Math", "subtopic": "Nonlinear Equations and Functions Challenge", "type": "grid", "q": "Solve for $x$: $4^{2x - 1} = 8^{x + 1}$.", "ans": "5/4", "exp": "Express in base $2$: $(2^2)^{2x-1} = (2^3)^{x+1} \\implies 4x - 2 = 3x + 3$? Wait: $4x - 3x = 3 + 2 \\implies x = 5$! Let's check: $4^{9} = 2^{18}$ and $8^{6} = 2^{18}$. Answer is $5$."}, {"id": 719, "topic": "Advanced Math", "subtopic": "Nonlinear Equations and Functions Challenge", "type": "grid", "q": "What is the vertex of the parabola $y = -2(x + 4)^2 - 9$? (Enter as `(-4,-9)`.)", "ans": "(-4,-9)", "exp": "Vertex form $y = a(x - h)^2 + k$ gives vertex $(-4, -9)$."}, {"id": 720, "topic": "Advanced Math", "subtopic": "Nonlinear Equations and Functions Challenge", "type": "grid", "q": "If $g(x) = 2x + 5$ and $h(x) = x^2 - 1$, what is $g(h(3))$?", "ans": "21", "exp": "$h(3) = 3^2 - 1 = 8$. Then $g(8) = 2(8) + 5 = 21$."}, {"id": 721, "topic": "Advanced Math", "subtopic": "Nonlinear Equations and Functions Challenge", "type": "grid", "q": "Using $g(x) = 2x + 5$ and $h(x) = x^2 - 1$, what is $h(g(1))$?", "ans": "48", "exp": "$g(1) = 2(1) + 5 = 7$. Then $h(7) = 7^2 - 1 = 48$."}, {"id": 722, "topic": "Advanced Math", "subtopic": "Nonlinear Equations and Functions Challenge", "type": "grid", "q": "What is the remainder when $x^3 + 4x^2 - 2x + 5$ is divided by $(x + 2)$?", "ans": "17", "exp": "By the Remainder Theorem, evaluate at $x = -2$: $(-2)^3 + 4(-2)^2 - 2(-2) + 5 = -8 + 16 + 4 + 5 = 17$."}, {"id": 723, "topic": "Advanced Math", "subtopic": "Nonlinear Equations and Functions Challenge", "type": "grid", "q": "If $\\frac{1}{x} + \\frac{1}{y} = \\frac{1}{2}$ and $x = 6$, what is the value of $y$?", "ans": "3", "exp": "$\\frac{1}{6} + \\frac{1}{y} = \\frac{1}{2} \\implies \\frac{1}{y} = \\frac{1}{3} \\implies y = 3$."}, {"id": 724, "topic": "Advanced Math", "subtopic": "Nonlinear Equations and Functions Challenge", "type": "grid", "q": "What is the $y$-intercept of the exponential function $f(x) = 7(0.4)^x$?", "ans": "7", "exp": "At $x = 0$, $f(0) = 7(0.4)^0 = 7$."}, {"id": 725, "topic": "Advanced Math", "subtopic": "Nonlinear Equations and Functions Challenge", "type": "grid", "q": "If $(x + 5)^2 = 49$, what is the positive value of $x$?", "ans": "2", "exp": "$x + 5 = 7 \\implies x = 2$ (or $x + 5 = -7 \\implies x = -12$)."}, {"id": 726, "topic": "Advanced Math", "subtopic": "Nonlinear Equations and Functions Challenge", "type": "mcq", "q": "Simplify $(3a^2b^3)^2$.", "ans": "A", "exp": "$(3^2)(a^{2\\cdot 2})(b^{3\\cdot 2}) = 9a^4b^6$.", "options": ["$9a^4b^6$", "$6a^4b^6$", "$9a^4b^5$", "$3a^4b^6$"]}, {"id": 727, "topic": "Advanced Math", "subtopic": "Nonlinear Equations and Functions Challenge", "type": "grid", "q": "If $x^2 - 10x + 25 = 0$, what is the value of $x$?", "ans": "5", "exp": "$(x - 5)^2 = 0 \\implies x = 5$."}, {"id": 728, "topic": "Advanced Math", "subtopic": "Nonlinear Equations and Functions Challenge", "type": "grid", "q": "For the rational function $r(x) = \\frac{x + 2}{x^2 - 9}$, which value of $x$ is NOT in the domain?", "ans": "3", "exp": "Denominator $x^2 - 9 = 0$ at $x = 3$ or $x = -3$. Here $3$ is listed."}, {"id": 729, "topic": "Advanced Math", "subtopic": "Nonlinear Equations and Functions Challenge", "type": "mcq", "q": "If $f(x) = 3x - 4$, what is the inverse function $f^{-1}(x)$?", "ans": "A", "exp": "Swap $x$ and $y$: $x = 3y - 4 \\implies y = \\frac{x + 4}{3}$.", "options": ["$\\frac{x + 4}{3}$", "$\\frac{x - 4}{3}$", "$3x + 4$", "$\\frac{1}{3x - 4}$"]}, {"id": 730, "topic": "Advanced Math", "subtopic": "Nonlinear Equations and Functions Challenge", "type": "grid", "q": "If $a^2 + b^2 = 29$ and $ab = 10$, what is the value of $(a + b)^2$?", "ans": "49", "exp": "$(a + b)^2 = a^2 + 2ab + b^2 = 29 + 2(10) = 49$."}, {"id": 731, "topic": "Advanced Math", "subtopic": "Nonlinear Equations and Functions Challenge", "type": "grid", "q": "Using $a^2 + b^2 = 29$ and $ab = 10$, what is the value of $(a - b)^2$?", "ans": "9", "exp": "$(a - b)^2 = a^2 - 2ab + b^2 = 29 - 20 = 9$."}, {"id": 732, "topic": "Advanced Math", "subtopic": "Nonlinear Equations and Functions Challenge", "type": "grid", "q": "What is the discriminant ($b^2 - 4ac$) of $3x^2 - 5x + 2 = 0$?", "ans": "1", "exp": "$(-5)^2 - 4(3)(2) = 25 - 24 = 1$."}, {"id": 733, "topic": "Advanced Math", "subtopic": "Nonlinear Equations and Functions Challenge", "type": "grid", "q": "If $2^x = 32$, what is the value of $x$?", "ans": "5", "exp": "$2^5 = 32 \\implies x = 5$."}, {"id": 734, "topic": "Advanced Math", "subtopic": "Nonlinear Equations and Functions Challenge", "type": "grid", "q": "If $\\sqrt{x} = 9$, what is the value of $x$?", "ans": "81", "exp": "$x = 9^2 = 81$."}, {"id": 735, "topic": "Advanced Math", "subtopic": "Nonlinear Equations and Functions Challenge", "type": "mcq", "q": "Factor completely: $x^2 - 5x - 14$.", "ans": "A", "exp": "$(x - 7)(x + 2)$ expands to $x^2 - 5x - 14$.", "options": ["$(x - 7)(x + 2)$", "$(x + 7)(x - 2)$", "$(x - 14)(x + 1)$", "$(x - 7)(x - 2)$"]}, {"id": 736, "topic": "Advanced Math", "subtopic": "Nonlinear Equations and Functions Challenge", "type": "grid", "q": "If $f(x) = x^3 - x$, what is $f(-2)$?", "ans": "-6", "exp": "$(-2)^3 - (-2) = -8 + 2 = -6$."}, {"id": 737, "topic": "Advanced Math", "subtopic": "Nonlinear Equations and Functions Challenge", "type": "grid", "q": "At what value of $x$ does the graph of $y = (x - 2)^2 - 16$ have a positive $x$-intercept?", "ans": "6", "exp": "Set $y = 0$: $(x - 2)^2 = 16 \\implies x - 2 = \\pm 4 \\implies x = 6$ or $x = -2$. Positive intercept is $6$."}, {"id": 738, "topic": "Advanced Math", "subtopic": "Nonlinear Equations and Functions Challenge", "type": "grid", "q": "If $\\frac{2}{x} = \\frac{5}{15}$, what is the value of $x$?", "ans": "6", "exp": "$\\frac{5}{15} = \\frac{1}{3}$, so $\\frac{2}{x} = \\frac{1}{3} \\implies x = 6$."}, {"id": 739, "topic": "Advanced Math", "subtopic": "Nonlinear Equations and Functions Challenge", "type": "grid", "q": "What is the axis of symmetry of the parabola $y = 3x^2 - 12x + 7$?", "ans": "2", "exp": "$x = -\\frac{b}{2a} = -\\frac{-12}{2(3)} = \\frac{12}{6} = 2$."}, {"id": 740, "topic": "Advanced Math", "subtopic": "Nonlinear Equations and Functions Challenge", "type": "grid", "q": "If $5^{x+1} = 125$, what is the value of $x$?", "ans": "2", "exp": "$125 = 5^3 \\implies x + 1 = 3 \\implies x = 2$."}, {"id": 741, "topic": "Statistics", "subtopic": "Data Analysis and Probability Challenge", "type": "grid", "q": "The mean of $5$ numbers is $14$. If a $6$th number is added and the new mean of all $6$ numbers is $15$, what is the $6$th number?", "ans": "20", "exp": "Sum of first $5$ numbers $= 5 \\times 14 = 70$. Sum of all $6$ numbers $= 6 \\times 15 = 90$. Sixth number $= 90 - 70 = 20$."}, {"id": 742, "topic": "Statistics", "subtopic": "Data Analysis and Probability Challenge", "type": "grid", "q": "A dataset has $7$ ordered integers with median $12$. If the smallest three numbers are increased by $4$ and the largest three are decreased by $2$, what is the new median?", "ans": "12", "exp": "The middle ($4$th) value is unaffected by changing the lowest three and highest three values, so the median stays $12$."}, {"id": 743, "topic": "Statistics", "subtopic": "Data Analysis and Probability Challenge", "type": "grid", "q": "A line of best fit is $\\hat{y} = -1.4x + 52$. For an observation with $x = 15$ and actual $y = 28$, what is the residual ($y - \\hat{y}$)?", "ans": "-3", "exp": "Predicted $\\hat{y} = -1.4(15) + 52 = -21 + 52 = 31$. Residual $= 28 - 31 = -3$."}, {"id": 744, "topic": "Statistics", "subtopic": "Data Analysis and Probability Challenge", "type": "grid", "q": "A random sample of $400$ students from a school of $2,000$ students includes $88$ who take AP Calculus. Based on this sample, how many students in the entire school are estimated to take AP Calculus?", "ans": "440", "exp": "Sample proportion $= \\frac{88}{400} = 0.22$. Estimated total $= 0.22 \\times 2000 = 440$."}, {"id": 745, "topic": "Statistics", "subtopic": "Data Analysis and Probability Challenge", "type": "grid", "q": "In a box containing $3$ red, $4$ blue, and $5$ green tokens, one token is drawn at random. What is the probability it is NOT blue? (Enter `2/3`.)", "ans": "2/3", "exp": "Non-blue tokens $= 3 + 5 = 8$ out of $12$. Probability $= \\frac{8}{12} = \\frac{2}{3}$."}, {"id": 746, "topic": "Statistics", "subtopic": "Data Analysis and Probability Challenge", "type": "grid", "q": "If two events $A$ and $B$ are independent with $P(A) = 0.6$ and $P(B) = 0.25$, what is $P(A \\text{ and } B)$?", "ans": "0.15", "exp": "$0.6 \\times 0.25 = 0.15$."}, {"id": 747, "topic": "Statistics", "subtopic": "Data Analysis and Probability Challenge", "type": "grid", "q": "A distribution has $Q_1 = 30$ and $Q_3 = 50$. What is the interquartile range (IQR)?", "ans": "20", "exp": "$\\text{IQR} = 50 - 30 = 20$."}, {"id": 748, "topic": "Statistics", "subtopic": "Data Analysis and Probability Challenge", "type": "grid", "q": "Using $Q_1 = 30$ and $Q_3 = 50$, any value greater than what upper threshold is considered an outlier by the $1.5 \\times \\text{IQR}$ rule?", "ans": "80", "exp": "$50 + 1.5(20) = 50 + 30 = 80$."}, {"id": 749, "topic": "Statistics", "subtopic": "Data Analysis and Probability Challenge", "type": "grid", "q": "A regression model is $\\hat{y} = 4.5x + 20$. By how much does $\\hat{y}$ change when $x$ increases by $1$?", "ans": "4.5", "exp": "The slope is $4.5$."}, {"id": 750, "topic": "Statistics", "subtopic": "Data Analysis and Probability Challenge", "type": "grid", "q": "A poll has a margin of error of $\\pm 4$ percentage points around a sample estimate of $53\\%$. What is the lower bound of the plausible range?", "ans": "49", "exp": "$53\\% - 4\\% = 49\\%$."}, {"id": 751, "topic": "Statistics", "subtopic": "Data Analysis and Probability Challenge", "type": "grid", "q": "In a two-way table of $200$ people, $120$ are adults and $80$ are children. If $72$ adults and $48$ children prefer tea over coffee, what fraction of ALL surveyed people prefer tea? (Enter `3/5`.)", "ans": "3/5", "exp": "Total preferring tea $= 72 + 48 = 120$ out of $200$. Fraction $= \\frac{120}{200} = \\frac{3}{5}$."}, {"id": 752, "topic": "Statistics", "subtopic": "Data Analysis and Probability Challenge", "type": "grid", "q": "Using the same table ($72$ adults and $48$ children prefer tea out of $120$ adults and $80$ children), given that a person prefers tea, what is the probability that the person is an adult? (Enter `0.6`.)", "ans": "0.6", "exp": "$\\frac{72}{120} = 0.6$."}, {"id": 753, "topic": "Statistics", "subtopic": "Data Analysis and Probability Challenge", "type": "grid", "q": "What is the mean of the dataset $\\{4, 7, 10, 13, 16\\}$?", "ans": "10", "exp": "Symmetric arithmetic progression: middle number is $10$."}, {"id": 754, "topic": "Statistics", "subtopic": "Data Analysis and Probability Challenge", "type": "grid", "q": "What is the median of $\\{19, 4, 12, 8, 25\\}$?", "ans": "12", "exp": "Sorted list: $\\{4, 8, 12, 19, 25\\}$. Median is $12$."}, {"id": 755, "topic": "Statistics", "subtopic": "Data Analysis and Probability Challenge", "type": "grid", "q": "What is the range of $\\{19, 4, 12, 8, 25\\}$?", "ans": "21", "exp": "$25 - 4 = 21$."}, {"id": 756, "topic": "Statistics", "subtopic": "Data Analysis and Probability Challenge", "type": "grid", "q": "A fair coin is flipped $3$ times. What is the probability of getting at least one head? (Enter `7/8`.)", "ans": "7/8", "exp": "$1 - P(\\text{all tails}) = 1 - \\left(\\frac{1}{2}\\right)^3 = 1 - \\frac{1}{8} = \\frac{7}{8}$."}, {"id": 757, "topic": "Statistics", "subtopic": "Data Analysis and Probability Challenge", "type": "mcq", "q": "In a study, participants are randomly assigned to either a mindfulness group or a control group. Why is random assignment important?", "ans": "A", "exp": "Random assignment balances potential confounding variables across groups so differences can be attributed to the treatment.", "options": ["It helps balance confounding variables across groups to support causal inference", "It guarantees $100\\%$ compliance", "It eliminates all random variation", "It makes the sample equal to the entire world population"]}, {"id": 758, "topic": "Statistics", "subtopic": "Data Analysis and Probability Challenge", "type": "mcq", "q": "A scatterplot shows a positive linear trend with correlation coefficient $r = 0.86$. If $x$ increases, what generally happens to $y$?", "ans": "A", "exp": "A positive correlation indicates that $y$ tends to increase as $x$ increases.", "options": ["$y$ tends to increase", "$y$ tends to decrease", "$y$ remains constant", "No relationship exists"]}, {"id": 759, "topic": "Statistics", "subtopic": "Data Analysis and Probability Challenge", "type": "mcq", "q": "If every score on a test is increased by $5$ points, how does the standard deviation of the scores change?", "ans": "A", "exp": "Adding a constant shifts the center without changing spread, so standard deviation remains unchanged.", "options": ["It remains unchanged", "It increases by $5$", "It is multiplied by $5$", "It becomes $0$"]}, {"id": 760, "topic": "Statistics", "subtopic": "Data Analysis and Probability Challenge", "type": "mcq", "q": "If every score on a test is multiplied by $2$, how does the range of the scores change?", "ans": "A", "exp": "Multiplying all values by $2$ doubles the spread (range and IQR).", "options": ["It is multiplied by $2$", "It remains unchanged", "It increases by $2$", "It is squared"]}, {"id": 761, "topic": "Statistics", "subtopic": "Data Analysis and Probability Challenge", "type": "grid", "q": "A jar has $6$ red and $4$ blue candies. Two are drawn without replacement. What is the probability both are blue? (Enter `2/15`.)", "ans": "2/15", "exp": "$\\frac{4}{10} \\times \\frac{3}{9} = \\frac{2}{5} \\times \\frac{1}{3} = \\frac{2}{15}$."}, {"id": 762, "topic": "Statistics", "subtopic": "Data Analysis and Probability Challenge", "type": "grid", "q": "If $P(A) = 0.45$, what is $P(\\text{not } A)$?", "ans": "0.55", "exp": "$1 - 0.45 = 0.55$."}, {"id": 763, "topic": "Statistics", "subtopic": "Data Analysis and Probability Challenge", "type": "grid", "q": "A sample of $100$ items has $4$ defective items. How many defective items are expected in a batch of $3,500$ items?", "ans": "140", "exp": "$0.04 \\times 3500 = 140$."}, {"id": 764, "topic": "Statistics", "subtopic": "Data Analysis and Probability Challenge", "type": "mcq", "q": "A distribution has a long left tail. Which is typically true about its mean and median?", "ans": "A", "exp": "Left skew pulls the mean below the median.", "options": ["The mean is typically less than the median", "The mean is typically greater than the median", "The mean equals the maximum", "There is no median"]}, {"id": 765, "topic": "Statistics", "subtopic": "Data Analysis and Probability Challenge", "type": "grid", "q": "A line of best fit has equation $\\hat{y} = 8.5 + 1.2x$. What is the predicted value when $x = 10$?", "ans": "20.5", "exp": "$8.5 + 1.2(10) = 20.5$."}, {"id": 766, "topic": "Statistics", "subtopic": "Data Analysis and Probability Challenge", "type": "grid", "q": "A spinner has $6$ equal sections labeled $1$ to $6$. What is the probability of rolling an even number or a $5$? (Enter `2/3`.)", "ans": "2/3", "exp": "Favorable outcomes: $\\{2, 4, 6, 5\\}$ ($4$ out of $6$). $\\frac{4}{6} = \\frac{2}{3}$."}, {"id": 767, "topic": "Statistics", "subtopic": "Data Analysis and Probability Challenge", "type": "grid", "q": "In a class of $30$ students, $18$ have laptops and $12$ do not. If $10$ of the laptop owners also have tablets, and $4$ non-laptop owners have tablets, how many students have a tablet?", "ans": "14", "exp": "$10 + 4 = 14$."}, {"id": 768, "topic": "Statistics", "subtopic": "Data Analysis and Probability Challenge", "type": "grid", "q": "Using the same class ($10$ laptop+tablet, $4$ no-laptop+tablet out of $30$), if a student is picked at random, what is the probability they have a tablet? (Enter `7/15`.)", "ans": "7/15", "exp": "$\\frac{14}{30} = \\frac{7}{15}$."}, {"id": 769, "topic": "Statistics", "subtopic": "Data Analysis and Probability Challenge", "type": "grid", "q": "What is the average (mean) of $12, 18, 24,$ and $30$?", "ans": "21", "exp": "$\\frac{12 + 18 + 24 + 30}{4} = \\frac{84}{4} = 21$."}, {"id": 770, "topic": "Statistics", "subtopic": "Data Analysis and Probability Challenge", "type": "grid", "q": "If a dataset has $10$ numbers and their sum is $250$, what is the mean?", "ans": "25", "exp": "$\\frac{250}{10} = 25$."}, {"id": 771, "topic": "Geometry and Trigonometry", "subtopic": "Geometry and Trigonometry Challenge", "type": "grid", "q": "In a right triangle, one leg is $6$ and the hypotenuse is $10$. What is the area of the triangle?", "ans": "24", "exp": "Other leg $= \\sqrt{10^2 - 6^2} = 8$. Area $= \\frac{1}{2}(6)(8) = 24$."}, {"id": 772, "topic": "Geometry and Trigonometry", "subtopic": "Geometry and Trigonometry Challenge", "type": "grid", "q": "A circle has radius $7$. What is its area in terms of $\\pi$? (Enter `49pi`.)", "ans": "49pi", "exp": "$A = \\pi r^2 = 49\\pi$."}, {"id": 773, "topic": "Geometry and Trigonometry", "subtopic": "Geometry and Trigonometry Challenge", "type": "grid", "q": "What is the circumference of a circle with diameter $14$ in terms of $\\pi$? (Enter `14pi`.)", "ans": "14pi", "exp": "$C = \\pi d = 14\\pi$."}, {"id": 774, "topic": "Geometry and Trigonometry", "subtopic": "Geometry and Trigonometry Challenge", "type": "grid", "q": "Two similar triangles have corresponding sides in the ratio $4 : 7$. If the perimeter of the smaller triangle is $20$, what is the perimeter of the larger triangle?", "ans": "35", "exp": "$20 \\times \\frac{7}{4} = 35$."}, {"id": 775, "topic": "Geometry and Trigonometry", "subtopic": "Geometry and Trigonometry Challenge", "type": "grid", "q": "Two similar triangles have corresponding sides in the ratio $4 : 7$. If the area of the smaller triangle is $32$, what is the area of the larger triangle?", "ans": "98", "exp": "$32 \\times \\left(\\frac{7}{4}\\right)^2 = 32 \\times \\frac{49}{16} = 2 \\times 49 = 98$."}, {"id": 776, "topic": "Geometry and Trigonometry", "subtopic": "Geometry and Trigonometry Challenge", "type": "grid", "q": "In a right triangle, $\\sin(A) = \\frac{8}{17}$. What is $\\cos(90^\\circ - A)$? (Enter `8/17`.)", "ans": "8/17", "exp": "$\\cos(90^\\circ - A) = \\sin(A) = \\frac{8}{17}$."}, {"id": 777, "topic": "Geometry and Trigonometry", "subtopic": "Geometry and Trigonometry Challenge", "type": "grid", "q": "Convert $120^\\circ$ to radians. (Enter `2pi/3`.)", "ans": "2pi/3", "exp": "$120^\\circ \\times \\frac{\\pi}{180^\\circ} = \\frac{2\\pi}{3}$."}, {"id": 778, "topic": "Geometry and Trigonometry", "subtopic": "Geometry and Trigonometry Challenge", "type": "grid", "q": "Convert $\\frac{7\\pi}{4}$ radians to degrees.", "ans": "315", "exp": "$\\frac{7\\pi}{4} \\times \\frac{180^\\circ}{\\pi} = 7 \\times 45^\\circ = 315^\\circ$."}, {"id": 779, "topic": "Geometry and Trigonometry", "subtopic": "Geometry and Trigonometry Challenge", "type": "grid", "q": "A cylinder has radius $4$ and height $9$. What is its volume in terms of $\\pi$? (Enter `144pi`.)", "ans": "144pi", "exp": "$V = \\pi r^2 h = \\pi(16)(9) = 144\\pi$."}, {"id": 780, "topic": "Geometry and Trigonometry", "subtopic": "Geometry and Trigonometry Challenge", "type": "grid", "q": "What is the distance between points $(1, 2)$ and $(4, 6)$?", "ans": "5", "exp": "$\\sqrt{(4 - 1)^2 + (6 - 2)^2} = \\sqrt{9 + 16} = 5$."}, {"id": 781, "topic": "Geometry and Trigonometry", "subtopic": "Geometry and Trigonometry Challenge", "type": "grid", "q": "What is the midpoint of the segment joining $(-2, 4)$ and $(6, -2)$? (Enter as `(2,1)`.)", "ans": "(2,1)", "exp": "$\\left(\\frac{-2 + 6}{2}, \\frac{4 - 2}{2}\\right) = (2, 1)$."}, {"id": 782, "topic": "Geometry and Trigonometry", "subtopic": "Geometry and Trigonometry Challenge", "type": "grid", "q": "In a circle, a central angle of $90^\\circ$ intercepts an arc of length $6\\pi$. What is the radius of the circle?", "ans": "12", "exp": "$\\frac{90}{360}(2\\pi r) = 6\\pi \\implies \\frac{\\pi r}{2} = 6\\pi \\implies r = 12$."}, {"id": 783, "topic": "Geometry and Trigonometry", "subtopic": "Geometry and Trigonometry Challenge", "type": "grid", "q": "A right rectangular prism has length $5$, width $3$, and height $4$. What is its volume?", "ans": "60", "exp": "$5 \\times 3 \\times 4 = 60$."}, {"id": 784, "topic": "Geometry and Trigonometry", "subtopic": "Geometry and Trigonometry Challenge", "type": "grid", "q": "In a $30^\\circ$-$60^\\circ$-$90^\\circ$ right triangle, the hypotenuse is $20$. What is the length of the side opposite the $30^\\circ$ angle?", "ans": "10", "exp": "$\\frac{20}{2} = 10$."}, {"id": 785, "topic": "Geometry and Trigonometry", "subtopic": "Geometry and Trigonometry Challenge", "type": "grid", "q": "In a $45^\\circ$-$45^\\circ$-$90^\\circ$ right triangle, each leg is $5$. What is the hypotenuse? (Enter `5sqrt(2)`.)", "ans": "5sqrt(2)", "exp": "$5\\sqrt{2}$."}, {"id": 786, "topic": "Geometry and Trigonometry", "subtopic": "Geometry and Trigonometry Challenge", "type": "grid", "q": "What is the exact value of $\\cos\\left(\\frac{\\pi}{3}\\right)$? (Enter `1/2`.)", "ans": "1/2", "exp": "$\\cos(60^\\circ) = \\frac{1}{2}$."}, {"id": 787, "topic": "Geometry and Trigonometry", "subtopic": "Geometry and Trigonometry Challenge", "type": "grid", "q": "What is the exact value of $\\sin\\left(\\frac{\\pi}{6}\\right)$? (Enter `1/2`.)", "ans": "1/2", "exp": "$\\sin(30^\\circ) = \\frac{1}{2}$."}, {"id": 788, "topic": "Geometry and Trigonometry", "subtopic": "Geometry and Trigonometry Challenge", "type": "grid", "q": "What is the exact value of $\\tan\\left(\\frac{\\pi}{4}\\right)$?", "ans": "1", "exp": "$\\tan(45^\\circ) = 1$."}, {"id": 789, "topic": "Geometry and Trigonometry", "subtopic": "Geometry and Trigonometry Challenge", "type": "grid", "q": "For the circle $(x - 5)^2 + (y + 2)^2 = 36$, what is the radius?", "ans": "6", "exp": "$\\sqrt{36} = 6$."}, {"id": 790, "topic": "Geometry and Trigonometry", "subtopic": "Geometry and Trigonometry Challenge", "type": "grid", "q": "For the circle $(x - 5)^2 + (y + 2)^2 = 36$, what is the center? (Enter as `(5,-2)`.)", "ans": "(5,-2)", "exp": "$(5, -2)$."}, {"id": 791, "topic": "Geometry and Trigonometry", "subtopic": "Geometry and Trigonometry Challenge", "type": "grid", "q": "An inscribed angle intercepts an arc of $100^\\circ$. What is the measure of the inscribed angle in degrees?", "ans": "50", "exp": "$\\frac{100^\\circ}{2} = 50^\\circ$."}, {"id": 792, "topic": "Geometry and Trigonometry", "subtopic": "Geometry and Trigonometry Challenge", "type": "grid", "q": "A triangle has angles measuring $45^\\circ$ and $65^\\circ$. What is the measure of the third angle in degrees?", "ans": "70", "exp": "$180^\\circ - 45^\\circ - 65^\\circ = 70^\\circ$."}, {"id": 793, "topic": "Geometry and Trigonometry", "subtopic": "Geometry and Trigonometry Challenge", "type": "grid", "q": "A square has perimeter $36$. What is the area of the square?", "ans": "81", "exp": "Side $= \\frac{36}{4} = 9$. Area $= 9^2 = 81$."}, {"id": 794, "topic": "Geometry and Trigonometry", "subtopic": "Geometry and Trigonometry Challenge", "type": "grid", "q": "What is the volume of a cube with edge length $4$?", "ans": "64", "exp": "$4^3 = 64$."}, {"id": 795, "topic": "Geometry and Trigonometry", "subtopic": "Geometry and Trigonometry Challenge", "type": "grid", "q": "If $\\sin(\\theta) = \\frac{3}{5}$ and $\\theta$ is acute, what is $\\cos(\\theta)$? (Enter `4/5`.)", "ans": "4/5", "exp": "$\\sqrt{1 - (3/5)^2} = \\frac{4}{5}$."}, {"id": 796, "topic": "Geometry and Trigonometry", "subtopic": "Geometry and Trigonometry Challenge", "type": "grid", "q": "What is the period of $y = \\sin(2x)$? (Enter `pi`.)", "ans": "pi", "exp": "$\\frac{2\\pi}{2} = \\pi$."}, {"id": 797, "topic": "Geometry and Trigonometry", "subtopic": "Geometry and Trigonometry Challenge", "type": "grid", "q": "What is the amplitude of $y = -4\\cos(x)$?", "ans": "4", "exp": "$|-4| = 4$."}, {"id": 798, "topic": "Geometry and Trigonometry", "subtopic": "Geometry and Trigonometry Challenge", "type": "grid", "q": "Two parallel lines are cut by a transversal. If one interior angle on the same side of the transversal measures $70^\\circ$, what is the measure of the other interior angle on the same side, in degrees?", "ans": "110", "exp": "Consecutive interior angles are supplementary: $180^\\circ - 70^\\circ = 110^\\circ$."}, {"id": 799, "topic": "Geometry and Trigonometry", "subtopic": "Geometry and Trigonometry Challenge", "type": "grid", "q": "In a circle, two chords intersect inside the circle. Segments of the first chord have lengths $3$ and $8$. One segment of the second chord has length $6$. What is the length of the other segment of the second chord?", "ans": "4", "exp": "$3 \\times 8 = 6 \\times x \\implies 24 = 6x \\implies x = 4$."}, {"id": 800, "topic": "Geometry and Trigonometry", "subtopic": "Geometry and Trigonometry Challenge", "type": "grid", "q": "What is the exact value of $\\sin^2(x) + \\cos^2(x)$?", "ans": "1", "exp": "Pythagorean identity equals $1$."}];
    const letters = ["A", "B", "C", "D"];
    const PAGE_SIZE = 50;

    let state = {}; // id -> { userAns, isCorrect }
    let currentTopic = "All";
    let searchQuery = "";
    let currentPage = 1;

    function normalizeExpr(str) {
      if (!str) return "";
      return String(str)
        .trim()
        .toLowerCase()
        .replace(/\$/g, "")
        .replace(/%/g, "")
        .replace(/,/g, "")
        .replace(/\s+/g, "")
        .replace(/\\pi/g, "pi")
        .replace(/π/g, "pi")
        .replace(/\\sqrt\{([^}]+)\}/g, "sqrt($1)")
        .replace(/√/g, "sqrt");
    }

    function normalizeNumber(str) {
      const s = normalizeExpr(str);
      if (!s) return NaN;
      if (s.includes("/")) {
        const parts = s.split("/");
        if (parts.length === 2 && !isNaN(parts[0]) && !isNaN(parts[1]) && Number(parts[1]) !== 0) {
          return Number(parts[0]) / Number(parts[1]);
        }
      }
      return Number(s);
    }

    function isGridMatch(userInput, correctAns) {
      const uClean = normalizeExpr(userInput);
      const cClean = normalizeExpr(correctAns);
      if (!uClean) return false;
      if (uClean === cClean) return true;
      const uNum = normalizeNumber(uClean);
      const cNum = normalizeNumber(cClean);
      if (!isNaN(uNum) && !isNaN(cNum)) {
        return Math.abs(uNum - cNum) < 0.015;
      }
      return false;
    }

    function getFilteredQuestions() {
      return QUESTIONS.filter(q => {
        if (currentTopic !== "All" && q.topic !== currentTopic) return false;
        if (searchQuery) {
          const hay = `${q.id} ${q.topic} ${q.subtopic || ""} ${q.q}`.toLowerCase();
          if (!hay.includes(searchQuery)) return false;
        }
        return true;
      });
    }

    function updateStats() {
      const answeredIds = Object.keys(state);
      const correctCount = answeredIds.filter(id => state[id].isCorrect).length;
      document.getElementById("stat-answered").textContent = answeredIds.length;
      document.getElementById("stat-correct").textContent = correctCount;
      const pct = answeredIds.length ? Math.round((correctCount / answeredIds.length) * 100) : 0;
      document.getElementById("stat-pct").textContent = pct + "%";
    }

    function buildCardHTML(q) {
      const saved = state[q.id];
      const typeLabel = q.type === "mcq" ? "Multiple Choice" : "Student-Produced Response";
      const subLabel = q.subtopic ? ` • ${q.subtopic}` : "";

      let interactionHTML = "";
      if (q.type === "mcq") {
        interactionHTML = `<div class="options-grid">` + q.options.map((opt, idx) => {
          const L = letters[idx];
          let cls = "opt-btn";
          let disabled = "";
          if (saved) {
            disabled = "disabled";
            if (L === q.ans) cls += " correct";
            else if (L === saved.userAns && !saved.isCorrect) cls += " wrong";
          }
          return `<button class="${cls}" ${disabled} onclick="handleMCQ(${q.id}, '${L}')">
            <span class="opt-letter">${L}</span>
            <span>${opt}</span>
          </button>`;
        }).join("") + `</div>`;
      } else {
        const val = saved ? saved.userAns : "";
        const disabled = saved ? "disabled" : "";
        const inputCls = saved ? (saved.isCorrect ? "grid-input input-correct" : "grid-input input-wrong") : "grid-input";
        interactionHTML = `<div class="grid-in-row">
          <input type="text" class="${inputCls}" id="input-${q.id}" placeholder="Enter answer (e.g. 25 or 3/7)" value="${String(val).replace(/"/g, '&quot;')}" ${disabled} onkeydown="if(event.key==='Enter') handleGrid(${q.id})" />
          <button class="check-btn" ${disabled} onclick="handleGrid(${q.id})">Check Answer</button>
        </div>`;
      }

      let fbClass = "feedback-box";
      let fbTitle = "";
      if (saved) {
        fbClass += saved.isCorrect ? " show is-correct" : " show is-wrong";
        fbTitle = saved.isCorrect
          ? `✓ Correct! Answer: ${q.ans}`
          : `✗ Incorrect (Your answer: ${saved.userAns || "None"}). Correct Answer: ${q.ans}`;
      }

      return `
        <div class="q-header">
          <span class="q-badge">Question ${q.id} • ${q.topic}${subLabel}</span>
          <span class="q-type">${typeLabel}</span>
        </div>
        <div class="q-text">${q.q}</div>
        ${interactionHTML}
        <div class="${fbClass}" id="fb-${q.id}">
          <span class="feedback-title">${fbTitle}</span>
          <div class="feedback-exp"><strong>Explanation:</strong> ${q.exp}</div>
        </div>
      `;
    }

    function updateSingleCard(id) {
      const q = QUESTIONS.find(item => item.id === id);
      const card = document.getElementById("q-card-" + id);
      if (!q || !card) return;
      const saved = state[id];
      card.classList.remove("card-correct", "card-wrong");
      if (saved) card.classList.add(saved.isCorrect ? "card-correct" : "card-wrong");
      card.innerHTML = buildCardHTML(q);
      if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([card]);
      }
    }

    function renderQuestions() {
      const container = document.getElementById("quiz-container");
      const filtered = getFilteredQuestions();
      const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
      if (currentPage > totalPages) currentPage = totalPages;

      const start = (currentPage - 1) * PAGE_SIZE;
      const pageItems = filtered.slice(start, start + PAGE_SIZE);

      const showTxt = filtered.length === 0
        ? "No matching questions found"
        : `Showing ${start + 1}–${start + pageItems.length} of ${filtered.length} questions`;
      document.getElementById("showing-info").textContent = showTxt;
      document.getElementById("showing-info-bottom").textContent = showTxt;

      const pageTxt = `Page ${currentPage} of ${totalPages}`;
      document.getElementById("page-indicator").textContent = pageTxt;
      document.getElementById("page-indicator-bottom").textContent = pageTxt;

      ["prev-page", "prev-page-bottom"].forEach(id => document.getElementById(id).disabled = currentPage <= 1);
      ["next-page", "next-page-bottom"].forEach(id => document.getElementById(id).disabled = currentPage >= totalPages);

      container.innerHTML = pageItems.map(q => {
        const saved = state[q.id];
        const extra = saved ? (saved.isCorrect ? " card-correct" : " card-wrong") : "";
        return `<div class="q-card${extra}" id="q-card-${q.id}">${buildCardHTML(q)}</div>`;
      }).join("");

      if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([container]);
      }
    }

    window.handleMCQ = function(id, chosen) {
      if (state[id]) return;
      const q = QUESTIONS.find(item => item.id === id);
      state[id] = { userAns: chosen, isCorrect: chosen === q.ans };
      updateStats();
      updateSingleCard(id);
    };

    window.handleGrid = function(id) {
      if (state[id]) return;
      const inputEl = document.getElementById("input-" + id);
      const val = inputEl ? inputEl.value.trim() : "";
      if (!val) return;
      const q = QUESTIONS.find(item => item.id === id);
      state[id] = { userAns: val, isCorrect: isGridMatch(val, q.ans) };
      updateStats();
      updateSingleCard(id);
    };

    document.getElementById("topic-tabs").addEventListener("click", (e) => {
      if (!e.target.classList.contains("tab-btn")) return;
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      e.target.classList.add("active");
      currentTopic = e.target.dataset.topic;
      currentPage = 1;
      renderQuestions();
    });

    document.getElementById("search-input").addEventListener("input", (e) => {
      searchQuery = e.target.value.trim().toLowerCase();
      currentPage = 1;
      renderQuestions();
    });

    function goPage(delta) {
      currentPage += delta;
      renderQuestions();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
    document.getElementById("prev-page").addEventListener("click", () => goPage(-1));
    document.getElementById("next-page").addEventListener("click", () => goPage(1));
    document.getElementById("prev-page-bottom").addEventListener("click", () => goPage(-1));
    document.getElementById("next-page-bottom").addEventListener("click", () => goPage(1));

    document.getElementById("reset-btn").addEventListener("click", () => {
      state = {};
      updateStats();
      renderQuestions();
    });

    document.getElementById("reveal-page-btn").addEventListener("click", () => {
      const filtered = getFilteredQuestions();
      const start = (currentPage - 1) * PAGE_SIZE;
      filtered.slice(start, start + PAGE_SIZE).forEach(q => {
        if (!state[q.id]) {
          state[q.id] = { userAns: q.ans, isCorrect: true };
        }
      });
      updateStats();
      renderQuestions();
    });

    document.getElementById("reveal-all-btn").addEventListener("click", () => {
      QUESTIONS.forEach(q => {
        if (!state[q.id]) {
          state[q.id] = { userAns: q.ans, isCorrect: true };
        }
      });
      updateStats();
      renderQuestions();
    });

    renderQuestions();
  </script>
</body>
