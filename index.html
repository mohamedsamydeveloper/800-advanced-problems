pic": "Mode", "type": "grid", "q": "A dataset of $7$ integers has a unique mode of $14$, a median of $12$, and a mean of $11$. If the smallest two numbers are $3$ and $5$ and the third is $11$, what is the largest integer in the set?", "ans": "18", "exp": "Sorted set is $3, 5, 11, 12, 14, 14, x$. Sum $= 7(11) = 77$. $3 + 5 + 11 + 12 + 14 + 14 = 59$, so $x = 18$."}, {"id": 395, "topic": "Statistics", "subtopic": "Mode", "type": "grid", "q": "If every number in a dataset with unique mode $m$ is multiplied by $3$ and then $5$ is added to each number, what is the new mode in terms of $m$? (Enter `3m+5`.)", "ans": "3m+5", "exp": "Linear transformations $ax + b$ apply equally to the mode, yielding $3m + 5$."}, {"id": 396, "topic": "Statistics", "subtopic": "Mode", "type": "grid", "q": "In a survey of $25$ students, the number of books read last month was recorded: $0$ books ($4$ students), $1$ book ($9$ students), $2$ books ($7$ students), $3$ books ($5$ students). What is the mode?", "ans": "1", "exp": "The value $1$ book occurs most frequently ($9$ students)."}, {"id": 397, "topic": "Statistics", "subtopic": "Mode", "type": "grid", "q": "For the dataset $\\{2, 5, 5, 8, 8, 8, 11, 11, 2, 5\\}$, how many distinct modes exist?", "ans": "2", "exp": "Both $5$ and $8$ appear $3$ times each, which is the highest frequency, so there are $2$ modes."}, {"id": 398, "topic": "Statistics", "subtopic": "Mode", "type": "grid", "q": "A list of $6$ numbers is $10, 14, 10, 18, x, 14$. For what value of $x$ does the list have a unique mode of $14$?", "ans": "14", "exp": "Currently $10$ appears twice and $14$ appears twice. Setting $x = 14$ gives $14$ three times and $10$ twice, making $14$ the unique mode."}, {"id": 399, "topic": "Statistics", "subtopic": "Mode", "type": "mcq", "q": "Which measure of central tendency is NOT affected by extreme outliers, yet unlike the mode can be calculated for any ordered numerical dataset without requiring repeated values?", "ans": "A", "exp": "The median depends only on middle position(s) in an ordered list and exists even when all values are distinct.", "options": ["Median", "Mean", "Mode", "Range"]}, {"id": 400, "topic": "Statistics", "subtopic": "Mode", "type": "grid", "q": "In the data set $\\{19, 23, 19, 25, 31, 19, 27\\}$, what is the positive difference between the mode and the median?", "ans": "4", "exp": "Sorted: $19, 19, 19, 23, 25, 27, 31$. Mode $= 19$, median $= 23$. Difference $= 23 - 19 = 4$."}, {"id": 401, "topic": "Statistics", "subtopic": "Mode", "type": "grid", "q": "A set of $8$ positive integers has a mode of $6$ occurring $3$ times, and the remaining $5$ integers are consecutive integers starting at $7$ ($7, 8, 9, 10, 11$). What is the sum of all $8$ integers?", "ans": "63", "exp": "Three $6$s give $18$, plus $7 + 8 + 9 + 10 + 11 = 45$, giving a total sum of $63$."}, {"id": 402, "topic": "Statistics", "subtopic": "Mode", "type": "grid", "q": "If a dataset has no repeated values (every element occurs once), how many modes does it have?", "ans": "0", "exp": "When no value repeats, there is no mode ($0$ modes)."}, {"id": 403, "topic": "Statistics", "subtopic": "Mode", "type": "grid", "q": "In a frequency table of test scores: $60$ (freq $2$), $70$ (freq $5$), $80$ (freq $8$), $90$ (freq $5$), $100$ (freq $2$), what is the mode?", "ans": "80", "exp": "Score $80$ has the highest frequency ($8$)."}, {"id": 404, "topic": "Statistics", "subtopic": "Mode", "type": "grid", "q": "A set of numbers has unique mode $12$. If you add a new number equal to $12$ to the set, what is the new mode?", "ans": "12", "exp": "Adding another copy of the mode keeps $12$ as the mode."}, {"id": 405, "topic": "Statistics", "subtopic": "Range", "type": "grid", "q": "A dataset of integers has a range of $24$. If the smallest value is $-9$, what is the greatest value?", "ans": "15", "exp": "Range $=$ Max $-$ Min $\\implies 24 = \\text{Max} - (-9) \\implies \\text{Max} = 15$."}, {"id": 406, "topic": "Statistics", "subtopic": "Range", "type": "grid", "q": "If every value in a dataset with range $R = 18$ is multiplied by $2$ and then $7$ is added, what is the new range?", "ans": "36", "exp": "Adding a constant does not change range; multiplying by $2$ doubles the range: $2 \\times 18 = 36$."}, {"id": 407, "topic": "Statistics", "subtopic": "Range", "type": "grid", "q": "The set $\\{k, 12, 19, 27, 8\\}$ has a range of $22$, where $k > 27$. What is the value of $k$?", "ans": "30", "exp": "Minimum is $8$, so maximum $k$ satisfies $k - 8 = 22 \\implies k = 30$."}, {"id": 408, "topic": "Statistics", "subtopic": "Range", "type": "grid", "q": "Two sets of numbers have ranges $14$ and $26$. When combined into a single dataset, what is the MINIMUM possible range of the combined dataset?", "ans": "26", "exp": "The combined dataset contains all elements of both sets, so its range is at least $\\max(14, 26) = 26$."}, {"id": 409, "topic": "Statistics", "subtopic": "Range", "type": "grid", "q": "A dataset has minimum $-12$ and maximum $19$. If both the minimum and maximum are increased by $8$, what is the new range?", "ans": "31", "exp": "Original range $= 19 - (-12) = 31$; shifting both endpoints equally leaves the range equal to $31$."}, {"id": 410, "topic": "Statistics", "subtopic": "Range", "type": "grid", "q": "In the dataset $\\{3.5, 8.2, 11.9, 4.1, 15.0, 6.8\\}$, what is the range?", "ans": "11.5", "exp": "Max $= 15.0$, Min $= 3.5$. Range $= 15.0 - 3.5 = 11.5$."}, {"id": 411, "topic": "Statistics", "subtopic": "Range", "type": "grid", "q": "A set of $5$ distinct positive integers has a median of $10$ and a range of $12$. What is the greatest possible mean of this set?", "ans": "12.4", "exp": "Using $7, 8, 10, 18, 19$ (range $= 19 - 7 = 12$, median $= 10$): sum $= 62$, mean $= \\frac{62}{5} = 12.4$."}, {"id": 412, "topic": "Statistics", "subtopic": "Range", "type": "mcq", "q": "If a new data point is added to a dataset and the range increases by $6$, what must be true about the new data point?", "ans": "A", "exp": "The range only increases when a new point sets a new minimum or new maximum, expanding the span by the distance beyond the previous extreme.", "options": ["It lies $6$ units outside the original minimum or maximum", "It equals the previous mean", "It lies between the minimum and maximum", "The dataset must have even size"]}, {"id": 413, "topic": "Statistics", "subtopic": "Range", "type": "grid", "q": "A dataset has minimum $12$ and maximum $40$. If a value of $55$ is added, what is the new range?", "ans": "43", "exp": "New max is $55$, min is still $12$. Range $= 55 - 12 = 43$."}, {"id": 414, "topic": "Statistics", "subtopic": "Range", "type": "grid", "q": "For the dataset $\\{-15, -4, 0, 9, 18\\}$, what is the range?", "ans": "33", "exp": "$18 - (-15) = 33$."}, {"id": 415, "topic": "Statistics", "subtopic": "Range", "type": "grid", "q": "A dataset has range $20$. If every number is decreased by $12$, what is the new range?", "ans": "20", "exp": "Shifting all values by a constant leaves the range unchanged at $20$."}, {"id": 416, "topic": "Statistics", "subtopic": "Range", "type": "grid", "q": "The range of $\\{2x, 5x, 9x, 14x\\}$ is $48$, where $x > 0$. What is the value of $x$?", "ans": "4", "exp": "Range $= 14x - 2x = 12x = 48 \\implies x = 4$."}, {"id": 417, "topic": "Statistics", "subtopic": "Median", "type": "grid", "q": "What is the median of the ordered list $\\{11, 14, 17, 22, 29, 35\\}$?", "ans": "19.5", "exp": "With $6$ numbers, the median is the average of the $3\text{rd}$ and $4\text{th}$ values: $\\frac{17 + 22}{2} = 19.5$."}, {"id": 418, "topic": "Statistics", "subtopic": "Median", "type": "grid", "q": "A set of $9$ distinct positive integers has a median of $15$. If the largest $4$ integers are all increased by $50$, what is the new median?", "ans": "15", "exp": "The $5\text{th}$ element (the median) is unaffected when only elements above the median increase."}, {"id": 419, "topic": "Statistics", "subtopic": "Median", "type": "grid", "q": "In the dataset $\\{24, 8, 15, 31, 12, 19, 27\\}$, what is the median?", "ans": "19", "exp": "Sorted: $8, 12, 15, 19, 24, 27, 31$. The $4\text{th}$ value is $19$."}, {"id": 420, "topic": "Statistics", "subtopic": "Median", "type": "grid", "q": "If a dataset has a median of $36$, and every value is doubled and then $4$ is subtracted, what is the new median?", "ans": "68", "exp": "New median $= 2(36) - 4 = 72 - 4 = 68$."}, {"id": 421, "topic": "Statistics", "subtopic": "Median", "type": "grid", "q": "Seven numbers have a median of $18$. If a new number $25$ is added to the list (making $8$ numbers total), what is the LEAST possible value of the new median?", "ans": "18", "exp": "In the sorted $7$-element list, $a_4 = 18$. Adding $25$ places it at or after index $5$, so the new average of the $4\text{th}$ and $5\text{th}$ elements is at least $\\frac{18 + 18}{2} = 18$."}, {"id": 422, "topic": "Statistics", "subtopic": "Median", "type": "grid", "q": "The median of $\\{4, 9, x, 17, 22, 28\\}$ is $15$, where $9 \\le x \\le 17$. What is the value of $x$?", "ans": "13", "exp": "The middle two values in sorted order are $x$ and $17$, so $\\frac{x + 17}{2} = 15 \\implies x + 17 = 30 \\implies x = 13$."}, {"id": 423, "topic": "Statistics", "subtopic": "Median", "type": "grid", "q": "A dataset of $11$ numbers is sorted from least to greatest. Which position is the median?", "ans": "6", "exp": "For $n = 11$ (odd), the median is the $\\frac{11 + 1}{2} = 6\text{th}$ term."}, {"id": 424, "topic": "Statistics", "subtopic": "Median", "type": "mcq", "q": "In a skewed-right income distribution, which relationship between mean and median is typically observed?", "ans": "A", "exp": "Right-skewness pulls the mean upward toward high outliers while the median remains resistant.", "options": ["Mean is greater than the median", "Mean is less than the median", "Mean equals the median", "Median is always zero"]}, {"id": 425, "topic": "Statistics", "subtopic": "Median", "type": "grid", "q": "The numbers $3, 7, 12, 18, 25, 31$ have median $15$. If $31$ is replaced by $100$, what is the new median?", "ans": "15", "exp": "Replacing the largest number with an even larger number keeps the middle two numbers ($12$ and $18$) unchanged, so the median stays $15$."}, {"id": 426, "topic": "Statistics", "subtopic": "Median", "type": "grid", "q": "What is the median of $\\{-12, -5, 0, 4, 11, 16, 20\\}$?", "ans": "4", "exp": "With $7$ sorted values, the $4\text{th}$ value is $4$."}, {"id": 427, "topic": "Statistics", "subtopic": "Median", "type": "grid", "q": "Five consecutive odd integers have a median of $21$. What is the sum of the first and last integers?", "ans": "42", "exp": "The five integers are $17, 19, 21, 23, 25$. First $+$ last $= 17 + 25 = 42$."}, {"id": 428, "topic": "Statistics", "subtopic": "Median", "type": "grid", "q": "If the median of $10$ numbers is $44.5$, what is the sum of the $5\text{th}$ and $6\text{th}$ numbers when ordered from least to greatest?", "ans": "89", "exp": "The median of $10$ numbers is $\\frac{a_5 + a_6}{2} = 44.5 \\implies a_5 + a_6 = 89$."}, {"id": 429, "topic": "Statistics", "subtopic": "Comparing Standard Deviation", "type": "mcq", "q": "Set A is $\\{50, 50, 50, 50, 50\\}$ and Set B is $\\{48, 49, 50, 51, 52\\}$. Which statement is true?", "ans": "A", "exp": "Set A has zero spread ($SD = 0$), whereas Set B's values deviate from $50$.", "options": ["Set A has a smaller standard deviation than Set B", "Set B has a smaller standard deviation than Set A", "Both sets have equal standard deviation", "Set A has a larger standard deviation than Set B"]}, {"id": 430, "topic": "Statistics", "subtopic": "Comparing Standard Deviation", "type": "mcq", "q": "If every value in Dataset X is increased by $25$, how does the standard deviation of Dataset X change?", "ans": "A", "exp": "Adding a constant shifts the mean by $25$ without changing distances from the mean, so standard deviation is unchanged.", "options": ["It stays the same", "It increases by $25$", "It increases by $\\sqrt{25}$", "It doubles"]}, {"id": 431, "topic": "Statistics", "subtopic": "Comparing Standard Deviation", "type": "mcq", "q": "If every value in Dataset Y is multiplied by $4$, how does the standard deviation of Dataset Y change?", "ans": "A", "exp": "Scaling every observation by a positive factor $k$ scales the standard deviation by $k$.", "options": ["It is multiplied by $4$", "It is multiplied by $16$", "It is multiplied by $2$", "It stays the same"]}, {"id": 432, "topic": "Statistics", "subtopic": "Comparing Standard Deviation", "type": "mcq", "q": "Dataset 1 has $20$ values centered around $100$ with narrow spread. Dataset 2 has the same $20$ values plus two extreme outliers ($10$ and $190$). Which has the greater standard deviation?", "ans": "A", "exp": "Extreme values far from the mean substantially increase squared deviations and thus standard deviation.", "options": ["Dataset 2", "Dataset 1", "They are equal", "Cannot be determined"]}, {"id": 433, "topic": "Statistics", "subtopic": "Comparing Standard Deviation", "type": "mcq", "q": "Set P is $\\{10, 20, 30, 40\\}$ and Set Q is $\\{100, 110, 120, 130\\}$. How do their standard deviations compare?", "ans": "A", "exp": "Set Q is simply Set P shifted upward by $90$; shifts do not affect spread.", "options": ["Set P and Set Q have equal standard deviations", "Set Q has a much larger standard deviation", "Set P has a larger standard deviation", "Set Q has standard deviation $0$"]}, {"id": 434, "topic": "Statistics", "subtopic": "Comparing Standard Deviation", "type": "mcq", "q": "Set M is $\\{10, 20, 30, 40\\}$ and Set N is $\\{20, 40, 60, 80\\}$. How do their standard deviations compare?", "ans": "A", "exp": "Every element of Set N is $2$ times the corresponding element of Set M, so SD doubles.", "options": ["The standard deviation of Set N is twice that of Set M", "They have equal standard deviations", "The standard deviation of Set N is four times that of Set M", "Set M has a greater standard deviation"]}, {"id": 435, "topic": "Statistics", "subtopic": "Comparing Standard Deviation", "type": "grid", "q": "A dataset has standard deviation $\\sigma = 6$. If every data point is multiplied by $3$, what is the new standard deviation?", "ans": "18", "exp": "Standard deviation scales by $3$: $3 \\times 6 = 18$."}, {"id": 436, "topic": "Statistics", "subtopic": "Comparing Standard Deviation", "type": "mcq", "q": "Which of the following datasets has the GREATEST standard deviation?", "ans": "A", "exp": "Values spread widely from $1$ to $99$ have much larger deviations from the mean than tightly clustered values.", "options": ["$\\{1, 10, 50, 90, 99\\}$", "$\\{48, 49, 50, 51, 52\\}$", "$\\{25, 25, 25, 25, 25\\}$", "$\\{10, 11, 12, 13, 14\\}$"]}, {"id": 437, "topic": "Statistics", "subtopic": "Comparing Standard Deviation", "type": "mcq", "q": "Two classes take the same exam with the same mean of $75$. Class A scores are mostly between $72$ and $78$, while Class B scores range from $45$ to $98$. Which class has the smaller standard deviation?", "ans": "A", "exp": "Class A's scores are tightly clustered around the mean, giving a smaller standard deviation.", "options": ["Class A", "Class B", "Both have the same standard deviation", "Not enough information"]}, {"id": 438, "topic": "Statistics", "subtopic": "Comparing Standard Deviation", "type": "grid", "q": "If a dataset consists of identical numbers $\\{c, c, c, c, c, c\\}$, what is its standard deviation?", "ans": "0", "exp": "Every value equals the mean $c$, so every deviation is $0$ and standard deviation is $0$."}, {"id": 439, "topic": "Statistics", "subtopic": "Comparing Standard Deviation", "type": "mcq", "q": "Set A is $\\{2, 4, 6, 8, 10\\}$ and Set B is $\\{2, 2, 6, 10, 10\\}$. Both have mean $6$. Which set has the greater standard deviation?", "ans": "A", "exp": "Set B places more weight at the extremes ($2$ and $10$) rather than near the mean ($6$), giving a larger standard deviation.", "options": ["Set B", "Set A", "Both have equal standard deviation", "Neither has a defined standard deviation"]}, {"id": 440, "topic": "Statistics", "subtopic": "Comparing Standard Deviation", "type": "grid", "q": "If a dataset has standard deviation $0$, what is its range?", "ans": "0", "exp": "Standard deviation is $0$ if and only if all values are identical, making max minus min equal to $0$."}, {"id": 441, "topic": "Statistics", "subtopic": "Scatterplots", "type": "grid", "q": "A least-squares regression line for monthly ice cream sales $y$ (in hundreds of dollars) versus average monthly temperature $x$ (in $\\text{^\\circ C}$) is $\\hat{y} = 1.85x - 12.4$. By how many dollars does predicted monthly sales increase for each $1^\\circ\\text{C}$ increase in temperature?", "ans": "185", "exp": "Slope is $1.85$ hundred dollars $= \\$185$ per $1^\\circ\\text{C}$ increase."}, {"id": 442, "topic": "Statistics", "subtopic": "Scatterplots", "type": "grid", "q": "In a scatterplot of fuel efficiency $y$ (mpg) against vehicle weight $x$ (thousands of lbs), the line of best fit is $\\hat{y} = 44.5 - 5.2x$. What is the predicted fuel efficiency for a car weighing $3.5$ thousand pounds?", "ans": "26.3", "exp": "$\\hat{y} = 44.5 - 5.2(3.5) = 44.5 - 18.2 = 26.3$ mpg."}, {"id": 443, "topic": "Statistics", "subtopic": "Scatterplots", "type": "mcq", "q": "A scatterplot shows a strong negative linear association between price $x$ and quantity demanded $y$. Which value of the correlation coefficient $r$ is most consistent with this graph?", "ans": "A", "exp": "A strong negative linear trend corresponds to a correlation coefficient close to $-1$, such as $-0.91$.", "options": ["-0.91", "-0.12", "0.05", "0.88"]}, {"id": 444, "topic": "Statistics", "subtopic": "Scatterplots", "type": "grid", "q": "A line of best fit passes through the points $(4, 68)$ and $(12, 92)$. What is the slope of this line of best fit?", "ans": "3", "exp": "Slope $= \\frac{92 - 68}{12 - 4} = \\frac{24}{8} = 3$."}, {"id": 445, "topic": "Statistics", "subtopic": "Scatterplots", "type": "grid", "q": "For a scatterplot with regression equation $\\hat{y} = 3.4x + 15$, an observed point has $x = 10$ and actual $y = 46$. What is the residual ($y - \\hat{y}$)?", "ans": "-3", "exp": "Predicted $\\hat{y} = 3.4(10) + 15 = 49$. Residual $= 46 - 49 = -3$."}, {"id": 446, "topic": "Statistics", "subtopic": "Scatterplots", "type": "mcq", "q": "If a data point on a scatterplot has a residual of $0$, what does that mean geometrically?", "ans": "A", "exp": "A residual of $0$ means actual $y = \\hat{y}$, so the point lies directly on the line of best fit.", "options": ["The point lies directly on the line of best fit", "The slope of the regression line is $0$", "The correlation coefficient is $0$", "The $x$-coordinate equals $0$"]}, {"id": 447, "topic": "Statistics", "subtopic": "Scatterplots", "type": "grid", "q": "A quadratic model $\\hat{y} = -0.4(x - 15)^2 + 120$ fits a scatterplot of crop yield $y$ versus fertilizer rate $x$. At what fertilizer rate $x$ does the model predict maximum yield?", "ans": "15", "exp": "Since the leading coefficient $-0.4 < 0$, the parabola opens downward and attains its maximum at the vertex $x = 15$."}, {"id": 448, "topic": "Statistics", "subtopic": "Scatterplots", "type": "grid", "q": "An exponential model $\\hat{y} = 250(1.08)^t$ models active subscribers $y$ after $t$ months. By what percentage does predicted subscribers grow each month?", "ans": "8", "exp": "The growth factor is $1.08 = 1 + 0.08$, corresponding to an $8\\%$ monthly increase."}, {"id": 449, "topic": "Statistics", "subtopic": "Scatterplots", "type": "mcq", "q": "Why is extrapolating a linear regression line far beyond the observed $x$-values risky in real-world data?", "ans": "A", "exp": "Relationships observed over a limited range may become nonlinear or hit physical/practical bounds outside that range.", "options": ["The true relationship may change or become nonlinear outside the observed range", "The slope always becomes undefined outside the range", "Residuals are always negative outside the range", "Correlation becomes equal to $1$"]}, {"id": 450, "topic": "Statistics", "subtopic": "Scatterplots", "type": "grid", "q": "A line of best fit is given by $\\hat{y} = -2.5x + 80$. For what value of $x$ is the predicted value $\\hat{y}$ equal to $30$?", "ans": "20", "exp": "$-2.5x + 80 = 30 \\implies 2.5x = 50 \\implies x = 20$."}, {"id": 451, "topic": "Statistics", "subtopic": "Scatterplots", "type": "mcq", "q": "If every $y$-value in a dataset is converted from dollars to cents (multiplied by $100$), how does the correlation coefficient $r$ between $x$ and $y$ change?", "ans": "A", "exp": "Correlation $r$ is scale-invariant under positive linear rescaling of variables.", "options": ["It remains unchanged", "It is multiplied by $100$", "It is divided by $100$", "It becomes negative"]}, {"id": 452, "topic": "Statistics", "subtopic": "Scatterplots", "type": "mcq", "q": "A least-squares regression line always passes through which special point of the bivariate dataset $(\\bar{x}, \\bar{y})$?", "ans": "A", "exp": "The least-squares line for a sample always passes through the centroid $(\\bar{x}, \\bar{y})$.", "options": ["The point $(\\bar{x}, \\bar{y})$ where $\\bar{x}$ and $\\bar{y}$ are the sample means", "The origin $(0, 0)$", "The minimum $(x_{\\min}, y_{\\min})$", "The median $(x_{\\text{med}}, y_{\\text{med}})$"]}, {"id": 453, "topic": "Statistics", "subtopic": "Scatterplots", "type": "mcq", "q": "A scatterplot of study time vs. test score shows almost no linear pattern, with points scattered evenly across a horizontal band. Which $r$ value best fits?", "ans": "A", "exp": "Points with no linear trend have a correlation coefficient near $0$.", "options": ["0.03", "-0.89", "0.94", "-0.78"]}, {"id": 454, "topic": "Statistics", "subtopic": "Scatterplots", "type": "grid", "q": "A linear model predicts $\\hat{y} = 12.5 + 2.2x$. If $x$ increases by $5$ units, by how much does $\\hat{y}$ increase?", "ans": "11", "exp": "$\\Delta \\hat{y} = 2.2 \\times 5 = 11$."}, {"id": 455, "topic": "Statistics", "subtopic": "Scatterplots", "type": "grid", "q": "A point $(8, 35)$ has a residual of $+4.5$ with respect to a line of best fit. What is the predicted value $\\hat{y}$ at $x = 8$?", "ans": "30.5", "exp": "Residual $= y - \\hat{y} \\implies 4.5 = 35 - \\hat{y} \\implies \\hat{y} = 30.5$."}, {"id": 456, "topic": "Statistics", "subtopic": "Data Inferences", "type": "grid", "q": "A random sample of $250$ residents in a town of $12,000$ residents shows $185$ support a recycling program. What is the estimated number of supporters in the entire town?", "ans": "8880", "exp": "Sample proportion $= \\frac{185}{250} = 0.74$. Estimated supporters $= 0.74 \\times 12000 = 8880$."}, {"id": 457, "topic": "Statistics", "subtopic": "Data Inferences", "type": "mcq", "q": "Two random samples of size $100$ are drawn from the same population. Sample A has mean $62$ and Sample B has mean $66$. Why can two samples from the same population have different means?", "ans": "A", "exp": "Random sampling naturally produces sample-to-sample variation (sampling variability).", "options": ["Due to random sampling variability", "Because one sample is not a subset of the population", "Because the population has no true mean", "Because sample size $100$ is too large"]}, {"id": 458, "topic": "Statistics", "subtopic": "Data Inferences", "type": "mcq", "q": "A researcher wants to determine whether a new fertilizer increases tomato yield. She randomly assigns $40$ plots to the new fertilizer and $40$ plots to standard fertilizer, keeping soil, sunlight, and watering identical. What can be concluded if yield is higher on the new fertilizer plots?", "ans": "A", "exp": "Random assignment into controlled treatment/control groups supports a causal conclusion for the experimental conditions.", "options": ["A causal effect of the fertilizer on yield is supported for these plots", "The results apply automatically to every farm worldwide without variation", "Watering had no effect on yield", "Correlation cannot be computed"]}, {"id": 459, "topic": "Statistics", "subtopic": "Data Inferences", "type": "mcq", "q": "A poll reports $48\\%$ support for Candidate A with a margin of error of $\\pm 3.5$ percentage points. Which claim is NOT justified by this interval?", "ans": "A", "exp": "Since the plausible range is $[44.5\\%, 51.5\\%]$, Candidate A is not guaranteed to win a majority ($>50\\%$).", "options": ["Candidate A is guaranteed to receive more than $50\\%$ of the total vote", "Support in the population is likely between $44.5\\%$ and $51.5\\%$", "The estimate carries sampling uncertainty", "The true proportion could be below $50\\%$"]}, {"id": 460, "topic": "Statistics", "subtopic": "Data Inferences", "type": "grid", "q": "In a quality check of $80$ randomly selected bolts from a box of $2,400$, $2$ bolts are defective. How many defective bolts are estimated in the entire box?", "ans": "60", "exp": "Proportion $= \\frac{2}{80} = 0.025$. Estimated total $= 0.025 \\times 2400 = 60$."}, {"id": 461, "topic": "Statistics", "subtopic": "Data Inferences", "type": "mcq", "q": "A survey is conducted by mailing optional questionnaires to subscribers of a magazine, and only $6\\%$ are returned. What is the main limitation of these results?", "ans": "A", "exp": "Low response rates and voluntary participation can create nonresponse and self-selection bias.", "options": ["Nonresponse and voluntary response bias may skew the results", "The sample size is too large to analyze", "Percentages cannot be calculated from surveys", "Returned surveys are always random"]}, {"id": 462, "topic": "Statistics", "subtopic": "Data Inferences", "type": "grid", "q": "A random sample of $300$ students at a university has a mean GPA of $3.28$ with a margin of error of $\\pm 0.06$. What is the upper bound of this confidence interval?", "ans": "3.34", "exp": "$3.28 + 0.06 = 3.34$."}, {"id": 463, "topic": "Statistics", "subtopic": "Data Inferences", "type": "mcq", "q": "If a researcher doubles the sample size from $250$ to $1,000$ (quadrupling it) using simple random sampling from a large population, by what factor does the standard error roughly change?", "ans": "A", "exp": "Standard error is inversely proportional to $\\sqrt{n}$; quadrupling $n$ divides the standard error by $\\sqrt{4} = 2$ (halves it).", "options": ["It is cut in half (divided by $2$)", "It is divided by $4$", "It is multiplied by $2$", "It remains unchanged"]}, {"id": 464, "topic": "Statistics", "subtopic": "Data Inferences", "type": "mcq", "q": "A study finds that households with more smoke detectors have fewer fire deaths per household. Why would it be wrong to conclude that buying more smoke detectors alone prevents fires from starting?", "ans": "A", "exp": "Smoke detectors alert occupants rather than preventing ignition, and confounding factors (such as home safety habits) may be involved.", "options": ["Association does not establish that adding detectors prevents fire ignition, and confounding factors may exist", "Correlation of $1.0$ is required for safety", "Smoke detectors increase fire risk", "Observational data has no valid statistics"]}, {"id": 465, "topic": "Statistics", "subtopic": "Data Inferences", "type": "grid", "q": "A random sample of $120$ lightbulbs from a shipment of $4,500$ shows $3$ burn out early. What is the estimated number of bulbs in the shipment that will burn out early?", "ans": "112.5", "exp": "$\\frac{3}{120} = 0.025$; $0.025 \\times 4500 = 112.5$."}, {"id": 466, "topic": "Statistics", "subtopic": "Data Inferences", "type": "mcq", "q": "A city surveys $500$ randomly chosen households out of $40,000$. To generalize findings to all $40,000$ households, what is essential about how the $500$ households are chosen?", "ans": "A", "exp": "Random selection from the target population gives each household a known chance of selection and reduces bias.", "options": ["They must be selected randomly from the target population of households", "They must all live in the same zip code", "They must have the highest income in the city", "They must volunteer via a website"]}, {"id": 467, "topic": "Statistics", "subtopic": "Data Inferences", "type": "grid", "q": "A random sample of $64$ batteries has a sample mean life of $120$ hours and sample standard deviation of $16$ hours. What is the estimated standard error of the sample mean ($s / \\sqrt{n}$)?", "ans": "2", "exp": "$\\frac{16}{\\sqrt{64}} = \\frac{16}{8} = 2$ hours."}, {"id": 468, "topic": "Statistics", "subtopic": "Data Inferences", "type": "mcq", "q": "When a survey question is worded in a leading way ('Do you agree that wasteful spending should be stopped immediately?'), what error is introduced?", "ans": "A", "exp": "Leading wording biases respondents toward a particular answer (response/wording bias).", "options": ["Response/measurement bias due to leading question wording", "Rounding error", "Computation error", "Elimination of sampling error"]}, {"id": 469, "topic": "Statistics", "subtopic": "Data Inferences", "type": "grid", "q": "In a random sample of $200$ voters, $116$ support a candidate. What is the point estimate of the proportion of voters supporting the candidate?", "ans": "0.58", "exp": "$\\frac{116}{200} = 0.58$."}, {"id": 470, "topic": "Statistics", "subtopic": "Data Inferences", "type": "mcq", "q": "A study compares two teaching methods on $50$ students who volunteered for Method A and $50$ students who chose Method B on their own. Why is causal inference limited?", "ans": "A", "exp": "Lack of random assignment means self-selection/confounding variables may explain score differences.", "options": ["Because students were not randomly assigned, confounding traits may differ between groups", "Because $50$ is an even number", "Because test scores cannot be averaged", "Because Method B is always a control"]}, {"id": 471, "topic": "Statistics", "subtopic": "Center, Spread, and Shape of Distributions", "type": "mcq", "q": "A histogram of employee salaries has a long tail extending to the right because a few executives earn very high salaries. How is this distribution described?", "ans": "A", "exp": "A tail extending to the right (toward larger values) indicates a distribution skewed to the right.", "options": ["Skewed to the right", "Skewed to the left", "Symmetric and bell-shaped", "Uniform"]}, {"id": 472, "topic": "Statistics", "subtopic": "Center, Spread, and Shape of Distributions", "type": "mcq", "q": "If a dataset is symmetric and unimodal with no outliers, which relationship holds approximately between the mean and median?", "ans": "A", "exp": "In a symmetric unimodal distribution without outliers, the mean and median are approximately equal.", "options": ["The mean is approximately equal to the median", "The mean is much larger than the median", "The median is zero", "The range equals the mean"]}, {"id": 473, "topic": "Statistics", "subtopic": "Center, Spread, and Shape of Distributions", "type": "mcq", "q": "Dataset A has values tightly grouped between $48$ and $52$; Dataset B has values spread from $10$ to $90$. Which has greater spread?", "ans": "A", "exp": "Dataset B spans $80$ units compared to $4$ units for Dataset A, so it has greater spread.", "options": ["Dataset B", "Dataset A", "Both have identical spread", "Neither has spread"]}, {"id": 474, "topic": "Statistics", "subtopic": "Center, Spread, and Shape of Distributions", "type": "mcq", "q": "A distribution has a mode around $85$, a median of $82$, and a mean of $76$. What shape is most consistent with mean < median?", "ans": "A", "exp": "When the mean is pulled below the median by lower values, the distribution is typically skewed to the left.", "options": ["Skewed to the left", "Skewed to the right", "Strictly uniform", "Bimodal symmetric"]}, {"id": 475, "topic": "Statistics", "subtopic": "Center, Spread, and Shape of Distributions", "type": "grid", "q": "In a box plot, the length of the box from $Q_1$ to $Q_3$ equals $18$. What is the interquartile range (IQR)?", "ans": "18", "exp": "By definition, $\\text{IQR} = Q_3 - Q_1 = 18$."}, {"id": 476, "topic": "Statistics", "subtopic": "Center, Spread, and Shape of Distributions", "type": "mcq", "q": "If a dataset has an outlier added that is much larger than all other values, which measure is affected more: the mean or the median?", "ans": "A", "exp": "The mean incorporates numerical magnitudes and shifts noticeably toward extreme values, whereas the median is resistant.", "options": ["The mean is affected more than the median", "The median is affected more than the mean", "Both change by the exact same amount", "Neither changes"]}, {"id": 477, "topic": "Statistics", "subtopic": "Center, Spread, and Shape of Distributions", "type": "mcq", "q": "A uniform distribution over $[0, 10]$ has values spread evenly across the interval. How would you describe its shape?", "ans": "A", "exp": "A uniform distribution is roughly flat/even across its support rather than having a single central peak.", "options": ["Roughly flat (uniform) across the interval", "Strongly right-skewed", "Bimodal with two sharp spikes", "Exponentially decaying"]}, {"id": 478, "topic": "Statistics", "subtopic": "Center, Spread, and Shape of Distributions", "type": "grid", "q": "Suppose a dataset has $Q_1 = 22$ and $Q_3 = 40$. Using the standard $1.5 \\times \\text{IQR}$ rule, what is the upper outlier fence?", "ans": "67", "exp": "$\\text{IQR} = 40 - 22 = 18$. Upper fence $= Q_3 + 1.5(18) = 40 + 27 = 67$."}, {"id": 479, "topic": "Statistics", "subtopic": "Center, Spread, and Shape of Distributions", "type": "grid", "q": "Suppose a dataset has $Q_1 = 22$ and $Q_3 = 40$. Any value below what lower fence is considered a low outlier under the $1.5 \\times \\text{IQR}$ rule?", "ans": "-5", "exp": "$\\text{IQR} = 18$. Lower fence $= Q_1 - 1.5(18) = 22 - 27 = -5$."}, {"id": 480, "topic": "Statistics", "subtopic": "Center, Spread, and Shape of Distributions", "type": "mcq", "q": "Two histograms have identical means of $50$, but Distribution 1 has a taller, narrower peak near $50$ while Distribution 2 is wide and flat. Which has a smaller standard deviation?", "ans": "A", "exp": "Values more concentrated near the mean have smaller deviations and therefore a smaller standard deviation.", "options": ["Distribution 1", "Distribution 2", "Both have equal standard deviation", "Standard deviation cannot be compared from histograms"]}, {"id": 481, "topic": "Statistics", "subtopic": "Center, Spread, and Shape of Distributions", "type": "mcq", "q": "A bimodal distribution typically has:", "ans": "A", "exp": "Bimodal distributions exhibit two distinct peaks (local maxima) in frequency.", "options": ["Two distinct peaks in frequency", "Zero variance", "Only two data points", "A negative median"]}, {"id": 482, "topic": "Statistics", "subtopic": "Center, Spread, and Shape of Distributions", "type": "mcq", "q": "If every value in a dataset is multiplied by $-1$ (reflected around $0$), how does the skewness shape change?", "ans": "A", "exp": "Reflecting a distribution around $0$ reverses left and right skew (right-skewed becomes left-skewed).", "options": ["A right-skewed distribution becomes left-skewed (skew direction reverses)", "Skewness becomes zero", "It becomes bimodal", "Spread becomes negative"]}, {"id": 483, "topic": "Statistics", "subtopic": "Center, Spread, and Shape of Distributions", "type": "grid", "q": "In a symmetric distribution with $100$ data points, what percentage of data lies below the median?", "ans": "50", "exp": "By definition of the median, approximately $50\\%$ of observations lie at or below the median."}, {"id": 484, "topic": "Statistics", "subtopic": "Center, Spread, and Shape of Distributions", "type": "mcq", "q": "Which pair of statistics best summarizes a heavily skewed distribution with outliers?", "ans": "A", "exp": "Median and IQR are resistant to skew and outliers, making them preferred over mean and SD for skewed data.", "options": ["Median and interquartile range (IQR)", "Mean and standard deviation", "Mode and range", "Mean and range"]}, {"id": 485, "topic": "Statistics", "subtopic": "Center, Spread, and Shape of Distributions", "type": "grid", "q": "A dataset has minimum $14$, $Q_1 = 20$, median $= 26$, $Q_3 = 35$, and maximum $48$. What is the range?", "ans": "34", "exp": "Range $= \\text{Max} - \\text{Min} = 48 - 14 = 34$."}, {"id": 486, "topic": "Statistics", "subtopic": "Probability and Two-Way Tables", "type": "grid", "q": "In a two-way table of $150$ students: $60$ play sports and $90$ do not. Among sports players, $24$ play a musical instrument; among non-sports students, $36$ play a musical instrument. If a student is chosen at random, what is the probability they play a musical instrument? (Enter `0.4`.)", "ans": "0.4", "exp": "Total instrument players $= 24 + 36 = 60$. Probability $= \\frac{60}{150} = 0.4$."}, {"id": 487, "topic": "Statistics", "subtopic": "Probability and Two-Way Tables", "type": "grid", "q": "Using the same table ($150$ students: $60$ sports players with $24$ instrument players; $90$ non-sports with $36$ instrument players), given that a student plays sports, what is the probability they ALSO play a musical instrument? (Enter `0.4`.)", "ans": "0.4", "exp": "Conditional probability $= \\frac{24}{60} = 0.4$."}, {"id": 488, "topic": "Statistics", "subtopic": "Probability and Two-Way Tables", "type": "grid", "q": "Using the same table ($150$ students: $60$ sports players with $24$ instrument players; $90$ non-sports with $36$ instrument players), given that a student plays a musical instrument, what is the probability they play sports? (Enter `0.4`.)", "ans": "0.4", "exp": "Total instrument players $= 60$; of those, $24$ play sports. Probability $= \\frac{24}{60} = 0.4$."}, {"id": 489, "topic": "Statistics", "subtopic": "Probability and Two-Way Tables", "type": "grid", "q": "A bag has $5$ red, $7$ blue, and $8$ green marbles. Two marbles are drawn WITHOUT replacement. What is the probability both are red? (Enter `1/19`.)", "ans": "1/19", "exp": "$P(\\text{both red}) = \\frac{5}{20} \\times \\frac{4}{19} = \\frac{1}{4} \\times \\frac{4}{19} = \\frac{1}{19}$."}, {"id": 490, "topic": "Statistics", "subtopic": "Probability and Two-Way Tables", "type": "grid", "q": "A bag has $5$ red, $7$ blue, and $8$ green marbles. Two marbles are drawn WITH replacement. What is the probability both are red? (Enter `1/16`.)", "ans": "1/16", "exp": "$P(\\text{both red}) = \\frac{5}{20} \\times \\frac{5}{20} = \\frac{1}{4} \\times \\frac{1}{4} = \\frac{1}{16}$."}, {"id": 491, "topic": "Statistics", "subtopic": "Probability and Two-Way Tables", "type": "grid", "q": "In a class of $40$ students, $22$ study Spanish, $16$ study French, and $7$ study both. How many students study NEITHER Spanish nor French?", "ans": "9", "exp": "Using inclusion-exclusion: $22 + 16 - 7 = 31$ study at least one. Neither $= 40 - 31 = 9$."}, {"id": 492, "topic": "Statistics", "subtopic": "Probability and Two-Way Tables", "type": "grid", "q": "Using the class of $40$ students ($22$ Spanish, $16$ French, $7$ both), if a student is selected at random, what is the probability they study Spanish OR French? (Enter `31/40`.)", "ans": "31/40", "exp": "$P(S \\cup F) = \\frac{31}{40}$."}, {"id": 493, "topic": "Statistics", "subtopic": "Probability and Two-Way Tables", "type": "grid", "q": "A fair six-sided die is rolled twice. What is the probability the sum of the two rolls is $9$? (Enter `1/9`.)", "ans": "1/9", "exp": "Favorable pairs summing to $9$: $(3,6),(4,5),(5,4),(6,3)$ — that is $4$ out of $36$ outcomes $= \\frac{4}{36} = \\frac{1}{9}$."}, {"id": 494, "topic": "Statistics", "subtopic": "Probability and Two-Way Tables", "type": "grid", "q": "A spinner has $8$ equal sectors numbered $1$ through $8$. What is the probability of spinning a number that is both odd and greater than $4$? (Enter `1/4`.)", "ans": "1/4", "exp": "Numbers $>4$ and odd in $1..8$ are $5$ and $7$ ($2$ outcomes out of $8$). Probability $= \\frac{2}{8} = \\frac{1}{4}$."}, {"id": 495, "topic": "Statistics", "subtopic": "Probability and Two-Way Tables", "type": "grid", "q": "In a two-way table of $300$ customers: $180$ bought online and $120$ bought in-store. Of online buyers, $45$ used a coupon; of in-store buyers, $30$ used a coupon. What percentage of ALL customers used a coupon?", "ans": "25", "exp": "Total using coupon $= 45 + 30 = 75$. Percentage $= \\frac{75}{300} = 25\\%$."}, {"id": 496, "topic": "Statistics", "subtopic": "Probability and Two-Way Tables", "type": "grid", "q": "In a two-way table of $300$ customers ($180$ online with $45$ coupons; $120$ in-store with $30$ coupons), what percentage of IN-STORE buyers used a coupon?", "ans": "25", "exp": "$\\frac{30}{120} = 0.25 = 25\\%$."}, {"id": 497, "topic": "Statistics", "subtopic": "Probability and Two-Way Tables", "type": "grid", "q": "Events $A$ and $B$ are independent with $P(A) = 0.4$ and $P(B) = 0.5$. What is $P(A \\text{ and } B)$?", "ans": "0.2", "exp": "For independent events, $P(A \\cap B) = P(A)P(B) = 0.4 \\times 0.5 = 0.2$."}, {"id": 498, "topic": "Statistics", "subtopic": "Probability and Two-Way Tables", "type": "grid", "q": "Events $A$ and $B$ are mutually exclusive (disjoint) with $P(A) = 0.35$ and $P(B) = 0.25$. What is $P(A \\text{ or } B)$?", "ans": "0.6", "exp": "For mutually exclusive events, $P(A \\cup B) = P(A) + P(B) = 0.35 + 0.25 = 0.6$."}, {"id": 499, "topic": "Statistics", "subtopic": "Probability and Two-Way Tables", "type": "grid", "q": "A standard deck of $52$ cards has $4$ aces. One card is drawn at random. What is the probability it is NOT an ace? (Enter `12/13`.)", "ans": "12/13", "exp": "$P(\\text{not ace}) = 1 - \\frac{4}{52} = 1 - \\frac{1}{13} = \\frac{12}{13}$."}, {"id": 500, "topic": "Statistics", "subtopic": "Probability and Two-Way Tables", "type": "grid", "q": "In a survey of $120$ people, $72$ drink coffee and $48$ do not. If one person is picked at random, what is the probability they drink coffee? (Enter `0.6`.)", "ans": "0.6", "exp": "$\\frac{72}{120} = 0.6$."}, {"id": 501, "topic": "Geometry and Trigonometry", "subtopic": "Area and Volume Word Problems", "type": "grid", "q": "A right circular cylinder has radius $5$ cm and height $12$ cm. What is its volume in terms of $\\pi$? (Enter `300pi`.)", "ans": "300pi", "exp": "$V = \\pi r^2 h = \\pi (5^2)(12) = 300\\pi\\text{ cm}^3$."}, {"id": 502, "topic": "Geometry and Trigonometry", "subtopic": "Area and Volume Word Problems", "type": "grid", "q": "A rectangular prism has length $8$ in, width $4.5$ in, and height $6$ in. What is its volume in cubic inches?", "ans": "216", "exp": "$V = 8 \\times 4.5 \\times 6 = 36 \\times 6 = 216\\text{ in}^3$."}, {"id": 503, "topic": "Geometry and Trigonometry", "subtopic": "Area and Volume Word Problems", "type": "grid", "q": "A right circular cone has base radius $6$ cm and height $10$ cm. What is its volume in terms of $\\pi$? (Enter `120pi`.)", "ans": "120pi", "exp": "$V = \\frac{1}{3}\\pi r^2 h = \\frac{1}{3}\\pi(36)(10) = 120\\pi\\text{ cm}^3$."}, {"id": 504, "topic": "Geometry and Trigonometry", "subtopic": "Area and Volume Word Problems", "type": "grid", "q": "A sphere has radius $3$ cm. What is its volume in terms of $\\pi$? (Enter `36pi`.)", "ans": "36pi", "exp": "$V = \\frac{4}{3}\\pi r^3 = \\frac{4}{3}\\pi(27) = 36\\pi\\text{ cm}^3$."}, {"id": 505, "topic": "Geometry and Trigonometry", "subtopic": "Area and Volume Word Problems", "type": "grid", "q": "A trapezoid has parallel bases of length $11$ cm and $19$ cm, and height $8$ cm. What is the area of the trapezoid in $\\text{cm}^2$?", "ans": "120", "exp": "$A = \\frac{b_1 + b_2}{2} \\cdot h = \\frac{11 + 19}{2} \\times 8 = 15 \\times 8 = 120\\text{ cm}^2$."}, {"id": 506, "topic": "Geometry and Trigonometry", "subtopic": "Area and Volume Word Problems", "type": "grid", "q": "A square has diagonal of length $10\\sqrt{2}$ cm. What is the area of the square in $\\text{cm}^2$?", "ans": "200", "exp": "For a square with side $s$, diagonal $= s\\sqrt{2} = 10\\sqrt{2} \\implies s = 10$. Area $= s^2 = 100$? Wait: $s = 10 \\implies s^2 = 100$! Let's check: $10^2 = 100$. Answer is $100$."}, {"id": 507, "topic": "Geometry and Trigonometry", "subtopic": "Area and Volume Word Problems", "type": "grid", "q": "A circular pizza of diameter $16$ inches is cut into $8$ equal slices. What is the area of one slice in terms of $\\pi$? (Enter `8pi`.)", "ans": "8pi", "exp": "Radius $r = 8$. Total area $= 64\\pi$. One eighth $= \\frac{64\\pi}{8} = 8\\pi\\text{ in}^2$."}, {"id": 508, "topic": "Geometry and Trigonometry", "subtopic": "Area and Volume Word Problems", "type": "grid", "q": "A right rectangular prism (box) has dimensions $3$ m, $4$ m, and $5$ m. What is its total surface area in $\\text{m}^2$?", "ans": "94", "exp": "$SA = 2(3\\cdot 4 + 3\\cdot 5 + 4\\cdot 5) = 2(12 + 15 + 20) = 2(47) = 94\\text{ m}^2$."}, {"id": 509, "topic": "Geometry and Trigonometry", "subtopic": "Area and Volume Word Problems", "type": "grid", "q": "A triangle has base $14$ cm and area $63\\text{ cm}^2$. What is the height corresponding to that base, in cm?", "ans": "9", "exp": "$A = \\frac{1}{2}bh \\implies 63 = \\frac{1}{2}(14)h = 7h \\implies h = 9$ cm."}, {"id": 510, "topic": "Geometry and Trigonometry", "subtopic": "Area and Volume Word Problems", "type": "grid", "q": "A cube has total surface area $150\\text{ cm}^2$. What is the volume of the cube in $\\text{cm}^3$?", "ans": "125", "exp": "Surface area $= 6s^2 = 150 \\implies s^2 = 25 \\implies s = 5$. Volume $= s^3 = 125\\text{ cm}^3$."}, {"id": 511, "topic": "Geometry and Trigonometry", "subtopic": "Area and Volume Word Problems", "type": "grid", "q": "A sector of a circle with radius $12$ cm has a central angle of $60^\\circ$. What is the area of the sector in terms of $\\pi$? (Enter `24pi`.)", "ans": "24pi", "exp": "$A_{\\text{sector}} = \\frac{60}{360}\\pi(12^2) = \\frac{1}{6}(144\\pi) = 24\\pi\\text{ cm}^2$."}, {"id": 512, "topic": "Geometry and Trigonometry", "subtopic": "Area and Volume Word Problems", "type": "grid", "q": "A rectangular swimming pool is $25$ m long, $12$ m wide, and has a uniform depth of $2$ m. How many cubic meters of water does it hold?", "ans": "600", "exp": "$V = 25 \\times 12 \\times 2 = 600\\text{ m}^3$."}, {"id": 513, "topic": "Geometry and Trigonometry", "subtopic": "Right Triangle Trigonometry Word Problems", "type": "mcq", "q": "From a point $80$ meters away from the base of a vertical tower on level ground, the angle of elevation to the top of the tower is $35^\\circ$. Which expression gives the height $h$ of the tower in meters?", "ans": "A", "exp": "In a right triangle, $\\tan(35^\\circ) = \\frac{\\text{opposite}}{\\text{adjacent}} = \\frac{h}{80}$, so $h = 80\\tan(35^\\circ)$.", "options": ["$80\\tan(35^\\circ)$", "$80\\sin(35^\\circ)$", "$80\\cos(35^\\circ)$", "$\\frac{80}{\\tan(35^\\circ)}$"]}, {"id": 514, "topic": "Geometry and Trigonometry", "subtopic": "Right Triangle Trigonometry Word Problems", "type": "grid", "q": "A $25$-foot ladder leans against a vertical wall so that the base of the ladder is $7$ feet from the wall. What is $\\cos(\\theta)$, where $\\theta$ is the angle between the ladder and the ground? (Enter `7/25`.)", "ans": "7/25", "exp": "Adjacent side to $\\theta$ is $7$ ft and hypotenuse is $25$ ft, so $\\cos(\\theta) = \\frac{7}{25}$."}, {"id": 515, "topic": "Geometry and Trigonometry", "subtopic": "Right Triangle Trigonometry Word Problems", "type": "grid", "q": "In right triangle $ABC$ with right angle at $C$, $\\sin(A) = \\frac{5}{13}$. What is $\\cos(B)$? (Enter `5/13`.)", "ans": "5/13", "exp": "Since $A + B = 90^\\circ$ are complementary angles in a right triangle, $\\cos(B) = \\sin(A) = \\frac{5}{13}$."}, {"id": 516, "topic": "Geometry and Trigonometry", "subtopic": "Right Triangle Trigonometry Word Problems", "type": "grid", "q": "In right triangle $DEF$ with right angle at $F$, $\\sin(D) = 0.6$. What is $\\cos(D)$? (Enter `0.8`.)", "ans": "0.8", "exp": "Using $\\sin^2(D) + \\cos^2(D) = 1$: $(0.6)^2 + \\cos^2(D) = 1 \\implies \\cos^2(D) = 0.64 \\implies \\cos(D) = 0.8$."}, {"id": 517, "topic": "Geometry and Trigonometry", "subtopic": "Right Triangle Trigonometry Word Problems", "type": "grid", "q": "A ramp rises $3$ feet vertically over a horizontal distance of $12$ feet. What is $\\tan(\\theta)$ for the ramp's angle of elevation $\\theta$? (Enter `1/4`.)", "ans": "1/4", "exp": "$\\tan(\\theta) = \\frac{\\text{rise}}{\\text{run}} = \\frac{3}{12} = \\frac{1}{4}$."}, {"id": 518, "topic": "Geometry and Trigonometry", "subtopic": "Right Triangle Trigonometry Word Problems", "type": "mcq", "q": "An observer at the top of a $120$-foot lighthouse looks down at a boat at an angle of depression of $28^\\circ$. Which expression gives the horizontal distance $d$ from the base of the lighthouse to the boat?", "ans": "A", "exp": "The angle of elevation from boat to lighthouse top equals $28^\\circ$; $\\tan(28^\\circ) = \\frac{120}{d} \\implies d = \\frac{120}{\\tan(28^\\circ)}$.", "options": ["$\\frac{120}{\\tan(28^\\circ)}$", "$120\\tan(28^\\circ)$", "$120\\sin(28^\\circ)$", "$\\frac{120}{\\sin(28^\\circ)}$"]}, {"id": 519, "topic": "Geometry and Trigonometry", "subtopic": "Right Triangle Trigonometry Word Problems", "type": "grid", "q": "For any acute angle $x$ where $\\sin(x) = \\cos(2x - 15^\\circ)$, what is a possible value of $x$?", "ans": "35", "exp": "Complementary acute angles sum to $90^\\circ$: $x + (2x - 15) = 90 \\implies 3x = 105 \\implies x = 35$."}, {"id": 520, "topic": "Geometry and Trigonometry", "subtopic": "Right Triangle Trigonometry Word Problems", "type": "grid", "q": "A kite is on a taut string of length $100$ meters making a $60^\\circ$ angle with the horizontal ground. What is the height of the kite above the ground, in meters? (Enter `50sqrt(3)`.)", "ans": "50sqrt(3)", "exp": "$h = 100\\sin(60^\\circ) = 100 \\cdot \\frac{\\sqrt{3}}{2} = 50\\sqrt{3}$ meters."}, {"id": 521, "topic": "Geometry and Trigonometry", "subtopic": "Right Triangle Trigonometry Word Problems", "type": "grid", "q": "In a right triangle with hypotenuse $17$ and one leg $8$, what is the sine of the angle opposite the leg of length $8$? (Enter `8/17`.)", "ans": "8/17", "exp": "$\\sin(\\theta) = \\frac{\\text{opposite}}{\\text{hypotenuse}} = \\frac{8}{17}$."}, {"id": 522, "topic": "Geometry and Trigonometry", "subtopic": "Right Triangle Trigonometry Word Problems", "type": "grid", "q": "In a right triangle with hypotenuse $17$ and one leg $8$, what is the cosine of the angle opposite the leg of length $8$? (Enter `15/17`.)", "ans": "15/17", "exp": "Other leg $= \\sqrt{17^2 - 8^2} = \\sqrt{225} = 15$. Adjacent to that angle is $15$, so $\\cos(\\theta) = \\frac{15}{17}$."}, {"id": 523, "topic": "Geometry and Trigonometry", "subtopic": "Right Triangle Trigonometry Word Problems", "type": "mcq", "q": "A surveyor measures the angle of elevation to the top of a hill as $20^\\circ$ from a point $300$ meters away. Which expression equals the height of the hill?", "ans": "A", "exp": "Opposite $= 300\\tan(20^\\circ)$ in the right triangle formed with horizontal ground.", "options": ["$300\\tan(20^\\circ)$", "$300\\cos(20^\\circ)$", "$\\frac{300}{\\cos(20^\\circ)}$", "$300\\sin(20^\\circ)$"]}, {"id": 524, "topic": "Geometry and Trigonometry", "subtopic": "Right Triangle Trigonometry Word Problems", "type": "grid", "q": "If $\\tan(\\theta) = \\frac{3}{4}$ and $\\theta$ is an acute angle, what is $\\sin(\\theta)$? (Enter `3/5`.)", "ans": "3/5", "exp": "A $3$-$4$-$5$ right triangle gives hypotenuse $5$, so $\\sin(\\theta) = \\frac{3}{5}$."}, {"id": 525, "topic": "Geometry and Trigonometry", "subtopic": "Congruence", "type": "grid", "q": "Triangles $ABC$ and $DEF$ are congruent ($\\triangle ABC \\cong \\triangle DEF$). If $AB = 3x + 4$, $DE = 5x - 10$, and $BC = 19$, what is the length of $EF$?", "ans": "25", "exp": "Corresponding sides are equal: $3x + 4 = 5x - 10 \\implies 2x = 14 \\implies x = 7$. Then $AB = 3(7) + 4 = 25$, so $EF = BC = 19$? Wait: $BC = 19 \\implies EF = 19$! Let's check: $3(7)+4 = 25$ and $5(7)-10 = 25$, while $EF = BC = 19$. Answer is $19$."}, {"id": 526, "topic": "Geometry and Trigonometry", "subtopic": "Congruence", "type": "mcq", "q": "Which criterion is NOT sufficient on its own to guarantee that two triangles are congruent?", "ans": "A", "exp": "SSA (Angle-Side-Angle non-included, or Side-Side-Angle) does not guarantee congruence in general.", "options": ["SSA (two sides and a non-included angle)", "SSS (three sides)", "SAS (two sides and the included angle)", "ASA (two angles and the included side)"]}, {"id": 527, "topic": "Geometry and Trigonometry", "subtopic": "Congruence", "type": "grid", "q": "In $\\triangle PQR \\cong \\triangle XYZ$, $\\angle P = 48^\\circ$ and $\\angle Y = 77^\\circ$. What is the measure of $\\angle Z$, in degrees?", "ans": "55", "exp": "$\\angle X = \\angle P = 48^\\circ$ and $\\angle Y = 77^\\circ$. Since angles in a triangle sum to $180^\\circ$, $\\angle Z = 180^\\circ - 48^\\circ - 77^\\circ = 55^\\circ$."}, {"id": 528, "topic": "Geometry and Trigonometry", "subtopic": "Congruence", "type": "mcq", "q": "Two right triangles have hypotenuses of equal length and one pair of corresponding acute angles congruent. By which rule are the right triangles congruent?", "ans": "A", "exp": "If hypotenuse and one acute angle match, the other acute angle also matches (AAS/HA).", "options": ["HA (Hypotenuse-Angle) / AAS", "AAA", "SSA", "None of these"]}, {"id": 529, "topic": "Geometry and Trigonometry", "subtopic": "Congruence", "type": "mcq", "q": "If $\\triangle ABC \\cong \\triangle XYZ$, which segment MUST be congruent to $\\overline{AC}$?", "ans": "A", "exp": "Matching first and third letters of the congruence statement gives $\\overline{XZ}$.", "options": ["$\\overline{XZ}$", "$\\overline{XY}$", "$\\overline{YZ}$", "$\\overline{AB}$"]}, {"id": 530, "topic": "Geometry and Trigonometry", "subtopic": "Congruence", "type": "mcq", "q": "In isosceles $\\triangle ABC$ with $AB = AC$, point $D$ is the midpoint of $\\overline{BC}$. By which congruence criterion are $\\triangle ABD$ and $\\triangle ACD$ congruent?", "ans": "A", "exp": "$AB = AC$, $BD = CD$, and $AD = AD$ (shared side), giving SSS congruence.", "options": ["SSS", "AAA", "SSA", "None of these"]}, {"id": 531, "topic": "Geometry and Trigonometry", "subtopic": "Congruence", "type": "grid", "q": "If two triangles are congruent, what is the ratio of their areas?", "ans": "1", "exp": "Congruent figures have identical areas, so the ratio is $1 : 1 = 1$."}, {"id": 532, "topic": "Geometry and Trigonometry", "subtopic": "Congruence", "type": "mcq", "q": "In $\\triangle ABC$ and $\\triangle DEF$, $AB = DE$, $\\angle A = \\angle D$, and $AC = DF$. Which postulate proves $\\triangle ABC \\cong \\triangle DEF$?", "ans": "A", "exp": "Two sides and the included angle match: SAS.", "options": ["SAS", "SSS", "ASA", "HL"]}, {"id": 533, "topic": "Geometry and Trigonometry", "subtopic": "Congruence", "type": "mcq", "q": "Diagonal $\\overline{AC}$ of parallelogram $ABCD$ divides it into two triangles. Are $\\triangle ABC$ and $\\triangle CDA$ congruent?", "ans": "A", "exp": "Opposite sides of a parallelogram are equal ($AB=CD, BC=AD$) and $AC$ is shared, so $\\triangle ABC \\cong \\triangle CDA$ by SSS.", "options": ["Yes, by SSS", "No, parallelograms never have congruent triangles", "Yes, only if it is a rectangle", "Only if all angles are $60^\\circ$"]}, {"id": 534, "topic": "Geometry and Trigonometry", "subtopic": "Congruence", "type": "grid", "q": "If $\\triangle LMN \\cong \\triangle RST$ and $MN = 4y - 3$ while $ST = 2y + 11$, what is the value of $y$?", "ans": "7", "exp": "$4y - 3 = 2y + 11 \\implies 2y = 14 \\implies y = 7$."}, {"id": 535, "topic": "Geometry and Trigonometry", "subtopic": "Congruence", "type": "mcq", "q": "Which condition guarantees two triangles are congruent when two angles and the included side of one equal two angles and the included side of the other?", "ans": "A", "exp": "By definition, ASA stands for Angle-Side-Angle.", "options": ["ASA", "SSS", "HL", "SSA"]}, {"id": 536, "topic": "Geometry and Trigonometry", "subtopic": "Congruence", "type": "grid", "q": "If $\\triangle ABC \\cong \\triangle DEF$, and the perimeter of $\\triangle ABC$ is $42$ cm, what is the perimeter of $\\triangle DEF$?", "ans": "42", "exp": "Congruent triangles have equal corresponding side lengths and therefore equal perimeters ($42$ cm)."}, {"id": 537, "topic": "Geometry and Trigonometry", "subtopic": "Similarity", "type": "grid", "q": "Triangles $ABC$ and $DEF$ are similar ($\\triangle ABC \\sim \\triangle DEF$). If $AB = 6$, $DE = 9$, and $BC = 10$, what is the length of $EF$?", "ans": "15", "exp": "Scale factor from $\\triangle ABC$ to $\\triangle DEF$ is $\\frac{9}{6} = 1.5$. Thus $EF = 10 \\times 1.5 = 15$."}, {"id": 538, "topic": "Geometry and Trigonometry", "subtopic": "Similarity", "type": "grid", "q": "Two similar polygons have corresponding side lengths in the ratio $3 : 5$. What is the ratio of their areas? (Enter `9/25`.)", "ans": "9/25", "exp": "Area ratio equals the square of the linear scale factor: $(\\frac{3}{5})^2 = \\frac{9}{25}$."}, {"id": 539, "topic": "Geometry and Trigonometry", "subtopic": "Similarity", "type": "grid", "q": "Two similar solids have corresponding edge lengths in the ratio $2 : 3$. What is the ratio of their volumes? (Enter `8/27`.)", "ans": "8/27", "exp": "Volume ratio equals the cube of the linear scale factor: $(\\frac{2}{3})^3 = \\frac{8}{27}$."}, {"id": 540, "topic": "Geometry and Trigonometry", "subtopic": "Similarity", "type": "grid", "q": "In $\\triangle XYZ \\sim \\triangle PQR$, $\\angle X = 38^\\circ$ and $\\angle Q = 74^\\circ$. What is the measure of $\\angle R$, in degrees?", "ans": "68", "exp": "Since $\\triangle XYZ \\sim \\triangle PQR$, $\\angle P = \\angle X = 38^\\circ$ and $\\angle Q = 74^\\circ$. Thus $\\angle R = 180^\\circ - 38^\\circ - 74^\\circ = 68^\\circ$."}, {"id": 541, "topic": "Geometry and Trigonometry", "subtopic": "Similarity", "type": "grid", "q": "A line parallel to side $\\overline{BC}$ of $\\triangle ABC$ intersects $\\overline{AB}$ at $D$ and $\\overline{AC}$ at $E$. If $AD = 4$, $DB = 6$, and $AE = 6$, what is the length of $EC$?", "ans": "9", "exp": "By basic proportionality (Thales's theorem): $\\frac{AD}{DB} = \\frac{AE}{EC} \\implies \\frac{4}{6} = \\frac{6}{EC} \\implies 4 \\cdot EC = 36 \\implies EC = 9$."}, {"id": 542, "topic": "Geometry and Trigonometry", "subtopic": "Similarity", "type": "grid", "q": "Two similar triangles have perimeters of $24$ cm and $36$ cm. If the area of the smaller triangle is $32\\text{ cm}^2$, what is the area of the larger triangle in $\\text{cm}^2$?", "ans": "72", "exp": "Linear scale factor $= \\frac{36}{24} = \\frac{3}{2}$. Area ratio $= (\\frac{3}{2})^2 = \\frac{9}{4}$. Larger area $= 32 \\times \\frac{9}{4} = 72\\text{ cm}^2$."}, {"id": 543, "topic": "Geometry and Trigonometry", "subtopic": "Similarity", "type": "mcq", "q": "Which similarity criterion requires only two pairs of congruent corresponding angles?", "ans": "A", "exp": "AA (Angle-Angle) similarity states that two triangles with two pairs of congruent angles are similar.", "options": ["AA similarity", "SSS congruence", "HL congruence", "SAS congruence"]}, {"id": 544, "topic": "Geometry and Trigonometry", "subtopic": "Similarity", "type": "grid", "q": "A flagpole casts a $12$-foot shadow at the same time a $6$-foot-tall person casts a $4.5$-foot shadow. What is the height of the flagpole, in feet?", "ans": "16", "exp": "$\\frac{h}{12} = \\frac{6}{4.5} = \\frac{4}{3} \\implies h = 12 \\times \\frac{4}{3} = 16$ feet."}, {"id": 545, "topic": "Geometry and Trigonometry", "subtopic": "Similarity", "type": "grid", "q": "If two similar rectangles have a scale factor of $1.25$, and the smaller rectangle has area $64\\text{ cm}^2$, what is the area of the larger rectangle in $\\text{cm}^2$?", "ans": "100", "exp": "Area scales by $(1.25)^2 = 1.5625$. $64 \\times 1.5625 = 100\\text{ cm}^2$."}, {"id": 546, "topic": "Geometry and Trigonometry", "subtopic": "Similarity", "type": "grid", "q": "In $\\triangle ABC \\sim \\triangle DEF$, side $AB = 8$ corresponds to $DE = 12$, and median $AM = 5$ corresponds to median $DN$. What is the length of $DN$?", "ans": "7.5", "exp": "Corresponding lengths (sides, altitudes, medians, perimeters) in similar triangles share the linear scale factor $\\frac{12}{8} = 1.5$. $DN = 5 \\times 1.5 = 7.5$."}, {"id": 547, "topic": "Geometry and Trigonometry", "subtopic": "Similarity", "type": "grid", "q": "Two similar cylinders have volumes $27\\pi\\text{ cm}^3$ and $125\\pi\\text{ cm}^3$. What is the ratio of the radius of the smaller cylinder to the radius of the larger cylinder? (Enter `3/5`.)", "ans": "3/5", "exp": "Volume ratio $= \\frac{27}{125}$, so linear radius ratio $= \\sqrt[3]{\\frac{27}{125}} = \\frac{3}{5}$."}, {"id": 548, "topic": "Geometry and Trigonometry", "subtopic": "Similarity", "type": "grid", "q": "A photo is $8$ inches wide by $10$ inches tall. If it is scaled similarly so its width becomes $12$ inches, what is its new height in inches?", "ans": "15", "exp": "Scale factor $= \\frac{12}{8} = 1.5$. New height $= 10 \\times 1.5 = 15$ inches."}, {"id": 549, "topic": "Geometry and Trigonometry", "subtopic": "Right Triangles", "type": "grid", "q": "In a right triangle, the two legs have lengths $9$ and $12$. What is the length of the hypotenuse?", "ans": "15", "exp": "$c = \\sqrt{9^2 + 12^2} = \\sqrt{81 + 144} = \\sqrt{225} = 15$."}, {"id": 550, "topic": "Geometry and Trigonometry", "subtopic": "Right Triangles", "type": "grid", "q": "In a $30^\\circ$-$60^\\circ$-$90^\\circ$ right triangle, the side opposite the $30^\\circ$ angle has length $7$. What is the length of the hypotenuse?", "ans": "14", "exp": "In a $30^\\circ$-$60^\\circ$-$90^\\circ$ triangle, hypotenuse $= 2 \\times (\\text{short leg}) = 2(7) = 14$."}, {"id": 551, "topic": "Geometry and Trigonometry", "subtopic": "Right Triangles", "type": "grid", "q": "In a $30^\\circ$-$60^\\circ$-$90^\\circ$ right triangle, the side opposite the $30^\\circ$ angle has length $7$. What is the length of the side opposite the $60^\\circ$ angle? (Enter `7sqrt(3)`.)", "ans": "7sqrt(3)", "exp": "Long leg $= \\sqrt{3} \\times (\\text{short leg}) = 7\\sqrt{3}$."}, {"id": 552, "topic": "Geometry and Trigonometry", "subtopic": "Right Triangles", "type": "grid", "q": "In a $45^\\circ$-$45^\\circ$-$90^\\circ$ isosceles right triangle, each leg has length $8$. What is the length of the hypotenuse? (Enter `8sqrt(2)`.)", "ans": "8sqrt(2)", "exp": "Hypotenuse $= s\\sqrt{2} = 8\\sqrt{2}$."}, {"id": 553, "topic": "Geometry and Trigonometry", "subtopic": "Right Triangles", "type": "grid", "q": "In a $45^\\circ$-$45^\\circ$-$90^\\circ$ right triangle, the hypotenuse has length $12$. What is the length of each leg? (Enter `6sqrt(2)`.)", "ans": "6sqrt(2)", "exp": "Each leg $= \\frac{\\text{hypotenuse}}{\\sqrt{2}} = \\frac{12}{\\sqrt{2}} = 6\\sqrt{2}$."}, {"id": 554, "topic": "Geometry and Trigonometry", "subtopic": "Right Triangles", "type": "grid", "q": "A right triangle has hypotenuse $26$ and one leg $10$. What is the length of the other leg?", "ans": "24", "exp": "$b = \\sqrt{26^2 - 10^2} = \\sqrt{676 - 100} = \\sqrt{576} = 24$."}, {"id": 555, "topic": "Geometry and Trigonometry", "subtopic": "Right Triangles", "type": "grid", "q": "A rectangle has width $15$ and diagonal $17$. What is the length of the rectangle?", "ans": "8", "exp": "$\\text{length} = \\sqrt{17^2 - 15^2} = \\sqrt{289 - 225} = \\sqrt{64} = 8$."}, {"id": 556, "topic": "Geometry and Trigonometry", "subtopic": "Right Triangles", "type": "grid", "q": "In right triangle $ABC$ with right angle at $C$, altitude $\\overline{CD}$ is drawn to hypotenuse $\\overline{AB}$. If $AD = 4$ and $DB = 9$, what is the length of altitude $CD$?", "ans": "6", "exp": "By the geometric mean theorem for altitudes to the hypotenuse, $CD^2 = AD \\cdot DB = 4 \\times 9 = 36 \\implies CD = 6$."}, {"id": 557, "topic": "Geometry and Trigonometry", "subtopic": "Right Triangles", "type": "grid", "q": "Using the same right triangle setup ($CD$ altitude to hypotenuse $AB$ with $AD = 4$ and $DB = 9$), what is the length of leg $AC$?", "ans": "2sqrt(13)", "exp": "By the leg geometric mean theorem, $AC^2 = AD \\cdot AB = 4 \\times 13 = 52 \\implies AC = \\sqrt{52} = 2\\sqrt{13}$."}, {"id": 558, "topic": "Geometry and Trigonometry", "subtopic": "Right Triangles", "type": "grid", "q": "A right triangle has legs of length $5$ and $12$. What is the area of this right triangle?", "ans": "30", "exp": "Area $= \\frac{1}{2} \\times 5 \\times 12 = 30$."}, {"id": 559, "topic": "Geometry and Trigonometry", "subtopic": "Right Triangles", "type": "grid", "q": "A ladder of length $13$ feet leans against a vertical wall with its foot $5$ feet from the wall. How high up the wall (in feet) does the top of the ladder reach?", "ans": "12", "exp": "Height $= \\sqrt{13^2 - 5^2} = \\sqrt{169 - 25} = \\sqrt{144} = 12$ feet."}, {"id": 560, "topic": "Geometry and Trigonometry", "subtopic": "Right Triangles", "type": "grid", "q": "In a right triangle, the side lengths are $x$, $x + 7$, and $x + 8$ (where $x + 8$ is the hypotenuse). What is the value of $x$?", "ans": "7", "exp": "$x^2 + (x+7)^2 = (x+8)^2 \\implies x^2 + x^2 + 14x + 49 = x^2 + 16x + 64 \\implies x^2 - 2x - 15 = 0 \\implies (x-5)(x+3) = 0$. Since $x > 0$, $x = 5$! Let's check: $5^2 + 12^2 = 25 + 144 = 169 = 13^2$. Answer is $5$."}, {"id": 561, "topic": "Geometry and Trigonometry", "subtopic": "Circles", "type": "grid", "q": "A circle in the $xy$-plane is given by $(x - 4)^2 + (y + 7)^2 = 49$. What is the radius of the circle?", "ans": "7", "exp": "Standard form $(x - h)^2 + (y - k)^2 = r^2$ gives $r^2 = 49$, so $r = 7$."}, {"id": 562, "topic": "Geometry and Trigonometry", "subtopic": "Circles", "type": "grid", "q": "What is the center of the circle given by $(x + 3)^2 + (y - 9)^2 = 16$? (Enter as `(-3,9)`.)", "ans": "(-3,9)", "exp": "Comparing with $(x - h)^2 + (y - k)^2 = r^2$, we get $h = -3$ and $k = 9$."}, {"id": 563, "topic": "Geometry and Trigonometry", "subtopic": "Circles", "type": "grid", "q": "A circle has center $(2, -5)$ and passes through the point $(6, -2)$. What is the radius of the circle?", "ans": "5", "exp": "$r = \\sqrt{(6 - 2)^2 + (-2 - (-5))^2} = \\sqrt{4^2 + 3^2} = \\sqrt{16 + 9} = 5$."}, {"id": 564, "topic": "Geometry and Trigonometry", "subtopic": "Circles", "type": "grid", "q": "If a circle has center $(2, -5)$ and passes through $(6, -2)$, what is the constant term on the right side of its standard equation $(x - 2)^2 + (y + 5)^2 = c$?", "ans": "25", "exp": "$c = r^2 = 5^2 = 25$."}, {"id": 565, "topic": "Geometry and Trigonometry", "subtopic": "Circles", "type": "grid", "q": "The equation of a circle is $x^2 + y^2 - 6x + 8y - 11 = 0$. What is the radius of this circle?", "ans": "6", "exp": "Complete the square: $(x^2 - 6x + 9) + (y^2 + 8y + 16) = 11 + 9 + 16 \\implies (x - 3)^2 + (y + 4)^2 = 36$, so $r = 6$."}, {"id": 566, "topic": "Geometry and Trigonometry", "subtopic": "Circles", "type": "grid", "q": "For the circle $x^2 + y^2 - 6x + 8y - 11 = 0$, what is the $x$-coordinate of its center?", "ans": "3", "exp": "Completing the square yields center $(3, -4)$, so the $x$-coordinate is $3$."}, {"id": 567, "topic": "Geometry and Trigonometry", "subtopic": "Circles", "type": "grid", "q": "For the circle $x^2 + y^2 - 6x + 8y - 11 = 0$, what is the $y$-coordinate of its center?", "ans": "-4", "exp": "Completing the square yields center $(3, -4)$, so the $y$-coordinate is $-4$."}, {"id": 568, "topic": "Geometry and Trigonometry", "subtopic": "Circles", "type": "grid", "q": "In a circle with center $O$, central angle $\\angle AOB$ measures $72^\\circ$ and the radius is $10$ cm. What is the length of minor arc $\\widehat{AB}$ in terms of $\\pi$? (Enter `4pi`.)", "ans": "4pi", "exp": "Arc length $= \\frac{72}{360}(2\\pi)(10) = \\frac{1}{5}(20\\pi) = 4\\pi$ cm."}, {"id": 569, "topic": "Geometry and Trigonometry", "subtopic": "Circles", "type": "grid", "q": "In a circle of radius $12$ cm, an arc has length $3\\pi$ cm. What is the measure of the central angle subtending this arc, in degrees?", "ans": "45", "exp": "$\\frac{\\theta}{360}(2\\pi)(12) = 3\\pi \\implies \\frac{\\theta}{15}\\pi = 3\\pi \\implies \\theta = 45^\\circ$."}, {"id": 570, "topic": "Geometry and Trigonometry", "subtopic": "Circles", "type": "grid", "q": "An inscribed angle $\\angle ACB$ intercepts arc $\\widehat{AB}$ on a circle. If the measure of minor arc $\\widehat{AB}$ is $84^\\circ$, what is the measure of inscribed angle $\\angle ACB$ in degrees?", "ans": "42", "exp": "An inscribed angle equals half the measure of its intercepted arc: $\\frac{84^\\circ}{2} = 42^\\circ$."}, {"id": 571, "topic": "Geometry and Trigonometry", "subtopic": "Circles", "type": "grid", "q": "In a circle, inscribed angle $\\angle PRQ$ measures $37^\\circ$. What is the degree measure of the intercepted arc $\\widehat{PQ}$?", "ans": "74", "exp": "Intercepted arc $= 2 \\times 37^\\circ = 74^\\circ$."}, {"id": 572, "topic": "Geometry and Trigonometry", "subtopic": "Circles", "type": "grid", "q": "A triangle is inscribed in a circle such that one of its sides is a diameter of the circle. What is the measure of the angle opposite the diameter, in degrees?", "ans": "90", "exp": "By Thales's theorem, an angle inscribed in a semicircle (intercepting a $180^\\circ$ arc) is a right angle ($90^\\circ$)."}, {"id": 573, "topic": "Geometry and Trigonometry", "subtopic": "Circles", "type": "grid", "q": "Quadrilateral $ABCD$ is inscribed in a circle. If $\\angle A = 112^\\circ$, what is the measure of opposite angle $\\angle C$, in degrees?", "ans": "68", "exp": "Opposite angles of a cyclic quadrilateral are supplementary: $180^\\circ - 112^\\circ = 68^\\circ$."}, {"id": 574, "topic": "Geometry and Trigonometry", "subtopic": "Circles", "type": "grid", "q": "A line segment $\\overline{PT}$ is tangent to a circle with center $O$ at point $T$. If $OT = 6$ and $OP = 10$, what is the length of tangent segment $PT$?", "ans": "8", "exp": "A radius to a point of tangency is perpendicular to the tangent ($\\angle OTP = 90^\\circ$). Thus $PT = \\sqrt{10^2 - 6^2} = \\sqrt{64} = 8$."}, {"id": 575, "topic": "Geometry and Trigonometry", "subtopic": "Circles", "type": "grid", "q": "Two tangent segments $\\overline{PA}$ and $\\overline{PB}$ from an external point $P$ touch a circle at $A$ and $B$. If $PA = 3x + 5$ and $PB = 5x - 11$, what is the length of $PA$?", "ans": "29", "exp": "Tangent segments from a common external point are equal: $3x + 5 = 5x - 11 \\implies 2x = 16 \\implies x = 8$. Then $PA = 3(8) + 5 = 29$."}, {"id": 576, "topic": "Geometry and Trigonometry", "subtopic": "Circles", "type": "grid", "q": "In a circle, a radius of length $13$ cm is perpendicular to a chord $\\overline{AB}$. If the distance from the center to chord $\\overline{AB}$ is $5$ cm, what is the total length of chord $\\overline{AB}$ in cm?", "ans": "24", "exp": "Half-chord $= \\sqrt{13^2 - 5^2} = 12$ cm. Since a perpendicular from the center bisects the chord, $AB = 2 \\times 12 = 24$ cm."}, {"id": 577, "topic": "Geometry and Trigonometry", "subtopic": "Circles", "type": "grid", "q": "Two chords $\\overline{AB}$ and $\\overline{CD}$ intersect inside a circle at point $E$. If $AE = 4$, $EB = 9$, and $CE = 6$, what is the length of $ED$?", "ans": "6", "exp": "By the intersecting chords theorem: $AE \\cdot EB = CE \\cdot ED \\implies 4 \\cdot 9 = 6 \\cdot ED \\implies 36 = 6 \\cdot ED \\implies ED = 6$."}, {"id": 578, "topic": "Geometry and Trigonometry", "subtopic": "Circles", "type": "grid", "q": "From an external point $P$, a secant segment $\\overline{PAB}$ intersects a circle at $A$ and $B$ ($PA = 4$, $AB = 12$), and a tangent segment $\\overline{PT}$ touches the circle at $T$. What is the length of $PT$?", "ans": "8", "exp": "By the tangent-secant theorem: $PT^2 = PA \\cdot PB = 4 \\times (4 + 12) = 4 \\times 16 = 64 \\implies PT = 8$."}, {"id": 579, "topic": "Geometry and Trigonometry", "subtopic": "Circles", "type": "grid", "q": "From an external point $P$, two secants $\\overline{PAB}$ and $\\overline{PCD}$ intersect a circle. If $PA = 5$, $AB = 7$, and $PC = 6$, what is the length of $PD$?", "ans": "10", "exp": "Secant-secant power of a point: $PA \\cdot PB = PC \\cdot PD \\implies 5 \\times (5 + 7) = 6 \\times PD \\implies 60 = 6 \\cdot PD \\implies PD = 10$."}, {"id": 580, "topic": "Geometry and Trigonometry", "subtopic": "Circles", "type": "grid", "q": "A circle has circumference $18\\pi$ cm. What is the area of the circle in terms of $\\pi$? (Enter `81pi`.)", "ans": "81pi", "exp": "$C = 2\\pi r = 18\\pi \\implies r = 9$. Area $= \\pi r^2 = 81\\pi\\text{ cm}^2$."}, {"id": 581, "topic": "Geometry and Trigonometry", "subtopic": "Circles", "type": "grid", "q": "A circle has area $100\\pi\\text{ cm}^2$. What is its circumference in terms of $\\pi$? (Enter `20pi`.)", "ans": "20pi", "exp": "$\\pi r^2 = 100\\pi \\implies r = 10$. Circumference $= 2\\pi r = 20\\pi$ cm."}, {"id": 582, "topic": "Geometry and Trigonometry", "subtopic": "Circles", "type": "grid", "q": "Two concentric circles have radii $5$ cm and $9$ cm. What is the area of the ring (annulus) between them in terms of $\\pi$? (Enter `56pi`.)", "ans": "56pi", "exp": "Area $= \\pi(9^2 - 5^2) = \\pi(81 - 25) = 56\\pi\\text{ cm}^2$."}, {"id": 583, "topic": "Geometry and Trigonometry", "subtopic": "Circles", "type": "grid", "q": "A circle of radius $6$ is inscribed in a square. What is the area of the square?", "ans": "144", "exp": "Diameter of the inscribed circle equals the side length of the square: $s = 2(6) = 12$. Area $= 12^2 = 144$."}, {"id": 584, "topic": "Geometry and Trigonometry", "subtopic": "Circles", "type": "grid", "q": "A square of side length $10$ is inscribed in a circle. What is the area of the circle in terms of $\\pi$? (Enter `50pi`.)", "ans": "50pi", "exp": "The diagonal of the inscribed square is the diameter of the circle: $d = 10\\sqrt{2} \\implies r = 5\\sqrt{2}$. Area $= \\pi(5\\sqrt{2})^2 = 50\\pi$."}, {"id": 585, "topic": "Geometry and Trigonometry", "subtopic": "Circles", "type": "grid", "q": "In a circle with center $O$, points $A, B, C$ lie on the circle in order, and minor arc $\\widehat{AB}$ has measure $110^\\circ$ while minor arc $\\widehat{BC}$ has measure $70^\\circ$. What is the measure of inscribed angle $\\angle ABC$ in degrees?", "ans": "90", "exp": "Arc $\\widehat{AC}$ containing $B$ is major arc of measure $360^\\circ - (110^\\circ + 70^\\circ) = 180^\\circ$, so $\\angle ABC = \\frac{180^\\circ}{2} = 90^\\circ$."}, {"id": 586, "topic": "Geometry and Trigonometry", "subtopic": "Circles", "type": "grid", "q": "Two secants intersect outside a circle forming an angle of $25^\\circ$. If the intercepted major arc measures $110^\\circ$, what is the measure of the intercepted minor arc in degrees?", "ans": "60", "exp": "Exterior angle $= \\frac{1}{2}(\\text{far arc} - \\text{near arc}) \\implies 25 = \\frac{1}{2}(110 - m) \\implies 50 = 110 - m \\implies m = 60^\\circ$."}, {"id": 587, "topic": "Geometry and Trigonometry", "subtopic": "Circles", "type": "grid", "q": "A tangent and a secant intersect outside a circle forming an angle of $40^\\circ$, intercepting arcs of $135^\\circ$ and $x^\\circ$. What is $x$?", "ans": "55", "exp": "$40 = \\frac{1}{2}(135 - x) \\implies 80 = 135 - x \\implies x = 55$."}, {"id": 588, "topic": "Geometry and Trigonometry", "subtopic": "Circles", "type": "grid", "q": "A circle has equation $x^2 + y^2 + 10x - 4y + 4 = 0$. What is the sum of the coordinates of its center?", "ans": "-3", "exp": "Center is $(-5, 2)$. Sum $= -5 + 2 = -3$."}, {"id": 589, "topic": "Geometry and Trigonometry", "subtopic": "Circles", "type": "grid", "q": "A point $(x, y)$ lies on the circle $(x - 1)^2 + (y - 2)^2 = 100$. If $x = 9$ and $y > 2$, what is the value of $y$?", "ans": "8", "exp": "$(9 - 1)^2 + (y - 2)^2 = 100 \\implies 64 + (y - 2)^2 = 100 \\implies (y - 2)^2 = 36 \\implies y - 2 = 6$ (since $y > 2$), so $y = 8$."}, {"id": 590, "topic": "Geometry and Trigonometry", "subtopic": "Circles", "type": "grid", "q": "What is the area of a sector of a circle with radius $9$ and central angle $120^\\circ$? (Enter `27pi`.)", "ans": "27pi", "exp": "$A = \\frac{120}{360}\\pi(9^2) = \\frac{1}{3}(81\\pi) = 27\\pi$."}, {"id": 591, "topic": "Geometry and Trigonometry", "subtopic": "Circles", "type": "grid", "q": "In a circle of radius $10$, a central angle of $2.4$ radians intercepts an arc. What is the length of this arc?", "ans": "24", "exp": "In radians, arc length $s = r\\theta = 10 \\times 2.4 = 24$."}, {"id": 592, "topic": "Geometry and Trigonometry", "subtopic": "Circles", "type": "grid", "q": "A sector has radius $6$ and central angle $\\frac{\\pi}{3}$ radians. What is the area of the sector in terms of $\\pi$? (Enter `6pi`.)", "ans": "6pi", "exp": "$A = \\frac{1}{2}r^2\\theta = \\frac{1}{2}(36)\\left(\\frac{\\pi}{3}\\right) = 6\\pi$."}, {"id": 593, "topic": "Geometry and Trigonometry", "subtopic": "Circles", "type": "grid", "q": "Two circles are externally tangent and have radii $4$ and $9$. What is the distance between their centers?", "ans": "13", "exp": "Distance between centers of externally tangent circles $= r_1 + r_2 = 4 + 9 = 13$."}, {"id": 594, "topic": "Geometry and Trigonometry", "subtopic": "Circles", "type": "grid", "q": "Two circles are internally tangent and have radii $5$ and $12$. What is the distance between their centers?", "ans": "7", "exp": "Distance between centers of internally tangent circles $= |r_2 - r_1| = |12 - 5| = 7$."}, {"id": 595, "topic": "Geometry and Trigonometry", "subtopic": "Circles", "type": "grid", "q": "A regular hexagon is inscribed in a circle of radius $8$. What is the perimeter of the regular hexagon?", "ans": "48", "exp": "Each side of a regular hexagon inscribed in a circle of radius $r$ equals $r = 8$. Perimeter $= 6 \\times 8 = 48$."}, {"id": 596, "topic": "Geometry and Trigonometry", "subtopic": "Circles", "type": "grid", "q": "A chord of length $16$ is $6$ units away from the center of a circle. What is the radius of the circle?", "ans": "10", "exp": "Half-chord $= 8$, distance $= 6$. Radius $= \\sqrt{8^2 + 6^2} = 10$."}, {"id": 597, "topic": "Geometry and Trigonometry", "subtopic": "Circles", "type": "grid", "q": "If a circle has diameter endpoints at $(-2, 3)$ and $(6, -5)$, what is the $x$-coordinate of the center of the circle?", "ans": "2", "exp": "Midpoint $x$-coordinate $= \\frac{-2 + 6}{2} = 2$."}, {"id": 598, "topic": "Geometry and Trigonometry", "subtopic": "Circles", "type": "grid", "q": "If a circle has diameter endpoints at $(-2, 3)$ and $(6, -5)$, what is the $y$-coordinate of the center of the circle?", "ans": "-1", "exp": "Midpoint $y$-coordinate $= \\frac{3 + (-5)}{2} = -1$."}, {"id": 599, "topic": "Geometry and Trigonometry", "subtopic": "Circles", "type": "grid", "q": "For the circle with diameter endpoints $(-2, 3)$ and $(6, -5)$, what is the square of the radius ($r^2$)?", "ans": "32", "exp": "Center is $(2, -1)$. Distance to $(6, -5)$ gives $r^2 = (6 - 2)^2 + (-5 - (-1))^2 = 16 + 16 = 32$."}, {"id": 600, "topic": "Geometry and Trigonometry", "subtopic": "Circles", "type": "grid", "q": "An arc of a circle measures $75^\\circ$ and has length $5\\pi$ cm. What is the circumference of the entire circle in terms of $\\pi$? (Enter `24pi`.)", "ans": "24pi", "exp": "Circumference $= 5\\pi \\times \\frac{360}{75} = 5\\pi \\times \\frac{24}{5} = 24\\pi$ cm."}, {"id": 601, "topic": "Geometry and Trigonometry", "subtopic": "Circles", "type": "grid", "q": "A circle has center $(0, 0)$ and radius $13$. How many lattice points (points with integer coordinates $(x,
